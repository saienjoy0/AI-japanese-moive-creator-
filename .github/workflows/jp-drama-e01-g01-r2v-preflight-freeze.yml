name: Japanese Drama E01-G01 R2V Preflight Freeze

on:
  push:
    branches:
      - "evidence/**"
    paths:
      - ".github/workflows/jp-drama-e01-g01-r2v-preflight-freeze.yml"
      - "src/apps/jp_drama/**"
      - "assets/jp_drama/one_bunch_of_grapes/master_references/**"
      - "examples/jp_drama/dashscope_happyhorse_live_providers.json"
      - "evidence/jp_drama/happyhorse/E01-G01/r2v/**"
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e01-g01-r2v-preflight-freeze.yml"
      - "src/apps/jp_drama/**"
      - "assets/jp_drama/one_bunch_of_grapes/master_references/**"
      - "examples/jp_drama/dashscope_happyhorse_live_providers.json"
      - "evidence/jp_drama/happyhorse/E01-G01/r2v/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-r2v-preflight:
    name: Rebuild and freeze zero-call E01-G01 R2V request
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      STORYBOARD_COMMIT: 3070100f6ff25a3994a749b240f423f703cd294f
      DASHSCOPE_API_KEY: ""
      DASHSCOPE_WORKSPACE_ID: ""
      MINIMAX_API_KEY: ""
      MULEROUTER_API_KEY: ""
      ALIBABA_CLOUD_ACCESS_KEY_ID: ""
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ""
      OSS_ENDPOINT: ""
      OSS_BUCKET_NAME: ""
    steps:
      - name: Checkout AI movie creator
        uses: actions/checkout@v4

      - name: Checkout pinned Storyboard source
        uses: actions/checkout@v4
        with:
          repository: saienjoy0/Storyboard-Generator
          ref: 3070100f6ff25a3994a749b240f423f703cd294f
          path: storyboard-source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt

      - name: Import pinned production contract
        run: |
          rm -rf output/one-bunch-series output/one-bunch-preproduction output/e01-g01-r2v-freeze
          python -m src.apps.jp_drama.workflows.import_series_production_plan \
            --series-plan "storyboard-source/projects/一房の葡萄/一房の葡萄_generation_plan.yaml" \
            --asset-catalog "storyboard-source/projects/一房の葡萄/一房の葡萄_asset_catalog.yaml" \
            --output-dir output/one-bunch-series \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --minimax-h3-config examples/jp_drama/minimax_h3_live_provider.json \
            --source-commit "$STORYBOARD_COMMIT" \
            --require-route-ready

      - name: Build zero-call preproduction package
        run: |
          python -m src.apps.jp_drama.workflows.build_preproduction_package \
            --series-output output/one-bunch-series \
            --source-series-plan "storyboard-source/projects/一房の葡萄/一房の葡萄_generation_plan.yaml" \
            --source-asset-catalog "storyboard-source/projects/一房の葡萄/一房の葡萄_asset_catalog.yaml" \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --output-dir output/one-bunch-preproduction

      - name: Apply the SHA-bound human approval for all 17 masters
        run: |
          python -m src.apps.jp_drama.workflows.apply_master_reference_approval \
            --preproduction-root output/one-bunch-preproduction \
            --approval-manifest assets/jp_drama/one_bunch_of_grapes/master_references/v1/human_approval.json \
            --repository-root .

      - name: Materialize an R2V-only bundle with approved masters and pending voices
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.apps.jp_drama.assets.models import ApprovedAssetBundle

          root = Path("output/one-bunch-preproduction")
          pending_path = root / "production_contract/E01/wan/asset_bundle_pending.json"
          binding_path = root / "approval_templates/E01/wan/bindings.template.json"
          approval_path = Path(
              "assets/jp_drama/one_bunch_of_grapes/master_references/v1/human_approval.json"
          )
          output_path = root / "production_contract/E01/wan/asset_bundle_masters_approved.json"

          pending = json.loads(pending_path.read_text(encoding="utf-8"))
          bindings = json.loads(binding_path.read_text(encoding="utf-8"))
          approval = json.loads(approval_path.read_text(encoding="utf-8"))
          approved_by_source = {
              item["source_asset_id"]: item for item in approval["assets"]
          }

          materialized = []
          for asset in pending["assets"]:
              binding = bindings["assets"].get(asset["asset_id"])
              if binding is None:
                  materialized.append(asset)
                  continue
              approved = approved_by_source[binding["source_asset_id"]]
              digest = str(approved["sha256"])
              if not digest.startswith("sha256:"):
                  digest = "sha256:" + digest
              materialized.append(
                  {
                      **asset,
                      "approval_status": "approved",
                      "asset_path": approved["path"],
                      "asset_sha256": digest,
                      "mime_type": "image/png",
                      "width": approved["width"],
                      "height": approved["height"],
                      "verified_against_asset_ids": [],
                      "generated_by": approved["generated_by"],
                      "operation_id": approved["operation_id"],
                      "approved_at": approval["approved_at"],
                      "approved_by": approval["approved_by"],
                  }
              )

          bundle = ApprovedAssetBundle.build_with_digest(
              schema_version=pending["schema_version"],
              bundle_id=pending["bundle_id"],
              source_episode_id=pending["source_episode_id"],
              source_prepared_episode_digest=pending["source_prepared_episode_digest"],
              generation_plan_digest=pending["generation_plan_digest"],
              assets=materialized,
              voice_profiles=pending["voice_profiles"],
          )
          output_path.write_text(bundle.to_canonical_json() + "\n", encoding="utf-8")
          assert sum(item.approval_status == "approved" for item in bundle.assets) > 0
          assert all(profile.approval_status == "pending" for profile in bundle.voice_profiles)
          PY

      - name: Run E01-G01 HappyHorse R2V preflight with zero provider calls
        run: |
          mkdir -p output/e01-g01-r2v-freeze
          python -m src.apps.jp_drama.workflows.render_happyhorse_segment_canary \
            --prepared-input output/one-bunch-preproduction/production_contract/E01/prepared_episode.json \
            --generation-plan output/one-bunch-preproduction/production_contract/E01/wan/generation_plan_episode.json \
            --segment-id E01-G01 \
            --asset-bundle output/one-bunch-preproduction/production_contract/E01/wan/asset_bundle_masters_approved.json \
            --providers examples/jp_drama/dashscope_happyhorse_live_providers.json \
            --output output/e01-g01-r2v-freeze/E01-G01-r2v.mp4 \
            --input-mode references \
            --stage preflight \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --report output/e01-g01-r2v-freeze/preflight.json \
            --print-report

      - name: Freeze exact provider-independent request content
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("output/e01-g01-r2v-freeze")
          preflight = json.loads((root / "preflight.json").read_text(encoding="utf-8"))

          assert preflight["valid"] is True
          assert preflight["status"] == "ready_for_single_paid_submission"
          assert preflight["stage"] == "preflight"
          assert preflight["input_mode"] == "references"
          assert preflight["model"] == "happyhorse-1.1-r2v"
          assert preflight["segment_id"] == "E01-G01"
          assert preflight["request"]["duration"] == 10
          assert preflight["request"]["resolution"] == "720P"
          assert preflight["request"]["ratio"] == "9:16"
          assert preflight["external_api_calls"] == 0
          assert preflight["provider_submissions_this_run"] == 0
          assert [item["subject_id"] for item in preflight["references"]] == [
              "C01", "S01", "S05", "P03", "P04"
          ]

          approval_material = {
              "schema_version": "1.0.0",
              "purpose": "E01-G01 HappyHorse 1.1 R2V single paid-canary approval",
              "protocol": preflight["protocol"],
              "model": preflight["model"],
              "segment_id": preflight["segment_id"],
              "generation_plan_digest": preflight["generation_plan_digest"],
              "approved_asset_bundle_digest": preflight["approved_asset_bundle_digest"],
              "reference_manifest_digest": preflight["reference_manifest_digest"],
              "provider_route_id": preflight["provider_route_id"],
              "source_provider_route_id": preflight["source_provider_route_id"],
              "request": preflight["request"],
              "references": preflight["references"],
              "cost_reserve_cny": preflight["cost_reserve_cny"],
              "provider_submission_limit": 1,
              "external_tts_calls": 0,
          }
          canonical = json.dumps(
              approval_material,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          approval_digest = "sha256:" + hashlib.sha256(canonical).hexdigest()
          frozen = {
              "approval_digest": approval_digest,
              "approval_material": approval_material,
              "preflight_status": preflight["status"],
              "preflight_external_api_calls": 0,
              "implementation_commit": "${{ github.sha }}",
              "storyboard_source_commit": "3070100f6ff25a3994a749b240f423f703cd294f",
          }
          (root / "frozen_request.json").write_text(
              json.dumps(frozen, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          (root / "approval_digest.txt").write_text(approval_digest + "\n", encoding="utf-8")
          (root / "prompt.txt").write_text(preflight["request"]["prompt"] + "\n", encoding="utf-8")

          checksums = []
          for name in ["preflight.json", "frozen_request.json", "approval_digest.txt", "prompt.txt"]:
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              checksums.append(f"{digest}  {name}")
          (root / "SHA256SUMS").write_text("\n".join(checksums) + "\n", encoding="utf-8")
          print(approval_digest)
          PY

      - name: Verify content is frozen and no paid provider call occurred
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${DASHSCOPE_WORKSPACE_ID:-}"
          test ! -e output/e01-g01-r2v-freeze/E01-G01-r2v.mp4
          grep -q '"external_api_calls": 0' output/e01-g01-r2v-freeze/preflight.json
          grep -q '"provider_submissions_this_run": 0' output/e01-g01-r2v-freeze/preflight.json
          grep -q '"model": "happyhorse-1.1-r2v"' output/e01-g01-r2v-freeze/frozen_request.json
          (cd output/e01-g01-r2v-freeze && sha256sum -c SHA256SUMS)

      - name: Compare against committed frozen evidence when present
        run: |
          committed=evidence/jp_drama/happyhorse/E01-G01/r2v
          if test -d "$committed"; then
            diff -u "$committed/preflight.json" output/e01-g01-r2v-freeze/preflight.json
            diff -u "$committed/frozen_request.json" output/e01-g01-r2v-freeze/frozen_request.json
            diff -u "$committed/approval_digest.txt" output/e01-g01-r2v-freeze/approval_digest.txt
            diff -u "$committed/prompt.txt" output/e01-g01-r2v-freeze/prompt.txt
          fi

      - name: Upload frozen zero-call evidence
        uses: actions/upload-artifact@v4
        with:
          name: e01-g01-happyhorse-r2v-frozen-preflight
          path: output/e01-g01-r2v-freeze
          if-no-files-found: error
