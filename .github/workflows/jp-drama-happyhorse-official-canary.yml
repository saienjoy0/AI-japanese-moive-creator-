name: Japanese Drama HappyHorse Official Canary

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/rendering/happyhorse11.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_canary.py"
      - "tests/test_jp_drama_happyhorse_official_canary.py"
      - "examples/jp_drama/dashscope_happyhorse_live_providers.json"
      - "docs/pr30-happyhorse-official-canary.md"
      - ".github/workflows/jp-drama-happyhorse-official-canary.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/rendering/happyhorse11.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_canary.py"
      - "tests/test_jp_drama_happyhorse_official_canary.py"
      - "examples/jp_drama/dashscope_happyhorse_live_providers.json"
      - "docs/pr30-happyhorse-official-canary.md"
      - ".github/workflows/jp-drama-happyhorse-official-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  happyhorse-official-canary:
    name: Validate official payload native-audio gate and restart safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile HappyHorse implementation
        run: |
          python -m compileall -q \
            src/apps/jp_drama/rendering/happyhorse11.py \
            src/apps/jp_drama/workflows/render_happyhorse_segment_canary.py

      - name: Run official HappyHorse contract tests
        run: |
          python -m pytest -q tests/test_jp_drama_happyhorse_official_canary.py

      - name: Validate provider profile without credentials
        run: |
          python - <<'PY'
          from src.apps.jp_drama.rendering.provider_config import LiveProviderConfig

          config = LiveProviderConfig.load(
              "examples/jp_drama/dashscope_happyhorse_live_providers.json"
          )
          assert config.dashscope.region == "singapore"
          assert config.dashscope.native_av_video_model == "happyhorse-1.1-i2v"
          assert config.dashscope.video_resolution == "720P"
          assert config.dashscope.voice_by_character == {}
          PY

      - name: Assert CI made no paid provider calls
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${DASHSCOPE_WORKSPACE_ID:-}"
