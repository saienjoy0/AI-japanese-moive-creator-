name: PR11 Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize-pr11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Materialize verified PR11 payload
        run: |
          cat .pr11-payload/part-* > /tmp/pr11-payload.tar.gz
          tar -xzf /tmp/pr11-payload.tar.gz
          rm -rf .pr11-payload .github/workflows/pr11-bootstrap.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Validate implementation before publishing
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"
          python -m compileall -q src/apps/jp_drama
          python -m pytest -q tests/test_jp_drama_generation_segments.py
          rm -rf output/jp_drama/pr11-bootstrap-prepared output/jp_drama/pr11-bootstrap-generation
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input examples/jp_drama/minimal_episode_package.json \
            --output output/jp_drama/pr11-bootstrap-prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --dry-run --strict
          python -m src.apps.jp_drama.workflows.prepare_generation \
            --input output/jp_drama/pr11-bootstrap-prepared/prepared_episode.json \
            --output-dir output/jp_drama/pr11-bootstrap-generation \
            --provider-profile examples/jp_drama/generation/wan27_profile.json
          git diff --exit-code -- output/jp_drama || true
          rm -rf output/jp_drama/pr11-bootstrap-prepared output/jp_drama/pr11-bootstrap-generation

      - name: Publish materialized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: compile prepared episodes into adaptive generation segments"
          git push origin HEAD:feature/jp-drama-adaptive-generation-segments
