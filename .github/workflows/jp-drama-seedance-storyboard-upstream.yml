name: Japanese Drama Seedance Storyboard Upstream

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/seedance_storyboard/**"
      - "src/apps/jp_drama/workflows/import_seedance_storyboard.py"
      - "src/apps/jp_drama/workflows/sync_seedance_storyboard_upstream.py"
      - "examples/jp_drama/seedance_storyboard/**"
      - "tests/test_jp_drama_seedance_storyboard_import.py"
      - "third_party/seedance2_storyboard_generator/**"
      - "docs/pr19-seedance-storyboard-upstream-integration.md"
      - ".github/workflows/jp-drama-seedance-storyboard-upstream.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/seedance_storyboard/**"
      - "src/apps/jp_drama/workflows/import_seedance_storyboard.py"
      - "src/apps/jp_drama/workflows/sync_seedance_storyboard_upstream.py"
      - "examples/jp_drama/seedance_storyboard/**"
      - "tests/test_jp_drama_seedance_storyboard_import.py"
      - "third_party/seedance2_storyboard_generator/**"
      - "docs/pr19-seedance-storyboard-upstream-integration.md"
      - ".github/workflows/jp-drama-seedance-storyboard-upstream.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-compatibility:
    name: Parse native C/S/P and storyboard artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10"

      - name: Compile compatibility package
        run: python -m compileall -q src/apps/jp_drama/seedance_storyboard

      - name: Run parser regressions
        run: python -m pytest -q tests/test_jp_drama_seedance_storyboard_import.py

      - name: Import the native-format fixture
        run: |
          rm -rf output/jp_drama/seedance-storyboard
          python -m src.apps.jp_drama.workflows.import_seedance_storyboard \
            --project-dir examples/jp_drama/seedance_storyboard/upstream_fixture \
            --output-dir output/jp_drama/seedance-storyboard

      - name: Verify critical prop and continuation survived
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("output/jp_drama/seedance-storyboard/seedance_storyboard_package.json")
              .read_text(encoding="utf-8")
          )
          assets = {item["asset_id"]: item for item in payload["assets"]}
          episodes = {item["episode_id"]: item for item in payload["episodes"]}
          assert assets["P01"]["kind"] == "prop"
          assert assets["P01"]["used_in_episode_ids"] == ["E02"]
          assert episodes["E02"]["continuation_source"] == "视频1"
          assert episodes["E02"]["continuation_seconds"] == "15"
          assert len(episodes["E01"]["timeline"]) == 5
          PY

      - name: Ensure zero provider calls and no committed media
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${MULEROUTER_API_KEY:-}"
          test -z "${MINIMAX_API_KEY:-}"
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' '*.png' '*.jpg' | grep 'seedance_storyboard' || true)"

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-seedance-storyboard-package
          path: output/jp_drama/seedance-storyboard/
          if-no-files-found: error
          retention-days: 7
