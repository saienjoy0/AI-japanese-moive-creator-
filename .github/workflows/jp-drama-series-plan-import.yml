name: Japanese Drama Series Plan Import

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/series_plan/**"
      - "src/apps/jp_drama/workflows/import_series_production_plan.py"
      - "tests/test_jp_drama_series_plan_import.py"
      - "docs/pr23-series-plan-import.md"
      - ".github/workflows/jp-drama-series-plan-import.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/series_plan/**"
      - "src/apps/jp_drama/workflows/import_series_production_plan.py"
      - "tests/test_jp_drama_series_plan_import.py"
      - "docs/pr23-series-plan-import.md"
      - ".github/workflows/jp-drama-series-plan-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-series:
    name: Import pinned 一房の葡萄 three-episode contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout AI movie creator
        uses: actions/checkout@v4

      - name: Checkout pinned Storyboard source
        uses: actions/checkout@v4
        with:
          repository: saienjoy0/Storyboard-Generator
          ref: 3070100f6ff25a3994a749b240f423f703cd294f
          path: storyboard-source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10"

      - name: Compile importer
        run: |
          python -m compileall -q \
            src/apps/jp_drama/series_plan \
            src/apps/jp_drama/workflows/import_series_production_plan.py

      - name: Run real pinned integration tests
        env:
          STORYBOARD_SOURCE_DIR: storyboard-source
        run: |
          python -m pytest -q tests/test_jp_drama_series_plan_import.py

      - name: Run CLI and keep zero-call evidence
        run: |
          rm -rf output/one-bunch-series
          python -m src.apps.jp_drama.workflows.import_series_production_plan \
            --series-plan "storyboard-source/projects/一房の葡萄/一房の葡萄_generation_plan.yaml" \
            --asset-catalog "storyboard-source/projects/一房の葡萄/一房の葡萄_asset_catalog.yaml" \
            --output-dir output/one-bunch-series \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --minimax-h3-config examples/jp_drama/minimax_h3_live_provider.json \
            --source-commit 3070100f6ff25a3994a749b240f423f703cd294f \
            --require-route-ready \
            --print-report

      - name: Verify exact production outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("output/one-bunch-series")
          report = json.loads((root / "import_report.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "series_manifest.json").read_text(encoding="utf-8"))
          assert report["valid"] is True
          assert report["external_api_calls"] == 0
          assert report["episode_count"] == 3
          assert report["segment_count"] == 15
          assert manifest["rights_status"] == "public_domain"
          assert manifest["timeline_fps"] == 24
          assert manifest["episode_frame_count"] == 1200
          assert manifest["total_frame_count"] == 3600
          for episode in ("E01", "E02", "E03"):
              assert (root / episode / "prepared_episode.json").is_file()
              for route in ("h3", "wan", "seedance"):
                  assert (root / episode / route / "generation_plan_episode.json").is_file()
                  assert (root / episode / route / "asset_bundle_pending.json").is_file()
          PY

      - name: Verify credentials and paid media are absent
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${MINIMAX_API_KEY:-}"
          test -z "${MULEROUTER_API_KEY:-}"
          test "$(find output/one-bunch-series -type f -name '*.mp4' | wc -l)" -eq 0
          test "$(find output/one-bunch-series -type f -name '*.png' | wc -l)" -eq 0

      - name: Upload contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-bunch-three-episode-production-contract
          path: output/one-bunch-series
          if-no-files-found: error
