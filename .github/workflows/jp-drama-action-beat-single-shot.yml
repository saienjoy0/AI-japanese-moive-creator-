name: Japanese Drama ActionBeat Single-Shot

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/ingestion/**"
      - "examples/jp_drama/script_ingestion/**"
      - "examples/jp_drama/generation/wan27_profile.json"
      - "tests/test_jp_drama_script_ingestion.py"
      - "tests/test_jp_drama_action_beat_generation.py"
      - "docs/pr15-action-beat-single-shot.md"
      - ".github/workflows/jp-drama-action-beat-single-shot.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/ingestion/**"
      - "examples/jp_drama/script_ingestion/**"
      - "examples/jp_drama/generation/wan27_profile.json"
      - "tests/test_jp_drama_script_ingestion.py"
      - "tests/test_jp_drama_action_beat_generation.py"
      - "docs/pr15-action-beat-single-shot.md"
      - ".github/workflows/jp-drama-action-beat-single-shot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-drama-action-beat-single-shot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-beat-contract:
    name: Validate semantic ActionBeats and full Wan single-shot plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile Japanese drama packages
        run: python -m compileall -q src/apps/jp_drama

      - name: Run ActionBeat and ingestion tests
        run: |
          python -m pytest -q \
            tests/test_jp_drama_script_ingestion.py \
            tests/test_jp_drama_action_beat_generation.py \
            tests/test_jp_drama_generation_segments.py \
            tests/test_jp_drama_generation_segment_canary.py

      - name: Build full no-cost plan from normal Japanese MD
        run: |
          rm -rf output/jp_drama/pr15
          mkdir -p output/jp_drama/pr15
          python -m src.apps.jp_drama.workflows.ingest_script \
            --input examples/jp_drama/script_ingestion/sample_script.md \
            --output-dir output/jp_drama/pr15/ingestion \
            --llm-provider fixture
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input output/jp_drama/pr15/ingestion/episode_package.json \
            --output output/jp_drama/pr15/prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --strict
          python -m src.apps.jp_drama.workflows.prepare_generation \
            --input output/jp_drama/pr15/prepared/prepared_episode.json \
            --output-dir output/jp_drama/pr15/generation \
            --profile examples/jp_drama/generation/wan27_profile.json \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --require-route-ready

      - name: Verify ActionBeat and single-shot evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          structured = json.loads(Path("output/jp_drama/pr15/ingestion/structured_script.json").read_text())
          package = json.loads(Path("output/jp_drama/pr15/ingestion/episode_package.json").read_text())
          plan = json.loads(Path("output/jp_drama/pr15/generation/generation_plan_episode.json").read_text())
          report = plan["readiness_report"]

          action_beats = [item for beat in structured["beats"] for item in beat["action_beats"]]
          assert structured["schema_version"] == "1.1.0"
          assert len(action_beats) == 9
          assert len(package["shot_plan"]["shots"]) == 9
          assert sum(item["duration_seconds"] for item in package["shot_plan"]["shots"]) == 45
          assert report["planning_ready"] is True
          assert report["execution_route_ready"] is True
          assert all(len(item["editorial_shots"]) == 1 for item in plan["segments"])
          assert sum(item["editorial_frame_count"] for item in plan["segments"]) == 45 * 30
          error_codes = {item["code"] for item in report["errors"]}
          assert "insufficient_segmentation_evidence" not in error_codes
          assert "route_multi_shot_not_migrated" not in error_codes
          assert "capability_mismatch" not in error_codes
          assert report["external_api_calls"] == 0
          PY

      - name: Ensure no credential or generated media
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' '*.png' '*.jpg' | grep -E 'jp_drama|action_beat' || true)"

      - name: Upload ActionBeat planning contract
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-action-beat-single-shot-contract
          path: |
            output/jp_drama/pr15/ingestion
            output/jp_drama/pr15/prepared/readiness_report.json
            output/jp_drama/pr15/generation
          if-no-files-found: error
          retention-days: 7
