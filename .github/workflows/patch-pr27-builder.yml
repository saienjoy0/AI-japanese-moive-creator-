name: One-time PR27 builder identity fix

on:
  push:
    branches:
      - feature/jp-drama-preproduction-package
    paths:
      - ".github/workflows/patch-pr27-builder.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[patched-pr27]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jp-drama-preproduction-package
          fetch-depth: 0

      - name: Replace invalid episode-ID equality check
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/apps/jp_drama/preproduction/builder.py")
          text = path.read_text(encoding="utf-8")
          old = '''        if prepared.episode_id != artifact.episode_id:
              raise PreproductionPackageError("prepared episode ID does not match manifest")
          '''
          new = '''        if prepared.project_draft.episode_number != artifact.episode_number:
              raise PreproductionPackageError(
                  "prepared episode number does not match manifest artifact"
              )
          if prepared.project_draft.series_id != manifest.series_id:
              raise PreproductionPackageError(
                  "prepared series ID does not match manifest"
              )
          '''
          if old not in text:
              raise SystemExit("target block was not found exactly once")
          if text.count(old) != 1:
              raise SystemExit("target block is not unique")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/patch-pr27-builder.yml

      - name: Commit exact patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/apps/jp_drama/preproduction/builder.py .github/workflows/patch-pr27-builder.yml
          git commit -m "fix: align prepared episode identity with manifest [patched-pr27]"
          git push origin HEAD:feature/jp-drama-preproduction-package
