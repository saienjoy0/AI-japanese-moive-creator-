name: Japanese Drama E02 Gemini Algieba Narration

on:
  push:
    branches: [main]
    paths:
      - ".tmp/triggers/e02-algieba-narration-v1.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    name: Generate E02 Algieba narration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --quiet --upgrade google-genai

      - name: Generate narration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          rm -rf out
          mkdir -p out

          cat > /tmp/synth.py <<'PY'
          import os
          import base64
          import json
          import wave
          from pathlib import Path
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          out = Path("out")

          lines = {
              "N01": "僕は答える代りに、本当に泣き出してしまいました。",
              "N02": "先生は窓辺の葡萄を一房、もぎ取りました。",
          }

          direction = """Native Japanese adult male narrator, late 30s to early 40s.
          He is the grown-up version of a sensitive, inward-looking boy remembering childhood.
          Warm, smooth, intimate and restrained. Slightly slow, but natural.
          Do not sound like a newsreader, commercial, anime character, or documentary announcer.
          Keep sentence endings soft. Do not over-act sadness.
          Let nostalgia, regret, and the faint warmth of later forgiveness remain subtle.
          Pronounce 葡萄 as ぶどう and 一房 as ひとふさ clearly.
          """

          def write_wav(path: Path, pcm: bytes):
              with wave.open(str(path), "wb") as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(24000)
                  wf.writeframes(pcm)

          manifest = {}
          for key, text in lines.items():
              prompt = f"{direction}\nRead exactly this Japanese narration, without adding words:\n{text}"
              interaction = client.interactions.create(
                  model="gemini-3.1-flash-tts-preview",
                  input=prompt,
                  response_format={"type": "audio"},
                  generation_config={"speech_config": [{"voice": "Algieba"}]},
              )
              pcm = base64.b64decode(interaction.output_audio.data)
              wav_path = out / f"{key}_algieba.wav"
              write_wav(wav_path, pcm)
              with wave.open(str(wav_path), "rb") as wf:
                  duration = wf.getnframes() / wf.getframerate()
              manifest[key] = {
                  "text": text,
                  "voice": "Algieba",
                  "model": "gemini-3.1-flash-tts-preview",
                  "duration_seconds": duration,
                  "file": wav_path.name,
              }

          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          python /tmp/synth.py

      - name: Validate outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          import wave
          from pathlib import Path
          for path in [Path("out/N01_algieba.wav"), Path("out/N02_algieba.wav")]:
              if not path.is_file() or path.stat().st_size <= 44:
                  raise SystemExit(f"invalid output: {path}")
              with wave.open(str(path), "rb") as wf:
                  if wf.getnchannels() != 1 or wf.getsampwidth() != 2 or wf.getframerate() != 24000:
                      raise SystemExit(f"unexpected WAV format: {path}")
                  duration = wf.getnframes() / wf.getframerate()
                  if duration <= 0.2:
                      raise SystemExit(f"audio too short: {path}")
                  print(f"{path.name}: {duration:.3f}s")
          PY

      - name: Export compact Opus copies
        run: |
          set -euo pipefail
          ffmpeg -y -i out/N01_algieba.wav -c:a libopus -b:a 32k -application voip out/N01_algieba.ogg
          ffmpeg -y -i out/N02_algieba.wav -c:a libopus -b:a 32k -application voip out/N02_algieba.ogg
          ls -lh out/*.ogg

      - name: Persist generated narration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C tmp/gemini-algieba-e02-output-20260810-v1
          rm -rf .tmp/gemini_algieba_e02_narration
          mkdir -p .tmp/gemini_algieba_e02_narration
          cp out/* .tmp/gemini_algieba_e02_narration/
          git add .tmp/gemini_algieba_e02_narration
          git commit -m "tmp: add E02 Gemini Algieba narration outputs"
          git push --force origin HEAD:tmp/gemini-algieba-e02-output-20260810-v1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e02-gemini-algieba-narration-20260810
          path: out/
          if-no-files-found: error
          retention-days: 7
