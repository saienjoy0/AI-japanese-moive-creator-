name: Temporary E01 Bridge via Registered Algieba Workflow

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/jp-drama-e02-gemini-algieba-narration.yml"

permissions:
  contents: read

jobs:
  synthesize:
    if: github.head_ref == 'tmp/e01-algieba-bridge-20260810-v1'
    name: Generate E01 Algieba bridge narration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --quiet --upgrade google-genai

      - name: Generate narration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          rm -rf out
          mkdir -p out

          cat > /tmp/synth.py <<'PY'
          import os
          import base64
          import json
          import wave
          from pathlib import Path
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          out = Path("out")
          lines = {
              "N05": "昼休み、教室に残ったのは僕だけでした。",
              "N06": "僕は、そのまま先生の部屋へ連れて行かれました。",
          }
          direction = """Native Japanese adult male narrator, late 30s to early 40s.
          He is the grown-up version of a sensitive, inward-looking boy remembering childhood.
          Warm, smooth, intimate and restrained. Slightly slow, but natural.
          Do not sound like a newsreader, commercial, anime character, or documentary announcer.
          Keep sentence endings soft. Do not over-act sadness.
          Let nostalgia, regret, and the faint warmth of later forgiveness remain subtle.
          Read compactly enough to fit a short-film narration pause while keeping natural Japanese rhythm.
          """

          def write_wav(path: Path, pcm: bytes):
              with wave.open(str(path), "wb") as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(24000)
                  wf.writeframes(pcm)

          manifest = {}
          for key, text in lines.items():
              prompt = f"{direction}\nRead exactly this Japanese narration, without adding words:\n{text}"
              interaction = client.interactions.create(
                  model="gemini-3.1-flash-tts-preview",
                  input=prompt,
                  response_format={"type": "audio"},
                  generation_config={"speech_config": [{"voice": "Algieba"}]},
              )
              pcm = base64.b64decode(interaction.output_audio.data)
              wav_path = out / f"{key}_algieba.wav"
              write_wav(wav_path, pcm)
              with wave.open(str(wav_path), "rb") as wf:
                  duration = wf.getnframes() / wf.getframerate()
              manifest[key] = {
                  "text": text,
                  "voice": "Algieba",
                  "model": "gemini-3.1-flash-tts-preview",
                  "duration_seconds": duration,
                  "file": wav_path.name,
              }
          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          python /tmp/synth.py

      - name: Validate and export compact copies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import wave
          from pathlib import Path
          for path in [Path("out/N05_algieba.wav"), Path("out/N06_algieba.wav")]:
              if not path.is_file() or path.stat().st_size <= 44:
                  raise SystemExit(f"invalid output: {path}")
              with wave.open(str(path), "rb") as wf:
                  if wf.getnchannels() != 1 or wf.getsampwidth() != 2 or wf.getframerate() != 24000:
                      raise SystemExit(f"unexpected WAV format: {path}")
                  duration = wf.getnframes() / wf.getframerate()
                  if duration <= 0.2:
                      raise SystemExit(f"audio too short: {path}")
                  print(f"{path.name}: {duration:.3f}s")
          PY
          ffmpeg -y -i out/N05_algieba.wav -c:a libopus -b:a 48k -application voip out/N05_algieba.ogg
          ffmpeg -y -i out/N06_algieba.wav -c:a libopus -b:a 48k -application voip out/N06_algieba.ogg

      - name: Upload bridge narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: e01-algieba-bridge-20260810
          path: out/
          if-no-files-found: error
          retention-days: 1
