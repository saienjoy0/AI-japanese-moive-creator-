name: Temporary E01 Bridge via Registered Algieba Workflow

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".github/workflows/jp-drama-e02-gemini-algieba-narration.yml"

permissions:
  contents: read

jobs:
  synthesize:
    if: github.head_ref == 'tmp/e01-algieba-bridge-20260810-v1'
    name: Generate E01 Algieba bridge narration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --quiet --upgrade google-genai

      - name: Generate one quota-safe bridge take
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          rm -rf out
          mkdir -p out

          cat > /tmp/synth.py <<'PY'
          import os
          import re
          import time
          import base64
          import json
          import wave
          from pathlib import Path
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          out = Path("out")
          text = "昼休み、教室に残ったのは僕だけでした。僕は、そのまま先生の部屋へ連れて行かれました。"
          direction = """Native Japanese adult male narrator, late 30s to early 40s.
          He is the grown-up version of a sensitive, inward-looking boy remembering childhood.
          Warm, smooth, intimate and restrained. Slightly slow, but natural.
          Do not sound like a newsreader, commercial, anime character, or documentary announcer.
          Keep sentence endings soft. Do not over-act sadness.
          Let nostalgia, regret, and the faint warmth of later forgiveness remain subtle.
          Read the two Japanese sentences exactly as written. Insert about 1.2 seconds of complete silence between the two sentences. Do not add any spoken words.
          """
          prompt = f"{direction}\nRead exactly this Japanese narration:\n{text}"

          interaction = None
          for attempt in range(1, 6):
              try:
                  interaction = client.interactions.create(
                      model="gemini-3.1-flash-tts-preview",
                      input=prompt,
                      response_format={"type": "audio"},
                      generation_config={"speech_config": [{"voice": "Algieba"}]},
                  )
                  break
              except Exception as exc:
                  message = str(exc)
                  if "429" not in message and "quota" not in message.lower():
                      raise
                  if attempt == 5:
                      raise
                  match = re.search(r"retry in ([0-9.]+)s", message, re.I)
                  delay = float(match.group(1)) + 2.0 if match else 65.0
                  print(f"rate limited; sleeping {delay:.1f}s before retry {attempt + 1}", flush=True)
                  time.sleep(delay)

          pcm = base64.b64decode(interaction.output_audio.data)
          wav_path = out / "E01_bridge_algieba.wav"
          with wave.open(str(wav_path), "wb") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(24000)
              wf.writeframes(pcm)
          with wave.open(str(wav_path), "rb") as wf:
              duration = wf.getnframes() / wf.getframerate()
          manifest = {
              "text": text,
              "voice": "Algieba",
              "model": "gemini-3.1-flash-tts-preview",
              "duration_seconds": duration,
              "intended_pause_seconds": 1.2,
              "file": wav_path.name,
          }
          (out / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"generated {wav_path.name}: {duration:.3f}s")
          PY

          python /tmp/synth.py

      - name: Validate WAV output
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import wave
          from pathlib import Path
          path = Path("out/E01_bridge_algieba.wav")
          if not path.is_file() or path.stat().st_size <= 44:
              raise SystemExit(f"invalid output: {path}")
          with wave.open(str(path), "rb") as wf:
              if wf.getnchannels() != 1 or wf.getsampwidth() != 2 or wf.getframerate() != 24000:
                  raise SystemExit(f"unexpected WAV format: {path}")
              duration = wf.getnframes() / wf.getframerate()
              if duration <= 1.0:
                  raise SystemExit(f"audio too short: {path}")
              print(f"{path.name}: {duration:.3f}s")
          PY

      - name: Upload bridge narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: e01-algieba-bridge-20260810
          path: out/
          if-no-files-found: error
          retention-days: 1
