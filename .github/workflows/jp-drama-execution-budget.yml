name: Japanese Drama Execution Budget

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/generation/execution_budget.py"
      - "src/apps/jp_drama/generation/__init__.py"
      - "src/apps/jp_drama/workflows/prepare_execution_budget.py"
      - "src/apps/jp_drama/workflows/render_generation_segment_canary.py"
      - "tests/test_jp_drama_execution_budget.py"
      - "tests/test_jp_drama_asset_gated_canary.py"
      - "docs/pr18-unified-execution-budget.md"
      - ".github/workflows/jp-drama-execution-budget.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/generation/execution_budget.py"
      - "src/apps/jp_drama/generation/__init__.py"
      - "src/apps/jp_drama/workflows/prepare_execution_budget.py"
      - "src/apps/jp_drama/workflows/render_generation_segment_canary.py"
      - "tests/test_jp_drama_execution_budget.py"
      - "tests/test_jp_drama_asset_gated_canary.py"
      - "docs/pr18-unified-execution-budget.md"
      - ".github/workflows/jp-drama-execution-budget.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-budget:
    name: Validate provider-bound CNY exposure and ledger resume
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile Japanese drama packages
        run: python -m compileall -q src/apps/jp_drama

      - name: Run execution budget regressions
        run: |
          python -m pytest -q \
            tests/test_jp_drama_execution_budget.py \
            tests/test_jp_drama_approved_assets.py \
            tests/test_jp_drama_asset_gated_canary.py \
            tests/test_jp_drama_action_beat_generation.py

      - name: Build route-ready full plan
        run: |
          rm -rf output/jp_drama/pr18
          mkdir -p output/jp_drama/pr18
          python -m src.apps.jp_drama.workflows.ingest_script \
            --input examples/jp_drama/script_ingestion/sample_script.md \
            --output-dir output/jp_drama/pr18/ingestion \
            --llm-provider fixture
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input output/jp_drama/pr18/ingestion/episode_package.json \
            --output output/jp_drama/pr18/prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --strict
          python -m src.apps.jp_drama.workflows.prepare_generation \
            --input output/jp_drama/pr18/prepared/prepared_episode.json \
            --output-dir output/jp_drama/pr18/generation \
            --profile examples/jp_drama/generation/wan27_profile.json \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --require-route-ready

      - name: Build exact no-asset lifecycle budget
        run: |
          python -m src.apps.jp_drama.workflows.prepare_execution_budget \
            --generation-plan output/jp_drama/pr18/generation/generation_plan_episode.json \
            --providers examples/jp_drama/dashscope_live_providers.json \
            --hard-max-calls 40 \
            --hard-limit-cny 100 \
            --output output/jp_drama/pr18/execution-budget.json \
            --print-report

      - name: Verify all cost components are known
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          budget = json.loads(Path("output/jp_drama/pr18/execution-budget.json").read_text())
          components = [item["component"] for item in budget["operations"]]
          assert budget["currency"] == "CNY"
          assert budget["remaining_api_calls"] == 33
          assert budget["committed_api_calls"] == 0
          assert budget["total_exposure_api_calls"] == 33
          assert components.count("first_frame") == 15
          assert components.count("video") == 15
          assert components.count("tts") == 3
          assert budget["unknown_components"] == []
          assert budget["payment_approved"] is True
          assert budget["total_exposure_cny"] > 48
          PY

      - name: Ensure zero provider calls and no committed media
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' '*.png' '*.jpg' | grep -E 'jp_drama|execution_budget' || true)"

      - name: Upload execution budget contract
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-execution-budget-contract
          path: |
            output/jp_drama/pr18/execution-budget.json
            output/jp_drama/pr18/generation/generation_plan_episode.json
          if-no-files-found: error
          retention-days: 7
