name: Japanese Drama E02-G02 Hiragana Selected R2V

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e02-g02-hiragana-selected-r2v.yml"
      - "src/apps/jp_drama/workflows/render_happyhorse_e02_g02_hiragana_selected_r2v_canary.py"
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jp-drama-e02-g02-hiragana-selected-r2v
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CONTROL_ISSUE: "37"
  PREPROD_RUN_ID: "31002636877"
  PREPROD_ARTIFACT: one-bunch-video-before-stage-package
  G01_RUN_ID: "31166560836"
  G01_ARTIFACT: happyhorse-e02-g01-selected-r2v-10s-result
  G01_VIDEO_SHA256: sha256:fab5641c02b5add4e6c20e73268a1148d3c2b9e61424a4ecdb8fa4d49f871a80
  G01_FRAME_SHA256: sha256:369ebdfdf94bed0d7833a896ce2eb883af491e047214ebfeb465fe518977fb64
  C01_SHA256: sha256:ad79e1aa803ac3ae059b3f70f1293fe6c3e01c0fb178a93991193f601628455c
  C02_SHA256: sha256:74beff4a8a9a8e86000324d64ce3328460812c7e4df1548859650983c458e9c7
  C03_SHA256: sha256:d474304447a797346f9f2153cdddcbcfdc7c68f7c45e8cd1e03654ad211176b6
  C91_SHA256: sha256:50f7e262db04aeb6d63b044a2f6ff60463666a7bbde6bb526b68f3ad7ff9d68e
  S03_SHA256: sha256:854e31c8b303441f6b35abff49148e14229f52c0cbb6f1ab53a998d139369dc5
  PROVIDER_CONFIG: examples/jp_drama/dashscope_happyhorse_live_providers.json
  SEGMENT_ID: E02-G02
  RESULT_ARTIFACT: happyhorse-e02-g02-hiragana-selected-r2v-10s-result

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10" "pillow==12.2.0"

      - name: Download exact successful E02-G01 result
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.G01_ARTIFACT }}
          path: input/g01
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.G01_RUN_ID }}

      - name: Download immutable three-episode preproduction package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREPROD_ARTIFACT }}
          path: input/preprod
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREPROD_RUN_ID }}

      - name: Apply approved masters and materialize E02 Wan bundle
        run: |
          python -m src.apps.jp_drama.workflows.apply_master_reference_approval \
            --preproduction-root input/preprod \
            --approval-manifest assets/jp_drama/one_bunch_of_grapes/master_references/v1/human_approval.json \
            --repository-root .
          python - <<'PY'
          import json
          from pathlib import Path
          from src.apps.jp_drama.assets.models import ApprovedAssetBundle

          root = Path('input/preprod')
          pending_path = root / 'production_contract/E02/wan/asset_bundle_pending.json'
          binding_path = root / 'approval_templates/E02/wan/bindings.template.json'
          approval_path = Path('assets/jp_drama/one_bunch_of_grapes/master_references/v1/human_approval.json')
          output_path = root / 'production_contract/E02/wan/asset_bundle_masters_approved.json'
          pending = json.loads(pending_path.read_text(encoding='utf-8'))
          bindings = json.loads(binding_path.read_text(encoding='utf-8'))
          approval = json.loads(approval_path.read_text(encoding='utf-8'))
          approved_by_source = {item['source_asset_id']: item for item in approval['assets']}
          materialized = []
          for asset in pending['assets']:
              binding = bindings['assets'].get(asset['asset_id'])
              if binding is None:
                  materialized.append(asset)
                  continue
              approved = approved_by_source[binding['source_asset_id']]
              digest = str(approved['sha256'])
              if not digest.startswith('sha256:'):
                  digest = 'sha256:' + digest
              materialized.append({
                  **asset,
                  'approval_status': 'approved',
                  'asset_path': approved['path'],
                  'asset_sha256': digest,
                  'mime_type': 'image/png',
                  'width': approved['width'],
                  'height': approved['height'],
                  'verified_against_asset_ids': [],
                  'generated_by': approved['generated_by'],
                  'operation_id': approved['operation_id'],
                  'approved_at': approval['approved_at'],
                  'approved_by': approval['approved_by'],
              })
          bundle = ApprovedAssetBundle.build_with_digest(
              schema_version=pending['schema_version'],
              bundle_id=pending['bundle_id'],
              source_episode_id=pending['source_episode_id'],
              source_prepared_episode_digest=pending['source_prepared_episode_digest'],
              generation_plan_digest=pending['generation_plan_digest'],
              assets=materialized,
              voice_profiles=pending['voice_profiles'],
          )
          output_path.write_text(bundle.to_canonical_json() + '\n', encoding='utf-8')
          assert all(
              item.approval_status == 'approved'
              for item in bundle.assets
              if item.role != 'first_frame'
          )
          PY

      - name: Locate and verify E02-G01 continuity inputs
        run: |
          set -euo pipefail
          PREPARED="input/preprod/production_contract/E02/prepared_episode.json"
          PLAN="input/preprod/production_contract/E02/wan/generation_plan_episode.json"
          BUNDLE="input/preprod/production_contract/E02/wan/asset_bundle_masters_approved.json"
          PREVIOUS_VIDEO="$(find input/g01 -type f -name 'E02-G01-r2v.mp4' -print -quit)"
          PREVIOUS_REPORT="$(find input/g01 -type f -name 'video-render.json' -print -quit)"
          FRAME="$(find input/g01 -type f -path '*/continuity/E02-G01/E02-G01_end.png' -print -quit)"
          META="$(find input/g01 -type f -path '*/continuity/E02-G01/E02-G01_end.json' -print -quit)"
          for value in "$PREPARED" "$PLAN" "$BUNDLE" "$PREVIOUS_VIDEO" "$PREVIOUS_REPORT" "$FRAME" "$META"; do
            test -n "$value" && test -s "$value"
          done
          echo "${G01_FRAME_SHA256#sha256:}  $FRAME" | sha256sum --check --strict
          echo "${G01_VIDEO_SHA256#sha256:}  $PREVIOUS_VIDEO" | sha256sum --check --strict
          STATE_DIR="$RUNNER_TEMP/e02-g02-hiragana-selected-r2v-zero-call"
          mkdir -p "$STATE_DIR/continuity"
          FRAME="$FRAME" META="$META" PREVIOUS_REPORT="$PREVIOUS_REPORT" python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image
          frame = Path(os.environ['FRAME'])
          meta = json.loads(Path(os.environ['META']).read_text(encoding='utf-8'))
          report = json.loads(Path(os.environ['PREVIOUS_REPORT']).read_text(encoding='utf-8'))
          with Image.open(frame) as image:
              assert image.format == 'PNG' and image.size == (720, 1280)
          assert meta['schema_version'] == 'jp-drama-continuity-frame/v1'
          assert meta['source_segment_id'] == 'E02-G01'
          assert meta['derived_for_next_segment_id'] == 'E02-G02'
          assert meta['frame_sha256'] == os.environ['G01_FRAME_SHA256']
          assert meta['source_video_sha256'] == os.environ['G01_VIDEO_SHA256']
          assert report['valid'] is True
          assert report['status'] == 'succeeded_awaiting_human_review'
          assert report['segment_id'] == 'E02-G01'
          assert report['output_sha256'] == os.environ['G01_VIDEO_SHA256']
          assert report['provider_submissions_this_run'] == 1
          PY
          {
            echo "PREPARED=$PREPARED"
            echo "PLAN=$PLAN"
            echo "BUNDLE=$BUNDLE"
            echo "FRAME=$FRAME"
            echo "META=$META"
            echo "STATE_DIR=$STATE_DIR"
          } >> "$GITHUB_ENV"

      - name: Compile reviewed E02-G02 wrapper
        run: |
          python -m compileall -q src/apps/jp_drama/workflows/render_happyhorse_e02_g02_hiragana_selected_r2v_canary.py
          python - <<'PY'
          from src.apps.jp_drama.workflows.render_happyhorse_e02_g02_hiragana_selected_r2v_canary import (
              append_e02_g02_continuity_prompt,
              e02_g02_direction,
              rewrite_e02_g02_dialogue,
          )
          text = append_e02_g02_continuity_prompt('base', existing_reference_count=5)
          assert '[Image 6] is the exact final frame of E02-G01' in text
          direction = e02_g02_direction()
          assert 'もういってもよろしい' in direction
          assert 'exactly C01 and C03 remaining' in direction
          old = "Spoken dialogue: Use natural Japanese and synchronize the visible speaker's mouth to this dialogue exactly: 先生(spoken): もう行ってもよろしい"
          rewritten = rewrite_e02_g02_dialogue(old, '先生(spoken): もう行ってもよろしい')
          assert 'もういってもよろしい' in rewritten
          assert 'もう行ってもよろしい' not in rewritten
          assert 'Only C03 moves the mouth' in rewritten
          PY

      - name: Run exact zero-call E02-G02 selected R2V preflight
        env:
          DASHSCOPE_API_KEY: ""
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_e02_g02_hiragana_selected_r2v_canary \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --segment-id "$SEGMENT_ID" \
            --asset-bundle "$BUNDLE" \
            --providers "$PROVIDER_CONFIG" \
            --output "$STATE_DIR/E02-G02-r2v.mp4" \
            --input-mode references \
            --stage preflight \
            --continuity-frame "$FRAME" \
            --continuity-frame-metadata "$META" \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --report "$STATE_DIR/preflight.json" \
            --print-report

      - name: Verify exact six-image provider payload and hiragana speech
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from src.apps.jp_drama.rendering.happyhorse11 import HappyHorse11R2VModel
          report = json.loads((Path(os.environ['STATE_DIR']) / 'preflight.json').read_text(encoding='utf-8'))
          refs = report['references']
          expected_subjects = ['C01', 'C02', 'C03', 'C91', 'S03', 'E02-G01']
          expected_hashes = [
              os.environ['C01_SHA256'], os.environ['C02_SHA256'], os.environ['C03_SHA256'],
              os.environ['C91_SHA256'], os.environ['S03_SHA256'], os.environ['G01_FRAME_SHA256'],
          ]
          assert report['valid'] is True
          assert report['status'] == 'ready_for_single_paid_submission'
          assert report['segment_id'] == 'E02-G02'
          assert report['model'] == 'happyhorse-1.1-r2v'
          assert report['input_mode'] == 'references'
          assert report['provider_submissions_this_run'] == 0
          assert report['external_api_calls'] == 0
          assert len(refs) == 6
          assert [item['subject_id'] for item in refs] == expected_subjects
          assert [item['sha256'] for item in refs] == expected_hashes
          assert report['continuity_frame']['source_segment_id'] == 'E02-G01'
          prompt = report['request']['prompt']
          assert 'もういってもよろしい' in prompt
          assert 'もう行ってもよろしい' not in prompt
          assert 'Only C03 moves the mouth' in prompt
          assert 'exactly C01 and C03 remaining' in prompt
          urls = [f'https://zero-call.invalid/ref-{i}.png' for i in range(1, 7)]
          payload = HappyHorse11R2VModel.build_request_payload(
              prompt=prompt,
              reference_image_urls=urls,
              resolution='720P', ratio='9:16', duration=10,
              watermark=False, seed=report['request']['seed'],
          )
          assert payload['model'] == 'happyhorse-1.1-r2v'
          assert len(payload['input']['media']) == 6
          assert [item['type'] for item in payload['input']['media']] == ['reference_image'] * 6
          assert [item['url'] for item in payload['input']['media']] == urls
          assert 'first_frame' not in json.dumps(payload, ensure_ascii=False)
          print('E02-G02 zero-call provider payload: six references and hiragana speech verified')
          PY

  render-e02-g02:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_ONE_BUNCH_E02_G02_HIRAGANA_SELECTED_R2V_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require first workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pillow==12.2.0"

      - name: Verify Beijing R2V credential without creating video task
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DASHSCOPE_API_KEY"
          HTTP_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/auth.json" --write-out '%{http_code}' \
            --get 'https://dashscope.aliyuncs.com/api/v1/uploads' \
            --data-urlencode 'action=getPolicy' \
            --data-urlencode 'model=happyhorse-1.1-r2v' \
            --header "Authorization: Bearer $DASHSCOPE_API_KEY")"
          test "$HTTP_CODE" = "200"

      - name: Download exact successful E02-G01 result
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.G01_ARTIFACT }}
          path: input/g01
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.G01_RUN_ID }}

      - name: Download immutable three-episode preproduction package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREPROD_ARTIFACT }}
          path: input/preprod
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREPROD_RUN_ID }}

      - name: Apply approved masters and materialize E02 Wan bundle
        run: |
          python -m src.apps.jp_drama.workflows.apply_master_reference_approval \
            --preproduction-root input/preprod \
            --approval-manifest assets/jp_drama/one_bunch_of_grapes/master_references/v1/human_approval.json \
            --repository-root .
          python - <<'PY'
          import json
          from pathlib import Path
          from src.apps.jp_drama.assets.models import ApprovedAssetBundle
          root = Path('input/preprod')
          pending = json.loads((root / 'production_contract/E02/wan/asset_bundle_pending.json').read_text(encoding='utf-8'))
          bindings = json.loads((root / 'approval_templates/E02/wan/bindings.template.json').read_text(encoding='utf-8'))
          approval = json.loads(Path('assets/jp_drama/one_bunch_of_grapes/master_references/v1/human_approval.json').read_text(encoding='utf-8'))
          approved_by_source = {item['source_asset_id']: item for item in approval['assets']}
          materialized = []
          for asset in pending['assets']:
              binding = bindings['assets'].get(asset['asset_id'])
              if binding is None:
                  materialized.append(asset)
                  continue
              approved = approved_by_source[binding['source_asset_id']]
              digest = str(approved['sha256'])
              if not digest.startswith('sha256:'):
                  digest = 'sha256:' + digest
              materialized.append({**asset, 'approval_status': 'approved', 'asset_path': approved['path'], 'asset_sha256': digest, 'mime_type': 'image/png', 'width': approved['width'], 'height': approved['height'], 'verified_against_asset_ids': [], 'generated_by': approved['generated_by'], 'operation_id': approved['operation_id'], 'approved_at': approval['approved_at'], 'approved_by': approval['approved_by']})
          bundle = ApprovedAssetBundle.build_with_digest(schema_version=pending['schema_version'], bundle_id=pending['bundle_id'], source_episode_id=pending['source_episode_id'], source_prepared_episode_digest=pending['source_prepared_episode_digest'], generation_plan_digest=pending['generation_plan_digest'], assets=materialized, voice_profiles=pending['voice_profiles'])
          (root / 'production_contract/E02/wan/asset_bundle_masters_approved.json').write_text(bundle.to_canonical_json() + '\n', encoding='utf-8')
          PY

      - name: Locate exact E02-G02 inputs
        run: |
          set -euo pipefail
          PREPARED="input/preprod/production_contract/E02/prepared_episode.json"
          PLAN="input/preprod/production_contract/E02/wan/generation_plan_episode.json"
          BUNDLE="input/preprod/production_contract/E02/wan/asset_bundle_masters_approved.json"
          PREVIOUS_VIDEO="$(find input/g01 -type f -name 'E02-G01-r2v.mp4' -print -quit)"
          PREVIOUS_REPORT="$(find input/g01 -type f -name 'video-render.json' -print -quit)"
          FRAME="$(find input/g01 -type f -path '*/continuity/E02-G01/E02-G01_end.png' -print -quit)"
          META="$(find input/g01 -type f -path '*/continuity/E02-G01/E02-G01_end.json' -print -quit)"
          for value in "$PREPARED" "$PLAN" "$BUNDLE" "$PREVIOUS_VIDEO" "$PREVIOUS_REPORT" "$FRAME" "$META"; do
            test -n "$value" && test -s "$value"
          done
          echo "${G01_FRAME_SHA256#sha256:}  $FRAME" | sha256sum --check --strict
          echo "${G01_VIDEO_SHA256#sha256:}  $PREVIOUS_VIDEO" | sha256sum --check --strict
          STATE_DIR="$RUNNER_TEMP/e02-g02-hiragana-selected-r2v"
          mkdir -p "$STATE_DIR/continuity"
          FRAME="$FRAME" META="$META" PREVIOUS_REPORT="$PREVIOUS_REPORT" python - <<'PY'
          import json, os
          from pathlib import Path
          meta = json.loads(Path(os.environ['META']).read_text(encoding='utf-8'))
          report = json.loads(Path(os.environ['PREVIOUS_REPORT']).read_text(encoding='utf-8'))
          assert meta['source_segment_id'] == 'E02-G01'
          assert meta['derived_for_next_segment_id'] == 'E02-G02'
          assert meta['frame_sha256'] == os.environ['G01_FRAME_SHA256']
          assert meta['source_video_sha256'] == os.environ['G01_VIDEO_SHA256']
          assert report['valid'] is True
          assert report['segment_id'] == 'E02-G01'
          assert report['output_sha256'] == os.environ['G01_VIDEO_SHA256']
          PY
          {
            echo "PREPARED=$PREPARED"
            echo "PLAN=$PLAN"
            echo "BUNDLE=$BUNDLE"
            echo "FRAME=$FRAME"
            echo "META=$META"
            echo "STATE_DIR=$STATE_DIR"
          } >> "$GITHUB_ENV"

      - name: Zero-call preflight immediately before payment
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_e02_g02_hiragana_selected_r2v_canary \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --segment-id "$SEGMENT_ID" \
            --asset-bundle "$BUNDLE" \
            --providers "$PROVIDER_CONFIG" \
            --output "$STATE_DIR/E02-G02-r2v.mp4" \
            --input-mode references \
            --stage preflight \
            --continuity-frame "$FRAME" \
            --continuity-frame-metadata "$META" \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --report "$STATE_DIR/preflight.json" \
            --print-report

      - name: Verify exact six references, hiragana speech, and export fingerprint
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['STATE_DIR']) / 'preflight.json').read_text(encoding='utf-8'))
          refs = report['references']
          assert report['valid'] is True
          assert report['status'] == 'ready_for_single_paid_submission'
          assert report['model'] == 'happyhorse-1.1-r2v'
          assert report['input_mode'] == 'references'
          assert report['provider_submissions_this_run'] == 0
          assert report['external_api_calls'] == 0
          assert [item['subject_id'] for item in refs] == ['C01', 'C02', 'C03', 'C91', 'S03', 'E02-G01']
          assert [item['sha256'] for item in refs] == [os.environ['C01_SHA256'], os.environ['C02_SHA256'], os.environ['C03_SHA256'], os.environ['C91_SHA256'], os.environ['S03_SHA256'], os.environ['G01_FRAME_SHA256']]
          prompt = report['request']['prompt']
          assert 'もういってもよろしい' in prompt
          assert 'もう行ってもよろしい' not in prompt
          assert 'Only C03 moves the mouth' in prompt
          assert 'exactly C01 and C03 remaining' in prompt
          print('VIDEO_FINGERPRINT=' + report['request']['request_fingerprint'])
          PY

      - name: Reserve one E02-G02 request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREFIX="E02_G02_HIRAGANA_SELECTED_R2V_RESERVATION:"
          COMMENTS="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100" | jq -s 'add')"
          EXISTING="$(jq -r --arg p "$PREFIX" '[.[] | select(.body | startswith($p))] | length' <<< "$COMMENTS")"
          test "$EXISTING" = "0"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$PREFIX run_id=$GITHUB_RUN_ID fingerprint=$VIDEO_FINGERPRINT g01_frame_sha256=$G01_FRAME_SHA256 refs=C01,C02,C03,C91,S03,E02-G01 speech=もういってもよろしい attempt=1"

      - name: Render exactly one E02-G02 R2V task
        id: render
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: https://ws-fflq327rfjpr3ob2.cn-beijing.maas.aliyuncs.com
          DASHSCOPE_UPLOAD_BASE_URL: https://dashscope.aliyuncs.com
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_e02_g02_hiragana_selected_r2v_canary \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --segment-id "$SEGMENT_ID" \
            --asset-bundle "$BUNDLE" \
            --providers "$PROVIDER_CONFIG" \
            --output "$STATE_DIR/E02-G02-r2v.mp4" \
            --input-mode references \
            --stage render \
            --continuity-frame "$FRAME" \
            --continuity-frame-metadata "$META" \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --ledger-file "$STATE_DIR/video-ledger.json" \
            --report "$STATE_DIR/video-render.json" \
            --print-report

      - name: Persist provider task identity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VALUES="$(python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['STATE_DIR']) / 'video-ledger.json'
          if not path.is_file():
              print('none\tnone\tno_ledger')
              raise SystemExit
          operations = json.loads(path.read_text(encoding='utf-8')).get('operations') or {}
          if not operations:
              print('none\tnone\tno_operation')
              raise SystemExit
          operation = next(iter(operations.values()))
          print('\t'.join([operation.get('provider_task_id') or 'none', operation.get('provider_request_id') or 'none', operation.get('status') or 'unknown']))
          PY
          )"
          IFS=$'\t' read -r TASK_ID REQUEST_ID TASK_STATUS <<< "$VALUES"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=E02_G02_HIRAGANA_SELECTED_R2V_TASK_STATE: run_id=$GITHUB_RUN_ID task_id=$TASK_ID request_id=$REQUEST_ID status=$TASK_STATUS attempt=1"

      - name: Verify video and E02-G03 handoff
        id: verify
        if: steps.render.outcome == 'success'
        run: |
          set -euo pipefail
          test -s "$STATE_DIR/E02-G02-r2v.mp4"
          test -s "$STATE_DIR/video-render.json"
          test -s "$STATE_DIR/video-ledger.json"
          test -s "$STATE_DIR/continuity/E02-G02/E02-G02_end.png"
          test -s "$STATE_DIR/continuity/E02-G02/E02-G02_end.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = Path(os.environ['STATE_DIR'])
          report = json.loads((state / 'video-render.json').read_text(encoding='utf-8'))
          ledger = json.loads((state / 'video-ledger.json').read_text(encoding='utf-8'))
          end = json.loads((state / 'continuity/E02-G02/E02-G02_end.json').read_text(encoding='utf-8'))
          operations = list((ledger.get('operations') or {}).values())
          assert report['valid'] is True
          assert report['status'] == 'succeeded_awaiting_human_review'
          assert report['segment_id'] == 'E02-G02'
          assert report['model'] == 'happyhorse-1.1-r2v'
          assert report['input_mode'] == 'references'
          assert report['provider_submissions_this_run'] == 1
          assert report['audio_stream_present'] is True
          assert report['duration_seconds'] + 0.08 >= 10
          assert [item['subject_id'] for item in report['references']] == ['C01', 'C02', 'C03', 'C91', 'S03', 'E02-G01']
          prompt = report['request']['prompt']
          assert 'もういってもよろしい' in prompt
          assert 'もう行ってもよろしい' not in prompt
          assert len(operations) == 1
          assert operations[0].get('provider_task_id')
          assert end['source_segment_id'] == 'E02-G02'
          assert end['derived_for_next_segment_id'] == 'E02-G03'
          assert end['source_video_sha256'] == report['output_sha256']
          PY

      - name: Upload result and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: ${{ env.STATE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Report E02-G02 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=E02-G02 hiragana selected R2V result

          - run_id: $GITHUB_RUN_ID
          - render: ${{ steps.render.outcome }}
          - verify: ${{ steps.verify.outcome }}
          - artifact: $RESULT_ARTIFACT
          - source_g01_run: $G01_RUN_ID
          - references: C01,C02,C03,C91,S03,E02-G01
          - provider_spoken_text: もういってもよろしい
          - URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail if rendering or verification failed
        if: steps.render.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
