name: Japanese Drama HappyHorse Multi-Clip Production

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/production/happyhorse_multiclip.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_multiclip_production.py"
      - "assets/jp_drama/one_bunch_of_grapes/production_keyframes/**"
      - "tests/test_jp_drama_happyhorse_multiclip_production.py"
      - "docs/pr31-happyhorse-multiclip-production.md"
      - ".github/workflows/jp-drama-happyhorse-multiclip-production.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/production/happyhorse_multiclip.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_multiclip_production.py"
      - "assets/jp_drama/one_bunch_of_grapes/production_keyframes/**"
      - "tests/test_jp_drama_happyhorse_multiclip_production.py"
      - "docs/pr31-happyhorse-multiclip-production.md"
      - ".github/workflows/jp-drama-happyhorse-multiclip-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  happyhorse-multiclip-production:
    name: Validate four keyframes, zero-call preflight, and assembly contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile implementation
        run: |
          python -m compileall -q \
            src/apps/jp_drama/production/happyhorse_multiclip.py \
            src/apps/jp_drama/workflows/render_happyhorse_multiclip_production.py

      - name: Run multi-clip production tests
        run: |
          python -m pytest -q tests/test_jp_drama_happyhorse_multiclip_production.py

      - name: Run committed zero-call preflight
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_multiclip_production \
            --plan assets/jp_drama/one_bunch_of_grapes/production_keyframes/E01/G01/E01-G01.happyhorse_multiclip_plan.json \
            --providers examples/jp_drama/dashscope_happyhorse_live_providers.json \
            --repository-root . \
            --output-dir /tmp/E01-G01 \
            --stage preflight \
            --max-api-calls 4 \
            --max-cost-cny 20 \
            --cost-reserve-cny-per-clip 4 \
            --report /tmp/E01-G01/preflight.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/E01-G01/preflight.json', encoding='utf-8'))
          assert report['valid'] is True
          assert report['clip_count'] == 4
          assert report['external_api_calls'] == 0
          assert [item['provider_duration_seconds'] for item in report['requests']] == [3, 3, 3, 4]
          assert [item['final_duration_seconds'] for item in report['requests']] == [2.0, 2.0, 2.5, 3.5]
          PY

      - name: Assert CI made no paid provider calls
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${DASHSCOPE_WORKSPACE_ID:-}"
