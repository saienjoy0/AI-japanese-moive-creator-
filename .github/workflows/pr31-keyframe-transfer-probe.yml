name: PR31 Keyframe Transfer Probe

on:
  pull_request:
    paths:
      - .github/workflows/pr31-keyframe-transfer-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Probe signed original object candidates
        env:
          OBJECT_SIG: "AAAAAAAAAAAAAAAAAAAAAFFh4zvIsnB37hPD3E5u25BePzqveZ-udbcveQBeJLhH"
          EXPIRY: "1786004326"
        run: |
          set +e
          urls=(
            "https://media.canva.com/ifs/M/a252025e-940e-4f7a-8b1e-389c9acef420?exp=${EXPIRY}&osig=${OBJECT_SIG}&signer=media-rpc"
            "https://media.canva.com/ifs/M/a252025e-940e-4f7a-8b1e-389c9acef420?osig=${OBJECT_SIG}&exp=${EXPIRY}&signer=media-rpc"
            "https://media.canva.com/ifs%3A%2F%2FM%2Fa252025e-940e-4f7a-8b1e-389c9acef420?exp=${EXPIRY}&osig=${OBJECT_SIG}&signer=media-rpc"
          )
          found=0
          index=0
          for url in "${urls[@]}"; do
            index=$((index+1))
            code=$(curl --location --silent --show-error --output "/tmp/frame-${index}" --write-out '%{http_code}' "$url")
            echo "candidate-${index} status=${code} bytes=$(wc -c < /tmp/frame-${index})"
            if [ "$code" = "200" ]; then
              python - "$index" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          path = Path(f'/tmp/frame-{sys.argv[1]}')
          try:
              with Image.open(path) as image:
                  print('dimensions', image.size)
                  if image.size == (941, 1672):
                      raise SystemExit(0)
          except Exception as exc:
              print(type(exc).__name__, exc)
          raise SystemExit(1)
          PY
              if [ $? -eq 0 ]; then found=1; break; fi
            fi
          done
          test "$found" = "1"
