name: Japanese Drama One Bunch H3 Continuity Binding

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-one-bunch-h3-continuity.yml"
      - "src/apps/jp_drama/workflows/bind_h3_continuity_reference.py"
      - "src/apps/jp_drama/workflows/extract_segment_end_frame.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_continuity_canary.py"
      - "tests/test_jp_drama_h3_continuity_binding.py"
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jp-drama-one-bunch-h3-continuity-binding
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CONTROL_ISSUE: "37"
  H3_HANDOFF_RUN_ID: "31090530841"
  CONTINUITY_RUN_ID: "31091499445"
  H3_HANDOFF_ARTIFACT: one-bunch-h3-cn-continuation-handoff
  CONTINUITY_ARTIFACT: jp-drama-E01-G01-continuity-frame

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10"

      - name: Compile PR45 continuity binding
        run: |
          python -m compileall -q \
            src/apps/jp_drama/workflows/bind_h3_continuity_reference.py

      - name: Test PR45 artifact reuse for H3
        run: |
          python -m pytest -q tests/test_jp_drama_h3_continuity_binding.py

      - name: Prove there is no duplicate extraction or provider call
        run: |
          test ! -e src/apps/jp_drama/workflows/build_h3_continuity_reference.py
          grep -q 'SOURCE_RUN_ID = "31091499445"' \
            src/apps/jp_drama/workflows/bind_h3_continuity_reference.py
          grep -q 'send_full_previous_video.*False' \
            src/apps/jp_drama/workflows/bind_h3_continuity_reference.py
          grep -q 'external_api_calls.*0' \
            src/apps/jp_drama/workflows/bind_h3_continuity_reference.py

  materialize-binding:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'BUILD_ONE_BUNCH_H3_CONTINUITY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require first workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt

      - name: Download the existing H3 handoff
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.H3_HANDOFF_ARTIFACT }}
          path: input/handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.H3_HANDOFF_RUN_ID }}

      - name: Download PR45's existing continuity frame
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONTINUITY_ARTIFACT }}
          path: input/continuity
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CONTINUITY_RUN_ID }}

      - name: Locate immutable inputs
        run: |
          set -euo pipefail
          HANDOFF="$(find input/handoff -type f -name 'minimax_h3_cn_continuation_handoff.json' -print -quit)"
          SEGMENT_ARTIFACT="$(find input/handoff -type f -name 'E01-G01.segment_artifact.json' -print -quit)"
          FRAME="$(find input/continuity -type f -name 'E01-G01_end.png' -print -quit)"
          METADATA="$(find input/continuity -type f -name 'E01-G01_end.json' -print -quit)"
          test -n "$HANDOFF" && test -s "$HANDOFF"
          test -n "$SEGMENT_ARTIFACT" && test -s "$SEGMENT_ARTIFACT"
          test -n "$FRAME" && test -s "$FRAME"
          test -n "$METADATA" && test -s "$METADATA"
          {
            echo "HANDOFF=$HANDOFF"
            echo "SEGMENT_ARTIFACT=$SEGMENT_ARTIFACT"
            echo "FRAME=$FRAME"
            echo "METADATA=$METADATA"
          } >> "$GITHUB_ENV"

      - name: Copy the existing handoff and bind PR45's frame to E01-G02
        run: |
          mkdir -p output
          cp -a input/handoff/. output/
          python -m src.apps.jp_drama.workflows.bind_h3_continuity_reference \
            --handoff "$HANDOFF" \
            --segment-artifact "$SEGMENT_ARTIFACT" \
            --continuity-frame "$FRAME" \
            --continuity-frame-metadata "$METADATA" \
            --output-dir output/one-bunch-h3-cn-handoff \
            --print-report | tee output/continuity-binding-report.json

      - name: Prove PR45 was reused and no provider was called
        run: |
          test -z "${MINIMAX_API_KEY:-}"
          test -z "${DASHSCOPE_API_KEY:-}"
          python - <<'PY'
          import json
          from pathlib import Path

          matches = list(
              Path("output").rglob("E01-G02.h3-continuity-reference.json")
          )
          assert len(matches) == 1
          binding_path = matches[0]
          binding = json.loads(binding_path.read_text(encoding="utf-8"))
          assert binding["source_workflow_run_id"] == "31091499445"
          assert binding["source_artifact"] == "jp-drama-E01-G01-continuity-frame"
          assert binding["source_segment_id"] == "E01-G01"
          assert binding["target_segment_id"] == "E01-G02"
          assert binding["target_provider_route_id"] == "minimax/h3-reference-av"
          assert binding["reference_role"] == "storyboard"
          assert binding["send_full_previous_video"] is False
          assert binding["external_api_calls"] == 0
          assert binding["requires_publication_before_h3_submit"] is True
          assert not Path(binding["frame_path"]).is_absolute()
          assert not Path(binding["metadata_path"]).is_absolute()
          assert (binding_path.parent / binding["frame_path"]).is_file()
          assert (binding_path.parent / binding["metadata_path"]).is_file()
          PY

      - name: Upload continuity-ready H3 handoff
        uses: actions/upload-artifact@v4
        with:
          name: one-bunch-h3-cn-continuity-ready-handoff
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Report PR45 reuse to issue 37
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION="${{ job.status }}"
          BODY="One Bunch H3 continuity binding

          - source continuity implementation: PR #45
          - source continuity run: $CONTINUITY_RUN_ID
          - E01-G01 regenerated: no
          - frame re-extracted: no
          - full E01-G01 video sent to H3: no
          - new provider calls: 0
          - status: $CONCLUSION
          - run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"
