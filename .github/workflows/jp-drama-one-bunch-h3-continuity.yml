name: Japanese Drama One Bunch H3 Continuity

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-one-bunch-h3-continuity.yml"
      - "src/apps/jp_drama/workflows/build_h3_continuity_reference.py"
      - "tests/test_jp_drama_h3_continuity_reference.py"
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jp-drama-one-bunch-h3-continuity
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CONTROL_ISSUE: "37"
  SOURCE_APPROVAL_RUN_ID: "31077418519"
  SUCCESS_RESULT_RUN_ID: "31085709337"
  H3_HANDOFF_RUN_ID: "31090530841"
  SOURCE_APPROVAL_ARTIFACT: happyhorse-e01-g01-r2v-paid-approval
  SUCCESS_RESULT_ARTIFACT: happyhorse-e01-g01-r2v-10s-hosted-result
  H3_HANDOFF_ARTIFACT: one-bunch-h3-cn-continuation-handoff

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8,<10" "pydantic>=2,<3"

      - name: Compile continuity builder
        run: |
          python -m compileall -q \
            src/apps/jp_drama/workflows/build_h3_continuity_reference.py

      - name: Test continuity routing
        run: |
          python -m pytest -q tests/test_jp_drama_h3_continuity_reference.py

      - name: Prove provider-free contract
        run: |
          grep -q 'send_full_previous_video.*False' \
            src/apps/jp_drama/workflows/build_h3_continuity_reference.py
          grep -q 'external_api_calls.*0' \
            src/apps/jp_drama/workflows/build_h3_continuity_reference.py

  materialize-continuity:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'BUILD_ONE_BUNCH_H3_CONTINUITY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require first workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download the sealed generation plan
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SOURCE_APPROVAL_ARTIFACT }}
          path: input/sealed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_APPROVAL_RUN_ID }}

      - name: Download the successful first ten seconds
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SUCCESS_RESULT_ARTIFACT }}
          path: input/result
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SUCCESS_RESULT_RUN_ID }}

      - name: Download the existing H3 handoff
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.H3_HANDOFF_ARTIFACT }}
          path: output
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.H3_HANDOFF_RUN_ID }}

      - name: Locate immutable inputs
        run: |
          set -euo pipefail
          PLAN="$(find input/sealed -type f -path '*/input/generation_plan_episode.json' -print -quit)"
          MP4="$(find input/result -type f -name '*.mp4' -print -quit)"
          HANDOFF="$(find output -type f -name 'minimax_h3_cn_continuation_handoff.json' -print -quit)"
          test -n "$PLAN" && test -s "$PLAN"
          test -n "$MP4" && test -s "$MP4"
          test -n "$HANDOFF" && test -s "$HANDOFF"
          {
            echo "PLAN=$PLAN"
            echo "MP4=$MP4"
            echo "HANDOFF=$HANDOFF"
            echo "CONTINUITY_DIR=$(dirname "$HANDOFF")"
          } >> "$GITHUB_ENV"

      - name: Extract the first video's end frame and build continuity routing
        run: |
          python -m src.apps.jp_drama.workflows.build_h3_continuity_reference \
            --generation-plan "$PLAN" \
            --input-video "$MP4" \
            --h3-handoff "$HANDOFF" \
            --output-dir "$CONTINUITY_DIR" \
            --print-report | tee output/continuity-report.json

      - name: Prove E01-G01 is referenced but never resubmitted
        run: |
          test -z "${MINIMAX_API_KEY:-}"
          test -z "${DASHSCOPE_API_KEY:-}"
          python - <<'PY'
          import json
          from pathlib import Path

          plans = list(Path("output").rglob("minimax_h3_cn_continuity_plan.json"))
          assert len(plans) == 1
          plan = json.loads(plans[0].read_text(encoding="utf-8"))
          entries = {item["segment_id"]: item for item in plan["segment_continuity"]}

          g02 = entries["E01-G02"]
          assert g02["source_segment_id"] == "E01-G01"
          assert g02["mode"] == "extracted_previous_segment_end_frame"
          assert g02["status"] == "ready"
          assert g02["send_full_previous_video"] is False
          assert Path(g02["reference_path"]).is_file()

          assert entries["E01-G03"]["source_segment_id"] == "E01-G02"
          assert entries["E01-G04"]["mode"] == "planned_first_frame_asset"
          assert entries["E01-G05"]["source_segment_id"] == "E01-G04"
          assert plan["external_api_calls"] == 0
          PY

      - name: Upload continuity-ready H3 handoff
        uses: actions/upload-artifact@v4
        with:
          name: one-bunch-h3-cn-continuity-ready-handoff
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Report zero-call continuity preparation to issue 37
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION="${{ job.status }}"
          printf -v BODY '%s\n\n%s\n%s\n%s\n%s\n%s\n%s' \
            'One Bunch H3 continuity preparation' \
            '- E01-G01 used as continuity reference: yes' \
            '- E01-G01 regenerated: no' \
            '- full E01-G01 video sent to H3: no' \
            '- new provider calls: 0' \
            "- status: $CONCLUSION" \
            "- run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"
