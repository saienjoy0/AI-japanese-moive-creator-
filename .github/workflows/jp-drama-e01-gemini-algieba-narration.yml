name: Japanese Drama E01 Gemini Algieba Narration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    name: Generate Algieba narration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --quiet --upgrade google-genai

      - name: Generate narration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          rm -rf out
          mkdir -p out

          cat > /tmp/synth.py <<'PY'
          import os
          import base64
          import json
          import wave
          from pathlib import Path
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          out = Path("out")

          lines = {
              "N01": "僕は小さい時、絵を描くことが好きでした。",
              "N02": "ジムの絵具。なかでも藍と洋紅は、とても美しく見えました。",
              "N03": "取ったあとも、胸は少しも落ち着きませんでした。",
              "N04": "もう、言い逃れはできませんでした。",
          }

          direction = """Native Japanese adult male narrator, late 30s to early 40s.
          He is the grown-up version of a sensitive, inward-looking boy remembering childhood.
          Warm, smooth, intimate and restrained. Slightly slow, but natural.
          Do not sound like a newsreader, commercial, anime character, or documentary announcer.
          Keep sentence endings soft. Do not over-act sadness.
          Let nostalgia, regret, and the faint warmth of later forgiveness remain subtle.
          Pronounce 藍 as あい and 洋紅 as ようこう clearly.
          """

          def write_wav(path: Path, pcm: bytes):
              with wave.open(str(path), "wb") as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(24000)
                  wf.writeframes(pcm)

          manifest = {}
          for key, text in lines.items():
              prompt = f"{direction}\nRead exactly this Japanese narration, without adding words:\n{text}"
              interaction = client.interactions.create(
                  model="gemini-3.1-flash-tts-preview",
                  input=prompt,
                  response_format={"type": "audio"},
                  generation_config={
                      "speech_config": [
                          {"voice": "Algieba"}
                      ]
                  },
              )
              data = interaction.output_audio.data
              pcm = base64.b64decode(data) if isinstance(data, str) else data
              wav_path = out / f"{key}_algieba.wav"
              write_wav(wav_path, pcm)
              manifest[key] = {
                  "text": text,
                  "voice": "Algieba",
                  "model": "gemini-3.1-flash-tts-preview",
                  "file": wav_path.name,
              }

          (out / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          python /tmp/synth.py

      - name: Validate outputs
        run: |
          set -euo pipefail
          for f in out/N01_algieba.wav out/N02_algieba.wav out/N03_algieba.wav out/N04_algieba.wav; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done

      - name: Persist generated narration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C tmp/gemini-algieba-output-20260810-v1
          rm -rf .tmp/gemini_algieba_narration
          mkdir -p .tmp/gemini_algieba_narration
          cp out/* .tmp/gemini_algieba_narration/
          git add .tmp/gemini_algieba_narration
          git commit -m "tmp: add Gemini Algieba narration outputs"
          git push --force origin HEAD:tmp/gemini-algieba-output-20260810-v1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: e01-gemini-algieba-narration-20260810
          path: out/
          if-no-files-found: error
          retention-days: 7
