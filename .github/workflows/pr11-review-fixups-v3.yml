name: PR11 Review Fixups V3

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr11-review-fixups-v3.yml"

permissions:
  contents: write

jobs:
  apply-fixups:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Apply direct reviewed corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          compiler = Path("src/apps/jp_drama/generation/compiler.py")
          text = compiler.read_text(encoding="utf-8")
          old = "    expected = reference_image_calls + video_calls + tts_calls + native_audio_calls\n"
          assert old in text
          text = text.replace(
              old,
              "    # Native AV is included in the video submission; retain the logical usage\n"
              "    # metric without double-counting a second external API call.\n"
              "    expected = reference_image_calls + video_calls + tts_calls\n",
              1,
          )
          condition = (
              "        and len(units[0].frame.character_seed_ids) "
              "<= profile.policy.max_characters_for_15_seconds\n"
          )
          assert condition in text
          text = text.replace(
              condition,
              condition
              + "        and (\n"
              + "            not profile.policy.strict_lip_sync_shortens_segment\n"
              + "            or not units[0].frame.dialogue_cues\n"
              + "        )\n"
              + "        and not units[0].frame.prop_seed_ids\n"
              + "        and units[0].frame.camera.movement in {\"static\", \"none\"}\n",
              1,
          )
          marker = "    continuity_contracts, requirements = _build_continuity(prepared, segments)\n"
          assert marker in text
          text = text.replace(
              marker,
              marker
              + "    if any(item.generation_status == \"missing\" for item in requirements):\n"
              + "        quality_warnings.append(\n"
              + "            GenerationReadinessIssue(\n"
              + "                code=\"reference_assets_missing\",\n"
              + "                scope=\"planning\",\n"
              + "                severity=\"warning\",\n"
              + "                message=(\n"
              + "                    \"Reference assets are structurally specified but have not been \"\n"
              + "                    \"generated or approved.\"\n"
              + "                ),\n"
              + "            )\n"
              + "        )\n",
              1,
          )
          compiler.write_text(text, encoding="utf-8")

          serializer = Path("src/apps/jp_drama/generation/serialization.py")
          text = serializer.read_text(encoding="utf-8")
          imports = "import json\nimport os\nfrom pathlib import Path\n"
          assert imports in text
          text = text.replace(
              imports,
              "import json\nimport os\nimport shutil\nimport tempfile\nfrom pathlib import Path\n",
              1,
          )
          start = text.index("def write_generation_artifacts(")
          end = text.index("\ndef render_generation_summary(", start)
          replacement = '''def write_generation_artifacts(
              plan: GenerationPlanEpisode,
              output_dir: str | Path,
              *,
              overwrite: bool = False,
          ) -> dict[str, Path]:
              destination = Path(output_dir)
              destination.parent.mkdir(parents=True, exist_ok=True)
              if destination.exists() and not overwrite:
                  raise OSError("generation output already exists; pass --overwrite to replace it")

              staging = Path(
                  tempfile.mkdtemp(
                      prefix=f".{destination.name}.staging-",
                      dir=destination.parent,
                  )
              )
              backup: Path | None = None
              try:
                  staged_paths = {name: staging / name for name in OUTPUT_FILENAMES}
                  editorial_shots = [
                      shot.model_dump(mode="json", exclude_none=True)
                      for segment in plan.segments
                      for shot in segment.editorial_shots
                  ]
                  payloads = {
                      "generation_plan_episode.json": plan.to_canonical_json(indent=2) + "\n",
                      "generation_segments.json": _json(
                          [item.model_dump(mode="json", exclude_none=True) for item in plan.segments]
                      ),
                      "editorial_shots.json": _json(editorial_shots),
                      "continuity_contracts.json": _json(
                          [item.model_dump(mode="json", exclude_none=True) for item in plan.continuity_contracts]
                      ),
                      "reference_asset_requirements.json": _json(
                          [
                              item.model_dump(mode="json", exclude_none=True)
                              for item in plan.reference_asset_requirements
                          ]
                      ),
                      "generation_render_graph.json": _json(
                          plan.render_graph.model_dump(mode="json", exclude_none=True)
                      ),
                      "generation_cost_plan.json": _json(
                          plan.cost_plan.model_dump(mode="json", exclude_none=True)
                      ),
                      "generation_readiness_report.json": _json(
                          plan.readiness_report.model_dump(mode="json", exclude_none=True)
                      ),
                      "summary.txt": render_generation_summary(plan),
                  }
                  for name, content in payloads.items():
                      _atomic_write(staged_paths[name], content)

                  if destination.exists():
                      backup = Path(
                          tempfile.mkdtemp(
                              prefix=f".{destination.name}.backup-",
                              dir=destination.parent,
                          )
                      )
                      backup.rmdir()
                      os.replace(destination, backup)
                  os.replace(staging, destination)
                  if backup is not None:
                      shutil.rmtree(backup)
              except Exception:
                  if staging.exists():
                      shutil.rmtree(staging, ignore_errors=True)
                  if backup is not None and backup.exists() and not destination.exists():
                      os.replace(backup, destination)
                  raise

              return {name: destination / name for name in OUTPUT_FILENAMES}
          '''
          text = text[:start] + replacement + text[end:]
          serializer.write_text(text, encoding="utf-8")

          tests = Path("tests/test_jp_drama_generation_segments.py")
          text = tests.read_text(encoding="utf-8")
          if "import pytest\n" not in text:
              anchor = "from pathlib import Path\n"
              assert anchor in text
              text = text.replace(anchor, anchor + "\nimport pytest\n", 1)
          if "from src.apps.jp_drama.generation import serialization as serialization_module" not in text:
              anchor = "from src.apps.jp_drama.preparation.compiler import load_model_catalog\n"
              assert anchor in text
              text = text.replace(
                  anchor,
                  "from src.apps.jp_drama.generation import serialization as serialization_module\n"
                  "from src.apps.jp_drama.generation.serialization import write_generation_artifacts\n"
                  + anchor,
                  1,
              )
          anchor = "    assert plan.cost_plan.expected_calls == 8\n"
          assert anchor in text
          if "plan.cost_plan.reference_image_calls\n        + plan.cost_plan.video_calls" not in text:
              text = text.replace(
                  anchor,
                  anchor
                  + "    assert plan.cost_plan.native_audio_calls > 0\n"
                  + "    assert plan.cost_plan.expected_calls == (\n"
                  + "        plan.cost_plan.reference_image_calls\n"
                  + "        + plan.cost_plan.video_calls\n"
                  + "        + plan.cost_plan.tts_calls\n"
                  + "    )\n"
                  + "    assert \"reference_assets_missing\" in {\n"
                  + "        item.code for item in plan.readiness_report.warnings\n"
                  + "    }\n",
                  1,
              )
          if "def test_output_directory_transaction_preserves_existing_on_failure" not in text:
              text += '''


def test_output_directory_transaction_preserves_existing_on_failure(
    tmp_path: Path,
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    plan = compile_generation_plan(
        _prepared(),
        profile=ProviderSegmentationProfile.load(PROFILE_PATH),
        registry=_mock_registry(),
    )
    destination = tmp_path / "generation"
    write_generation_artifacts(plan, destination)
    before = {item.name: item.read_bytes() for item in destination.iterdir()}

    real_atomic_write = serialization_module._atomic_write
    calls = 0

    def fail_during_staging(path: Path, content: str) -> None:
        nonlocal calls
        calls += 1
        if calls == 2:
            raise OSError("injected staging failure")
        real_atomic_write(path, content)

    monkeypatch.setattr(serialization_module, "_atomic_write", fail_during_staging)
    with pytest.raises(OSError, match="injected staging failure"):
        write_generation_artifacts(plan, destination, overwrite=True)

    after = {item.name: item.read_bytes() for item in destination.iterdir()}
    assert after == before
    assert not list(tmp_path.glob(".generation.staging-*"))


def test_low_complexity_dialogue_does_not_use_conditional_15_seconds() -> None:
    plan = compile_generation_plan(
        _prepared(),
        profile=ProviderSegmentationProfile.load(PROFILE_PATH),
        registry=_mock_registry(),
    )
    assert all(
        segment.requested_duration_seconds < 15
        for segment in plan.segments
        if segment.dialogue_slices
    )
          '''
          tests.write_text(text, encoding="utf-8")

          docs = Path("docs/pr11-adaptive-generation-segment-compiler.md")
          text = docs.read_text(encoding="utf-8")
          text = text.replace(
              "All writes are atomic. The same source, profile, and registered capabilities\n",
              "All artifacts are staged in a sibling directory and published as one directory\n"
              "transaction, with rollback protection when overwriting. The same source, profile,\n"
              "and registered capabilities\n",
              1,
          )
          if "native_audio_calls` records native-AV usage" not in text:
              anchor = "Known adapter costs are totaled by currency. Currencies are not automatically\n"
              assert anchor in text
              text = text.replace(
                  anchor,
                  "`native_audio_calls` records native-AV usage but does not add a second API call;\n"
                  "native audio is produced by the same video submission.\n\n"
                  + anchor,
                  1,
              )
          docs.write_text(text, encoding="utf-8")
          PY

      - name: Validate corrected implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"
          python -m compileall -q src/apps/jp_drama
          python -m pytest -q tests/test_jp_drama_generation_segments.py

      - name: Publish fixups and remove temporary workflows
        run: |
          rm .github/workflows/pr11-review-fixups.yml
          rm .github/workflows/pr11-review-fixups-push.yml
          rm .github/workflows/pr11-review-fixups-v2.yml
          rm .github/workflows/pr11-review-fixups-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden PR11 costs and atomic outputs"
          git push origin HEAD:feature/jp-drama-adaptive-generation-segments
