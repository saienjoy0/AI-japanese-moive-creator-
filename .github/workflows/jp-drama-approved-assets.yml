name: Japanese Drama Approved Assets

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/assets/**"
      - "src/apps/jp_drama/workflows/prepare_asset_bundle.py"
      - "src/apps/jp_drama/workflows/approve_asset_bundle.py"
      - "src/apps/jp_drama/workflows/validate_asset_bundle.py"
      - "tests/test_jp_drama_approved_assets.py"
      - "docs/pr17-approved-assets-voices.md"
      - ".github/workflows/jp-drama-approved-assets.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/assets/**"
      - "src/apps/jp_drama/workflows/prepare_asset_bundle.py"
      - "src/apps/jp_drama/workflows/approve_asset_bundle.py"
      - "src/apps/jp_drama/workflows/validate_asset_bundle.py"
      - "tests/test_jp_drama_approved_assets.py"
      - "docs/pr17-approved-assets-voices.md"
      - ".github/workflows/jp-drama-approved-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-assets:
    name: Validate hash-bound masters frames and voices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile Japanese drama packages
        run: python -m compileall -q src/apps/jp_drama

      - name: Run approved asset tests
        run: |
          python -m pytest -q \
            tests/test_jp_drama_approved_assets.py \
            tests/test_jp_drama_action_beat_generation.py \
            tests/test_jp_drama_generation_segment_canary.py

      - name: Build ActionBeat generation contract
        run: |
          rm -rf output/jp_drama/pr17
          mkdir -p output/jp_drama/pr17
          python -m src.apps.jp_drama.workflows.ingest_script \
            --input examples/jp_drama/script_ingestion/sample_script.md \
            --output-dir output/jp_drama/pr17/ingestion \
            --llm-provider fixture
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input output/jp_drama/pr17/ingestion/episode_package.json \
            --output output/jp_drama/pr17/prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --strict
          python -m src.apps.jp_drama.workflows.prepare_generation \
            --input output/jp_drama/pr17/prepared/prepared_episode.json \
            --output-dir output/jp_drama/pr17/generation \
            --profile examples/jp_drama/generation/wan27_profile.json \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --require-route-ready
          python -m src.apps.jp_drama.workflows.prepare_asset_bundle \
            --prepared-input output/jp_drama/pr17/prepared/prepared_episode.json \
            --generation-plan output/jp_drama/pr17/generation/generation_plan_episode.json \
            --output output/jp_drama/pr17/assets-pending.json \
            --print-summary

      - name: Create deterministic CI master and first-frame files
        run: |
          python - <<'PY'
          import json
          import struct
          import zlib
          from pathlib import Path

          from src.apps.jp_drama.rendering.approval import create_approval_manifest

          root = Path("output/jp_drama/pr17")
          bundle = json.loads((root / "assets-pending.json").read_text())

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data)) + kind + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          def png(path, width, height, value):
              path.parent.mkdir(parents=True, exist_ok=True)
              raw = b"".join(
                  b"\x00" + bytes([value, value, value]) * width
                  for _ in range(height)
              )
              path.write_bytes(
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(raw))
                  + chunk(b"IEND", b"")
              )

          masters_by_segment = {}
          for asset in bundle["assets"]:
              if asset["role"] != "first_frame":
                  for segment in asset["required_for_segment_ids"]:
                      masters_by_segment.setdefault(segment, []).append(asset["asset_id"])

          bindings = {"approved_by": "ci-reviewer", "assets": {}, "voices": {}}
          for index, asset in enumerate(bundle["assets"]):
              asset_id = asset["asset_id"]
              if asset["role"] == "first_frame":
                  path = root / "approved" / "frames" / f"{asset_id}.png"
                  png(path, 90, 160, 30 + index % 180)
                  manifest = root / "approved" / "manifests" / f"{asset_id}.json"
                  create_approval_manifest(
                      shot_id=asset["subject_id"],
                      asset_path=path,
                      generated_by="ci-frame",
                      operation_id=f"ci:{asset_id}",
                      output_path=manifest,
                  )
                  bindings["assets"][asset_id] = {
                      "path": str(path),
                      "approval_manifest_path": str(manifest),
                      "verified_against_asset_ids": sorted(
                          masters_by_segment.get(asset["subject_id"], [])
                      ),
                  }
              else:
                  path = root / "approved" / "masters" / f"{asset_id}.png"
                  png(path, 64, 64, 30 + index % 180)
                  bindings["assets"][asset_id] = {
                      "path": str(path),
                      "generated_by": "ci-master",
                      "operation_id": f"ci:{asset_id}",
                  }

          for index, voice in enumerate(bundle["voice_profiles"]):
              bindings["voices"][voice["source_character_id"]] = {
                  "provider": "fixture-tts",
                  "voice_id": f"distinct-voice-{index + 1}",
                  "language": "ja-JP",
                  "speaking_rate": 1.0,
                  "pronunciation_dictionary": {"美緒": "みお"},
              }

          (root / "approval-bindings.json").write_text(
              json.dumps(bindings, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Apply and validate all approvals
        run: |
          python -m src.apps.jp_drama.workflows.approve_asset_bundle \
            --input output/jp_drama/pr17/assets-pending.json \
            --bindings output/jp_drama/pr17/approval-bindings.json \
            --output output/jp_drama/pr17/assets-approved.json \
            --approved-at 2026-08-05T03:00:00Z \
            --print-summary
          python -m src.apps.jp_drama.workflows.validate_asset_bundle \
            --bundle output/jp_drama/pr17/assets-approved.json \
            --prepared-input output/jp_drama/pr17/prepared/prepared_episode.json \
            --generation-plan output/jp_drama/pr17/generation/generation_plan_episode.json \
            --stage full_episode \
            --report output/jp_drama/pr17/asset-readiness.json \
            --print-report

      - name: Verify hard-gate evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("output/jp_drama/pr17")
          pending = json.loads((root / "assets-pending.json").read_text())
          approved = json.loads((root / "assets-approved.json").read_text())
          report = json.loads((root / "asset-readiness.json").read_text())

          assert all(item["approval_status"] == "pending" for item in pending["assets"])
          assert all(item["approval_status"] == "approved" for item in approved["assets"])
          assert all(item["approval_status"] == "approved" for item in approved["voice_profiles"])
          voices = {(item["provider"], item["voice_id"]) for item in approved["voice_profiles"]}
          assert len(voices) == len(approved["voice_profiles"])
          assert report["stage"] == "full_episode"
          assert report["ready"] is True
          assert report["errors"] == []
          assert report["required_asset_ids"]
          assert report["required_voice_character_ids"]
          PY

      - name: Ensure no approved media or secrets are committed
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' '*.png' '*.jpg' | grep -E 'jp_drama|approved_assets' || true)"

      - name: Upload approved asset contract
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-approved-assets-contract
          path: |
            output/jp_drama/pr17/assets-pending.json
            output/jp_drama/pr17/assets-approved.json
            output/jp_drama/pr17/asset-readiness.json
            output/jp_drama/pr17/approval-bindings.json
            output/jp_drama/pr17/approved/manifests
          if-no-files-found: error
          retention-days: 7
