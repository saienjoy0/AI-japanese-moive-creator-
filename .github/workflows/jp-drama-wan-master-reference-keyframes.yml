name: Japanese Drama Wan Master Reference Keyframes

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/assets/wan_references.py"
      - "src/apps/jp_drama/assets/wan_first_frame.py"
      - "src/apps/jp_drama/assets/__init__.py"
      - "src/apps/jp_drama/rendering/approval.py"
      - "src/apps/jp_drama/rendering/wan_master_tasks.py"
      - "src/apps/jp_drama/workflows/prepare_wan_master_keyframe.py"
      - "src/apps/jp_drama/workflows/register_wan_master_keyframe.py"
      - "tests/test_jp_drama_wan_master_reference_keyframes.py"
      - "docs/pr26-wan-master-reference-keyframes.md"
      - ".github/workflows/jp-drama-wan-master-reference-keyframes.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/assets/wan_references.py"
      - "src/apps/jp_drama/assets/wan_first_frame.py"
      - "src/apps/jp_drama/assets/__init__.py"
      - "src/apps/jp_drama/rendering/approval.py"
      - "src/apps/jp_drama/rendering/wan_master_tasks.py"
      - "src/apps/jp_drama/workflows/prepare_wan_master_keyframe.py"
      - "src/apps/jp_drama/workflows/register_wan_master_keyframe.py"
      - "tests/test_jp_drama_wan_master_reference_keyframes.py"
      - "docs/pr26-wan-master-reference-keyframes.md"
      - ".github/workflows/jp-drama-wan-master-reference-keyframes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Zero-call approved-master keyframe validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10"

      - name: Compile Wan master-reference contracts
        run: |
          python -m compileall -q \
            src/apps/jp_drama/assets/wan_references.py \
            src/apps/jp_drama/assets/wan_first_frame.py \
            src/apps/jp_drama/rendering/approval.py \
            src/apps/jp_drama/rendering/wan_master_tasks.py \
            src/apps/jp_drama/workflows/prepare_wan_master_keyframe.py \
            src/apps/jp_drama/workflows/register_wan_master_keyframe.py

      - name: Run Wan master-reference and regression tests
        env:
          DASHSCOPE_API_KEY: ""
          MINIMAX_API_KEY: ""
          ALIBABA_CLOUD_ACCESS_KEY_ID: ""
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ""
          OSS_ENDPOINT: ""
          OSS_BUCKET_NAME: ""
        run: |
          python -m pytest -q \
            tests/test_jp_drama_wan_master_reference_keyframes.py \
            tests/test_jp_drama_approved_assets.py \
            tests/test_jp_drama_asset_gated_canary.py \
            tests/test_jp_drama_wan27_canary.py \
            tests/test_jp_drama_seedance_storyboard_generation_bridge.py

      - name: Verify fail-closed provider boundary
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${MINIMAX_API_KEY:-}"
          grep -q "no provider request submitted" \
            src/apps/jp_drama/rendering/wan_master_tasks.py
          grep -q '"external_api_calls": 0' \
            src/apps/jp_drama/workflows/prepare_wan_master_keyframe.py
          grep -q '"external_api_calls": 0' \
            src/apps/jp_drama/workflows/register_wan_master_keyframe.py
