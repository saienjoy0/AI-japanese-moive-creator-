name: PR11 Review Fixups Push

on:
  push:
    branches:
      - feature/jp-drama-adaptive-generation-segments
    paths:
      - ".github/workflows/pr11-review-fixups-push.yml"

permissions:
  contents: write

jobs:
  apply-fixups:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/jp-drama-adaptive-generation-segments
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Execute reviewed fixup script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/pr11-review-fixups.yml").read_text(encoding="utf-8")
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          script = textwrap.dedent(
              workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          )

          block_start = script.index("old = '''    if (")
          replacement_call = "text = text.replace(old, new, 1)"
          block_end = script.index(replacement_call, block_start) + len(replacement_call)
          flexible_condition_patch = '''needle = (
              "        and len(units[0].frame.character_seed_ids) "
              "<= profile.policy.max_characters_for_15_seconds\\n"
          )
          expanded = needle + (
              "        and (\\n"
              "            not profile.policy.strict_lip_sync_shortens_segment\\n"
              "            or not units[0].frame.dialogue_cues\\n"
              "        )\\n"
              "        and not units[0].frame.prop_seed_ids\\n"
              "        and units[0].frame.camera.movement in {\\\"static\\\", \\\"none\\\"}\\n"
          )
          assert needle in text
          text = text.replace(needle, expanded, 1)'''
          script = script[:block_start] + flexible_condition_patch + script[block_end:]
          exec(compile(script, "pr11-review-fixups", "exec"))
          PY

      - name: Validate corrected implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"
          python -m compileall -q src/apps/jp_drama
          python -m pytest -q tests/test_jp_drama_generation_segments.py

      - name: Publish fixups and remove temporary workflows
        run: |
          rm .github/workflows/pr11-review-fixups.yml
          rm .github/workflows/pr11-review-fixups-push.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden PR11 costs and atomic outputs"
          git push origin HEAD:feature/jp-drama-adaptive-generation-segments
