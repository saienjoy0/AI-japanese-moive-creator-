name: Foundation CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-catalog:
    name: Model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate catalog and generated artifacts
        run: python scripts/validate_model_catalog.py

  backend:
    name: Backend compile and health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
      - name: Compile backend sources
        run: python -m compileall -q src scripts
      - name: Start and validate FastAPI
        run: python scripts/backend_server_smoke.py
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-diagnostics
          path: |
            backend.log
            health.json
            openapi.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:17177
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version
      - name: Install frontend dependencies
        run: |
          timeout 15m pnpm install --no-frozen-lockfile --ignore-scripts
          test -d node_modules/next-intl
          pnpm list --depth=0
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build

  offline-mock-episode:
    name: Offline Japanese MP4 smoke render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Render and validate three-shot episode
        run: python scripts/mock_episode_smoke.py
      - name: Upload mock episode
        uses: actions/upload-artifact@v4
        with:
          name: offline-mock-episode
          path: artifacts/mock_episode
          if-no-files-found: error
          retention-days: 14

  docker-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose config > /dev/null

  gemini-algieba-narration:
    name: Gemini Algieba E01 narration
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'tmp/gemini-algieba-run-20260810-v2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: python -m pip install --quiet --upgrade google-genai

      - name: Generate Algieba narration
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          cat > /tmp/synth.py <<'PY'
          import os, base64, wave, json, traceback
          from pathlib import Path
          from google import genai

          out = Path('out')
          lines = {
              'N01': '僕は小さい時、絵を描くことが好きでした。',
              'N02': 'ジムの絵具。なかでも藍と洋紅は、とても美しく見えました。',
              'N03': '取ったあとも、胸は少しも落ち着きませんでした。',
              'N04': 'もう、言い逃れはできませんでした。',
          }
          direction = '''# AUDIO PROFILE
A native Japanese adult male narrator in his late 30s to early 40s. He is the grown-up version of a sensitive, inward-looking boy remembering his childhood.

# SCENE
A quiet literary recollection of childhood in an old school in Yokohama. Beauty, temptation, shame, and the faint warmth of later forgiveness are present beneath the memory.

# DIRECTOR'S NOTES
Natural native Japanese. Warm, smooth, intimate, restrained.
Slightly slow pace, but not sleepy or theatrical.
Not a newsreader, commercial, anime character, or documentary announcer.
Keep sentence endings soft and human.
Do not over-act sadness; let nostalgia and regret stay very light.
Pronounce 藍 as あい and 洋紅 as ようこう clearly.
'''

          def write_wav(path, pcm):
              with wave.open(str(path), 'wb') as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(24000)
                  wf.writeframes(pcm)

          try:
              key = os.environ['GEMINI_API_KEY']
              if not key:
                  raise RuntimeError('GEMINI_API_KEY is empty')
              client = genai.Client(api_key=key)
              manifest = {}
              for name, text in lines.items():
                  prompt = f'{direction}\n# TRANSCRIPT\n[serious, gently reflective, slightly slow] {text}'
                  interaction = client.interactions.create(
                      model='gemini-3.1-flash-tts-preview',
                      input=prompt,
                      response_format={'type': 'audio'},
                      generation_config={'speech_config': [{'voice': 'Algieba'}]},
                  )
                  data = interaction.output_audio.data
                  pcm = base64.b64decode(data) if isinstance(data, str) else data
                  wav_path = out / f'{name}_algieba.wav'
                  write_wav(wav_path, pcm)
                  manifest[name] = {
                      'text': text,
                      'voice': 'Algieba',
                      'model': 'gemini-3.1-flash-tts-preview',
                      'file': wav_path.name,
                  }
              (out / 'manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
              )
          except Exception:
              (out / 'error.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PY
          python /tmp/synth.py

      - name: Validate outputs
        run: |
          set -euo pipefail
          for f in out/N01_algieba.wav out/N02_algieba.wav out/N03_algieba.wav out/N04_algieba.wav; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done

      - name: Persist narration or diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          printf 'source_sha=%s\n' "$GITHUB_SHA" > out/run_info.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C tmp/gemini-algieba-output-20260810-v1
          rm -rf .tmp/gemini_algieba_narration
          mkdir -p .tmp/gemini_algieba_narration
          cp -a out/. .tmp/gemini_algieba_narration/
          git add .tmp/gemini_algieba_narration
          git commit -m 'tmp: persist Gemini Algieba narration result'
          git push --force origin HEAD:tmp/gemini-algieba-output-20260810-v1

      - name: Upload narration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-gemini-algieba-narration-20260810
          path: out/
          if-no-files-found: error
          retention-days: 7
