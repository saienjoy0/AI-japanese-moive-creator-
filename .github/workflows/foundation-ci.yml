name: Foundation CI

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-catalog:
    name: Model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate catalog and generated artifacts
        run: python scripts/validate_model_catalog.py

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:17177
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: |
          node --version
          npm --version
          timeout 15m npm ci --no-audit --no-fund
          test -d node_modules/next-intl
          npm ls --depth=0
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  offline-mock-episode:
    name: Offline Japanese MP4 smoke render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Render and validate three-shot episode
        run: python scripts/mock_episode_smoke.py
      - name: Upload mock episode
        uses: actions/upload-artifact@v4
        with:
          name: offline-mock-episode
          path: artifacts/mock_episode
          if-no-files-found: error
          retention-days: 14

  docker-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose config > /dev/null
