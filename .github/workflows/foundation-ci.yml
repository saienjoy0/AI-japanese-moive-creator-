name: Foundation CI

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-catalog:
    name: Model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate catalog and generated artifacts
        run: python scripts/validate_model_catalog.py

  backend:
    name: Backend compile and health
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      APP_ENV: test
      DISABLE_EXTERNAL_AI: "true"
      NO_PROXY: "localhost,127.0.0.1"
      no_proxy: "localhost,127.0.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
      - name: Compile backend sources
        run: python -m compileall -q src
      - name: Start FastAPI without provider credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/uploads output/video output/assets output/storyboard
          mkdir -p output/audio output/export output/video_inputs output/outputs/videos
          mkdir -p output/playground/images output/playground/videos
          python -m uvicorn src.apps.comic_gen.api:app --host 127.0.0.1 --port 17177 > backend.log 2>&1 &
          echo $! > backend.pid

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:17177/health > health.json; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat backend.log
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:17177/openapi.json > openapi.json
          python scripts/validate_backend_smoke.py
      - name: Stop backend and print diagnostics
        if: always()
        shell: bash
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
          tail -n 200 backend.log 2>/dev/null || true
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-diagnostics
          path: |
            backend.log
            health.json
            openapi.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:17177
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.1 --activate
          pnpm --version
      - name: Install frontend dependencies
        run: |
          timeout 15m pnpm install --no-frozen-lockfile --ignore-scripts
          test -d node_modules/next-intl
          pnpm list --depth=0
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm run build

  offline-mock-episode:
    name: Offline Japanese MP4 smoke render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Render and validate three-shot episode
        run: python scripts/mock_episode_smoke.py
      - name: Upload mock episode
        uses: actions/upload-artifact@v4
        with:
          name: offline-mock-episode
          path: artifacts/mock_episode
          if-no-files-found: error
          retention-days: 14

  docker-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose config > /dev/null
