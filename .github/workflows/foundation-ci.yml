name: Foundation CI

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read

jobs:
  model-catalog:
    name: Model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate catalog and generated artifacts
        run: python scripts/validate_model_catalog.py
