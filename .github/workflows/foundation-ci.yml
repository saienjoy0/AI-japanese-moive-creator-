name: Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  APP_ENV: test
  DISABLE_EXTERNAL_AI: "true"
  NO_PROXY: "localhost,127.0.0.1"
  no_proxy: "localhost,127.0.0.1"

jobs:
  model-catalog:
    name: Model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate catalog and generated artifacts
        run: python scripts/validate_model_catalog.py

  backend:
    name: Backend compile and health
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile backend sources
        run: python -m compileall -q src
      - name: Start FastAPI without provider credentials
        shell: bash
        run: |
          mkdir -p output/uploads output/video output/assets output/playground/images output/playground/videos
          python -m uvicorn src.apps.comic_gen.api:app --host 127.0.0.1 --port 17177 > backend.log 2>&1 &
          echo $! > backend.pid

          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:17177/health > health.json; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat backend.log
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:17177/openapi.json > openapi.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("health.json").read_text(encoding="utf-8"))
          openapi = json.loads(Path("openapi.json").read_text(encoding="utf-8"))
          assert health["ok"] is True, health
          assert openapi["info"]["title"] == "AI Comic Gen API", openapi["info"]
          assert "/health" in openapi["paths"], "health endpoint missing from OpenAPI"
          print("BACKEND HEALTH OK", health)
          PY
      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
          fi
          tail -n 200 backend.log 2>/dev/null || true
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-diagnostics
          path: |
            backend.log
            health.json
            openapi.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:17177
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  offline-mock-episode:
    name: Offline Japanese MP4 smoke render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
      - name: Render and validate three-shot episode
        run: python scripts/mock_episode_smoke.py
      - name: Upload mock episode
        uses: actions/upload-artifact@v4
        with:
          name: offline-mock-episode
          path: artifacts/mock_episode
          if-no-files-found: error
          retention-days: 14

  docker-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config > /dev/null

  temporary-run-report:
    name: Temporary run report
    if: always() && github.event_name == 'push' && github.ref_name == 'feature/ci-foundation-smoke-tests'
    needs: [model-catalog, backend, frontend, offline-mock-episode, docker-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ci-foundation-smoke-tests
      - name: Record run id and job outcomes
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          MODEL_CATALOG_RESULT: ${{ needs.model-catalog.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MOCK_EPISODE_RESULT: ${{ needs.offline-mock-episode.result }}
          DOCKER_RESULT: ${{ needs.docker-config.result }}
        run: |
          mkdir -p ci-results
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              "run_id": int(os.environ["RUN_ID"]),
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "source_sha": os.environ["SOURCE_SHA"],
              "results": {
                  "model_catalog": os.environ["MODEL_CATALOG_RESULT"],
                  "backend": os.environ["BACKEND_RESULT"],
                  "frontend": os.environ["FRONTEND_RESULT"],
                  "offline_mock_episode": os.environ["MOCK_EPISODE_RESULT"],
                  "docker_config": os.environ["DOCKER_RESULT"],
              },
          }
          Path("ci-results/foundation-latest.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit temporary report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ci-results/foundation-latest.json
          git commit -m "chore: record foundation ci result [skip ci]"
          git push origin HEAD:feature/ci-foundation-smoke-tests
