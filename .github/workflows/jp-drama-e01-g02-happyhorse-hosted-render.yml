name: Japanese Drama E01-G02 HappyHorse Hosted Render

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e01-g02-happyhorse-hosted-render.yml"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_directed_continuity_canary.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_continuity_canary.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_canary.py"
      - "src/apps/jp_drama/rendering/happyhorse11.py"
      - "src/apps/jp_drama/rendering/provider_ledger.py"
      - "examples/jp_drama/dashscope_happyhorse_live_providers.json"
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jp-drama-e01-g02-happyhorse-hosted-render
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CONTROL_ISSUE: "37"
  SEALED_RUN_ID: "31077418519"
  CONTINUITY_RUN_ID: "31091499445"
  SEALED_ARTIFACT: happyhorse-e01-g01-r2v-paid-approval
  CONTINUITY_ARTIFACT: jp-drama-E01-G01-continuity-frame
  PROVIDER_CONFIG: examples/jp_drama/dashscope_happyhorse_live_providers.json
  SEGMENT_ID: E01-G02
  RESULT_ARTIFACT: happyhorse-e01-g02-r2v-10s-result

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-shot G2 safety contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/jp-drama-e01-g02-happyhorse-hosted-render.yml')
          text = path.read_text(encoding='utf-8')
          required = [
              'RUN_ONE_BUNCH_E01_G02_HAPPYHORSE_ONCE',
              "github.event.comment.user.login == github.repository_owner",
              "github.event.issue.pull_request == null",
              'GITHUB_RUN_ATTEMPT',
              '--segment-id "$SEGMENT_ID"',
              '--input-mode references',
              '--stage preflight',
              '--stage render',
              '--max-api-calls 1',
              '--max-cost-cny 6',
              '--cost-reserve-cny 6',
              'E01_G02_HOSTED_RENDER_RESERVATION:',
              'E01_G02_HOSTED_TASK_STATE:',
              'PREFLIGHT_FINGERPRINT',
              'DASHSCOPE_BASE_URL: https://ws-fflq327rfjpr3ob2.cn-beijing.maas.aliyuncs.com',
              'DASHSCOPE_UPLOAD_BASE_URL: https://dashscope.aliyuncs.com',
              'happyhorse-e01-g02-r2v-10s-result',
          ]
          for item in required:
              assert item in text, item
          assert 'cancel-in-progress: false' in text
          assert 'continue-on-error: true' in text
          PY

  hosted-render:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_ONE_BUNCH_E01_G02_HAPPYHORSE_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Require the first and only workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout main production code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require the verified repository-level Beijing API key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: test -n "$DASHSCOPE_API_KEY"

      - name: Authenticate the Beijing key without creating a video task
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/dashscope-beijing-auth.json"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --get 'https://dashscope.aliyuncs.com/api/v1/uploads' \
            --data-urlencode 'action=getPolicy' \
            --data-urlencode 'model=happyhorse-1.1-r2v' \
            --header "Authorization: Bearer $DASHSCOPE_API_KEY")"
          test "$HTTP_CODE" = "200"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt

      - name: Download sealed episode inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEALED_ARTIFACT }}
          path: input/sealed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEALED_RUN_ID }}

      - name: Download verified G1 continuity frame
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONTINUITY_ARTIFACT }}
          path: input/continuity
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CONTINUITY_RUN_ID }}

      - name: Locate immutable inputs and initialize state
        run: |
          set -euo pipefail
          PREPARED="$(find input/sealed -type f -path '*/input/prepared_episode.json' -print -quit)"
          PLAN="$(find input/sealed -type f -path '*/input/generation_plan_episode.json' -print -quit)"
          BUNDLE="$(find input/sealed -type f -path '*/input/asset_bundle_masters_approved.json' -print -quit)"
          FRAME="$(find input/continuity -type f -name 'E01-G01_end.png' -print -quit)"
          METADATA="$(find input/continuity -type f -name 'E01-G01_end.json' -print -quit)"
          test -n "$PREPARED" && test -s "$PREPARED"
          test -n "$PLAN" && test -s "$PLAN"
          test -n "$BUNDLE" && test -s "$BUNDLE"
          test -n "$FRAME" && test -s "$FRAME"
          test -n "$METADATA" && test -s "$METADATA"
          STATE_DIR="$RUNNER_TEMP/e01-g02-happyhorse-hosted-state"
          mkdir -p "$STATE_DIR"
          {
            echo "PREPARED=$PREPARED"
            echo "PLAN=$PLAN"
            echo "BUNDLE=$BUNDLE"
            echo "FRAME=$FRAME"
            echo "METADATA=$METADATA"
            echo "STATE_DIR=$STATE_DIR"
          } >> "$GITHUB_ENV"

      - name: Re-run corrected zero-call preflight immediately before payment
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_segment_directed_continuity_canary \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --segment-id "$SEGMENT_ID" \
            --asset-bundle "$BUNDLE" \
            --providers "$PROVIDER_CONFIG" \
            --output "$STATE_DIR/E01-G02-r2v.mp4" \
            --input-mode references \
            --stage preflight \
            --continuity-frame "$FRAME" \
            --continuity-frame-metadata "$METADATA" \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --report "$STATE_DIR/preflight.json" \
            --print-report

      - name: Verify exact G2 request and export fingerprint
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = Path(os.environ['STATE_DIR'])
          report = json.loads((state / 'preflight.json').read_text(encoding='utf-8'))
          prompt = report['request']['prompt']
          refs = report['references']
          assert report['valid'] is True
          assert report['status'] == 'ready_for_single_paid_submission'
          assert report['segment_id'] == 'E01-G02'
          assert report['model'] == 'happyhorse-1.1-r2v'
          assert report['request']['duration'] == 10
          assert report['request']['ratio'] == '9:16'
          assert report['provider_submissions_this_run'] == 0
          assert report['external_api_calls'] == 0
          assert len(refs) == 6
          assert [item['subject_id'] for item in refs[:5]] == ['C01', 'C02', 'S01', 'P01', 'P02']
          assert refs[5]['role'] == 'continuity_frame'
          assert refs[5]['subject_id'] == 'E01-G01'
          assert 'Inner voice-over' in prompt
          assert 'does not speak aloud' in prompt
          assert 'Keep the mouth closed' in prompt
          assert "synchronize the visible speaker's mouth" not in prompt
          assert 'looking screen-right' in prompt
          assert 'exactly two P02 solid paint cakes' in prompt
          assert 'P02 remains inside P01' in prompt
          assert 'never touches, removes, or steals' in prompt
          assert 'opening frame and continuity anchor only' in prompt
          print('PREFLIGHT_FINGERPRINT=' + report['request']['request_fingerprint'])
          PY
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['STATE_DIR']) / 'preflight.json').read_text(encoding='utf-8'))
          print('PREFLIGHT_FINGERPRINT=' + report['request']['request_fingerprint'])
          PY

      - name: Reserve this exact G2 fingerprint before provider submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREFIX="E01_G02_HOSTED_RENDER_RESERVATION:"
          COMMENTS="$(gh api "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100")"
          EXISTING="$(jq -r --arg p "$PREFIX" '[.[] | select(.body | startswith($p))] | last | .body // ""' <<<"$COMMENTS")"
          test -z "$EXISTING"
          BODY="$PREFIX run_id=$GITHUB_RUN_ID fingerprint=$PREFLIGHT_FINGERPRINT attempt=1"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Render exactly one approved G2 R2V task
        id: render
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: https://ws-fflq327rfjpr3ob2.cn-beijing.maas.aliyuncs.com
          DASHSCOPE_UPLOAD_BASE_URL: https://dashscope.aliyuncs.com
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_segment_directed_continuity_canary \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --segment-id "$SEGMENT_ID" \
            --asset-bundle "$BUNDLE" \
            --providers "$PROVIDER_CONFIG" \
            --output "$STATE_DIR/E01-G02-r2v.mp4" \
            --input-mode references \
            --stage render \
            --continuity-frame "$FRAME" \
            --continuity-frame-metadata "$METADATA" \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --ledger-file "$STATE_DIR/ledger.json" \
            --report "$STATE_DIR/render.json" \
            --print-report

      - name: Persist provider task identity to issue 37
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VALUES="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = Path(os.environ['STATE_DIR'])
          ledger_path = state / 'ledger.json'
          if not ledger_path.is_file():
              print('none\tnone\tno_ledger')
              raise SystemExit(0)
          ledger = json.loads(ledger_path.read_text(encoding='utf-8'))
          operations = ledger.get('operations') or {}
          if not operations:
              print('none\tnone\tno_operation')
              raise SystemExit(0)
          operation = next(iter(operations.values()))
          print('\t'.join([
              operation.get('provider_task_id') or 'none',
              operation.get('provider_request_id') or 'none',
              operation.get('status') or 'unknown',
          ]))
          PY
          )"
          IFS=$'\t' read -r TASK_ID REQUEST_ID TASK_STATUS <<<"$VALUES"
          BODY="E01_G02_HOSTED_TASK_STATE: run_id=$GITHUB_RUN_ID task_id=$TASK_ID request_id=$REQUEST_ID status=$TASK_STATUS attempt=1"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Verify successful G2 output and continuity extraction
        id: verify
        if: steps.render.outcome == 'success'
        run: |
          set -euo pipefail
          test -s "$STATE_DIR/E01-G02-r2v.mp4"
          test -s "$STATE_DIR/render.json"
          test -s "$STATE_DIR/ledger.json"
          test -s "$STATE_DIR/continuity/E01-G02/E01-G02_end.png"
          test -s "$STATE_DIR/continuity/E01-G02/E01-G02_end.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = Path(os.environ['STATE_DIR'])
          report = json.loads((state / 'render.json').read_text(encoding='utf-8'))
          end = json.loads((state / 'continuity/E01-G02/E01-G02_end.json').read_text(encoding='utf-8'))
          assert report['valid'] is True
          assert report['segment_id'] == 'E01-G02'
          assert report['output_sha256'].startswith('sha256:')
          assert report['audio_stream_present'] is True
          assert report['duration_seconds'] + 0.08 >= 10
          assert end['source_segment_id'] == 'E01-G02'
          assert end['derived_for_next_segment_id'] == 'E01-G03'
          PY

      - name: Upload G2 result, evidence, ledger, and next continuity frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: ${{ env.STATE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Report G2 hosted render result to issue 37
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="E01-G02 HappyHorse hosted render result

          - run_id: $GITHUB_RUN_ID
          - render: ${{ steps.render.outcome }}
          - verify: ${{ steps.verify.outcome }}
          - artifact: $RESULT_ARTIFACT
          - URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Fail the workflow if rendering or verification failed
        if: steps.render.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
