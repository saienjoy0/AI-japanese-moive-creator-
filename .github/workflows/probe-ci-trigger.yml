name: CI Trigger Probe

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ci-foundation-smoke-tests
      - name: Record workflow trigger
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p ci-results
          printf '{\n  "run_id": %s,\n  "source_sha": "%s"\n}\n' "$RUN_ID" "$SOURCE_SHA" > ci-results/probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ci-results/probe.json
          git commit -m "chore: record ci trigger probe [skip ci]"
          git push origin HEAD:feature/ci-foundation-smoke-tests
