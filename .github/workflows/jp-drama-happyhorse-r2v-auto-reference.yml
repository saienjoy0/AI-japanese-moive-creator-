name: Japanese Drama HappyHorse R2V Auto Reference

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/assets/reference_resolution.py"
      - "src/apps/jp_drama/generation/happyhorse_r2v.py"
      - "src/apps/jp_drama/production/reference_prompt.py"
      - "src/apps/jp_drama/rendering/happyhorse11.py"
      - "src/apps/jp_drama/rendering/happyhorse_r2v_contract.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_r2v_segment_canary.py"
      - "assets/jp_drama/one_bunch_of_grapes/creative_overrides/E01-G01.r2v.json"
      - "tests/test_jp_drama_happyhorse11_r2v.py"
      - "tests/test_jp_drama_happyhorse_r2v_contracts.py"
      - "tests/test_jp_drama_happyhorse_official_canary.py"
      - "docs/pr31-happyhorse-r2v-auto-reference.md"
      - ".github/workflows/jp-drama-happyhorse-r2v-auto-reference.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/assets/reference_resolution.py"
      - "src/apps/jp_drama/generation/happyhorse_r2v.py"
      - "src/apps/jp_drama/production/reference_prompt.py"
      - "src/apps/jp_drama/rendering/happyhorse11.py"
      - "src/apps/jp_drama/rendering/happyhorse_r2v_contract.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_r2v_segment_canary.py"
      - "assets/jp_drama/one_bunch_of_grapes/creative_overrides/E01-G01.r2v.json"
      - "tests/test_jp_drama_happyhorse11_r2v.py"
      - "tests/test_jp_drama_happyhorse_r2v_contracts.py"
      - "tests/test_jp_drama_happyhorse_official_canary.py"
      - "docs/pr31-happyhorse-r2v-auto-reference.md"
      - ".github/workflows/jp-drama-happyhorse-r2v-auto-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  happyhorse-r2v-auto-reference:
    name: Validate R2V references approval binding and restart safety
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile R2V implementation
        run: |
          python -m compileall -q \
            src/apps/jp_drama/assets/reference_resolution.py \
            src/apps/jp_drama/generation/happyhorse_r2v.py \
            src/apps/jp_drama/production/reference_prompt.py \
            src/apps/jp_drama/rendering/happyhorse11.py \
            src/apps/jp_drama/rendering/happyhorse_r2v_contract.py \
            src/apps/jp_drama/workflows/render_happyhorse_r2v_segment_canary.py

      - name: Run HappyHorse I2V and R2V contract tests
        run: |
          python -m pytest -q \
            tests/test_jp_drama_happyhorse_official_canary.py \
            tests/test_jp_drama_happyhorse11_r2v.py \
            tests/test_jp_drama_happyhorse_r2v_contracts.py

      - name: Assert committed creative override is valid JSON
        run: |
          python - <<'PY'
          from src.apps.jp_drama.production.reference_prompt import load_creative_override

          override = load_creative_override(
              "assets/jp_drama/one_bunch_of_grapes/creative_overrides/E01-G01.r2v.json"
          )
          assert override is not None
          assert override.segment_id == "E01-G01"
          assert len(override.timeline) == 4
          assert override.timeline[-1].end_seconds == 10
          PY

      - name: Assert CI made no paid provider calls
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${DASHSCOPE_WORKSPACE_ID:-}"
          test -z "${DASHSCOPE_BASE_URL:-}"
