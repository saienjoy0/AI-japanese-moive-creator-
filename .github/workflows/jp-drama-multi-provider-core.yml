name: Japanese Drama Multi-Provider Core

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/apps/jp_drama/**"
      - "tests/test_jp_drama_multi_provider_core.py"
      - "examples/jp_drama/**"
      - "docs/jp-drama-multi-provider-core.md"
      - ".github/workflows/jp-drama-multi-provider-core.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/**"
      - "tests/test_jp_drama_multi_provider_core.py"
      - "examples/jp_drama/**"
      - "docs/jp-drama-multi-provider-core.md"
      - ".github/workflows/jp-drama-multi-provider-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-drama-multi-provider-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-core:
    name: Validate Wan and Seedance planning without paid calls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile provider core
        run: python -m compileall -q src/apps/jp_drama

      - name: Run provider core contract tests
        run: python -m pytest -q tests/test_jp_drama_multi_provider_core.py

      - name: Verify no paid credentials or generated media
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${DASHSCOPE_WORKSPACE_ID:-}"
          test -z "${ARK_API_KEY:-}"
          ! git ls-files | grep -E '\.(mp4|mov|wav|mp3)$'
