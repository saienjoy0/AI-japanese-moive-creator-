name: Japanese Drama E01-G04 HappyHorse Hosted Render

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e01-g04-happyhorse-hosted-render.yml"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_hard_cut_canary.py"
      - "tests/test_jp_drama_hard_cut_prompt.py"
      - "assets/jp_drama/one_bunch_of_grapes/keyframes/E01-G04/**"
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jp-drama-e01-g04-happyhorse-hosted-render
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CONTROL_ISSUE: "37"
  SEALED_RUN_ID: "31077418519"
  PREVIOUS_RUN_ID: "31114790928"
  SEALED_ARTIFACT: happyhorse-e01-g01-r2v-paid-approval
  PREVIOUS_ARTIFACT: happyhorse-e01-g03-r2v-10s-result
  PROVIDER_CONFIG: examples/jp_drama/dashscope_happyhorse_live_providers.json
  SEGMENT_ID: E01-G04
  RESULT_ARTIFACT: happyhorse-e01-g04-r2v-10s-result
  COMPOSITION_FRAME: assets/jp_drama/one_bunch_of_grapes/keyframes/E01-G04/E01-G04_first.png
  COMPOSITION_APPROVAL: assets/jp_drama/one_bunch_of_grapes/keyframes/E01-G04/E01-G04_first.approval.json
  APPROVAL_BINDINGS: assets/jp_drama/one_bunch_of_grapes/keyframes/E01-G04/approval_bindings.json

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10" "pillow==12.2.0"
      - name: Reconstruct approved G4 keyframe
        run: |
          cat assets/jp_drama/one_bunch_of_grapes/keyframes/E01-G04/E01-G04_first.jpg.b64.part-* | base64 --decode > "$RUNNER_TEMP/E01-G04_first.jpg"
          python - <<'PY'
          import os
          from PIL import Image
          Image.open(os.path.join(os.environ['RUNNER_TEMP'], 'E01-G04_first.jpg')).convert('RGB').save(
              os.environ['COMPOSITION_FRAME'], format='PNG', optimize=True, compress_level=9
          )
          PY
          echo "5354b074ae257eede70c417ede45a74140d613a376d6d6aba89a1d8994d8a6e9  $COMPOSITION_FRAME" | sha256sum --check --strict
      - name: Test hard-cut contract
        env:
          DASHSCOPE_API_KEY: ""
          MINIMAX_API_KEY: ""
        run: |
          python -m compileall -q src/apps/jp_drama/workflows/render_happyhorse_segment_hard_cut_canary.py
          python -m pytest -q tests/test_jp_drama_hard_cut_prompt.py
          python - <<'PY'
          from pathlib import Path
          from src.apps.jp_drama.rendering.approval import load_and_verify_approval
          manifest, image = load_and_verify_approval(
              Path('assets/jp_drama/one_bunch_of_grapes/keyframes/E01-G04/E01-G04_first.approval.json'),
              expected_shot_id='E01-G04',
          )
          assert image == Path('assets/jp_drama/one_bunch_of_grapes/keyframes/E01-G04/E01-G04_first.png').resolve()
          assert manifest.asset_sha256 == 'sha256:5354b074ae257eede70c417ede45a74140d613a376d6d6aba89a1d8994d8a6e9'
          assert (manifest.width, manifest.height) == (450, 800)
          PY

  render-g4:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_ONE_BUNCH_E01_G04_HAPPYHORSE_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Require first workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pillow==12.2.0"
      - name: Require and verify Beijing API key without creating a task
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          test -n "$DASHSCOPE_API_KEY"
          HTTP_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/auth.json" --write-out '%{http_code}' --get 'https://dashscope.aliyuncs.com/api/v1/uploads' --data-urlencode 'action=getPolicy' --data-urlencode 'model=happyhorse-1.1-r2v' --header "Authorization: Bearer $DASHSCOPE_API_KEY")"
          test "$HTTP_CODE" = "200"
      - name: Reconstruct approved G4 keyframe
        run: |
          cat assets/jp_drama/one_bunch_of_grapes/keyframes/E01-G04/E01-G04_first.jpg.b64.part-* | base64 --decode > "$RUNNER_TEMP/E01-G04_first.jpg"
          python - <<'PY'
          import os
          from PIL import Image
          Image.open(os.path.join(os.environ['RUNNER_TEMP'], 'E01-G04_first.jpg')).convert('RGB').save(
              os.environ['COMPOSITION_FRAME'], format='PNG', optimize=True, compress_level=9
          )
          PY
          echo "5354b074ae257eede70c417ede45a74140d613a376d6d6aba89a1d8994d8a6e9  $COMPOSITION_FRAME" | sha256sum --check --strict
      - name: Download immutable episode inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEALED_ARTIFACT }}
          path: input/sealed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEALED_RUN_ID }}
      - name: Download verified G3 result
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PREVIOUS_ARTIFACT }}
          path: input/previous
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PREVIOUS_RUN_ID }}
      - name: Verify inputs and register approved G4 frame
        run: |
          set -euo pipefail
          PREPARED="$(find input/sealed -type f -path '*/input/prepared_episode.json' -print -quit)"
          PLAN="$(find input/sealed -type f -path '*/input/generation_plan_episode.json' -print -quit)"
          SOURCE_BUNDLE="$(find input/sealed -type f -path '*/input/asset_bundle_masters_approved.json' -print -quit)"
          PREVIOUS_VIDEO="$(find input/previous -type f -name 'E01-G03-r2v.mp4' -print -quit)"
          PREVIOUS_REPORT="$(find input/previous -type f -name 'render.json' -print -quit)"
          PRIOR_FRAME="$(find input/previous -type f -name 'E01-G03_end.png' -print -quit)"
          PRIOR_METADATA="$(find input/previous -type f -name 'E01-G03_end.json' -print -quit)"
          for item in "$PREPARED" "$PLAN" "$SOURCE_BUNDLE" "$PREVIOUS_VIDEO" "$PREVIOUS_REPORT" "$PRIOR_FRAME" "$PRIOR_METADATA" "$COMPOSITION_FRAME" "$COMPOSITION_APPROVAL" "$APPROVAL_BINDINGS"; do test -n "$item" && test -s "$item"; done
          STATE_DIR="$RUNNER_TEMP/e01-g04-state"
          mkdir -p "$STATE_DIR"
          export PREPARED PLAN SOURCE_BUNDLE PREVIOUS_VIDEO PREVIOUS_REPORT PRIOR_FRAME PRIOR_METADATA STATE_DIR
          {
            echo "PREPARED=$PREPARED"
            echo "PLAN=$PLAN"
            echo "SOURCE_BUNDLE=$SOURCE_BUNDLE"
            echo "PREVIOUS_VIDEO=$PREVIOUS_VIDEO"
            echo "PREVIOUS_REPORT=$PREVIOUS_REPORT"
            echo "PRIOR_FRAME=$PRIOR_FRAME"
            echo "PRIOR_METADATA=$PRIOR_METADATA"
            echo "STATE_DIR=$STATE_DIR"
          } >> "$GITHUB_ENV"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from src.apps.jp_drama.assets.bundle import apply_asset_approvals
          from src.apps.jp_drama.assets.models import ApprovedAssetBundle
          from src.apps.jp_drama.rendering.approval import ApprovedKeyframeManifest

          def sha(path):
              h = hashlib.sha256()
              with Path(path).open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return 'sha256:' + h.hexdigest()

          report = json.loads(Path(os.environ['PREVIOUS_REPORT']).read_text(encoding='utf-8'))
          metadata = json.loads(Path(os.environ['PRIOR_METADATA']).read_text(encoding='utf-8'))
          assert report['valid'] is True and report['segment_id'] == 'E01-G03'
          assert report['output_sha256'] == sha(os.environ['PREVIOUS_VIDEO'])
          assert report['output_sha256'] == 'sha256:6d9aa9260d517d27a582652b66d4b77661d2bb3f40ca91bd4fa43afc414f3512'
          assert metadata['source_segment_id'] == 'E01-G03'
          assert metadata['derived_for_next_segment_id'] == 'E01-G04'
          assert metadata['source_video_sha256'] == report['output_sha256']
          assert metadata['frame_sha256'] == sha(os.environ['PRIOR_FRAME'])
          assert metadata['frame_sha256'] == 'sha256:28b9c6993dc04b0d7da52e4adfbb26a90b519fc9f24c8146c876cdc04756e8ae'
          source = ApprovedAssetBundle.model_validate_json(Path(os.environ['SOURCE_BUNDLE']).read_text(encoding='utf-8'))
          bindings = json.loads(Path(os.environ['APPROVAL_BINDINGS']).read_text(encoding='utf-8'))
          approval = ApprovedKeyframeManifest.model_validate_json(Path(os.environ['COMPOSITION_APPROVAL']).read_text(encoding='utf-8'))
          approved = apply_asset_approvals(source, bindings, approved_at=approval.approved_at)
          destination = Path(os.environ['STATE_DIR']) / 'asset_bundle_E01-G04_approved.json'
          destination.write_text(approved.to_canonical_json(indent=2) + '\n', encoding='utf-8')
          PY
          BUNDLE="$STATE_DIR/asset_bundle_E01-G04_approved.json"
          test -s "$BUNDLE"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          cp "$COMPOSITION_FRAME" "$STATE_DIR/E01-G04_first.png"
          cp "$COMPOSITION_APPROVAL" "$STATE_DIR/E01-G04_first.approval.json"
      - name: Run zero-call preflight immediately before payment
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_segment_hard_cut_canary --prepared-input "$PREPARED" --generation-plan "$PLAN" --segment-id "$SEGMENT_ID" --asset-bundle "$BUNDLE" --providers "$PROVIDER_CONFIG" --output "$STATE_DIR/E01-G04-r2v.mp4" --input-mode references --stage preflight --composition-frame "$COMPOSITION_FRAME" --composition-frame-approval "$COMPOSITION_APPROVAL" --prior-state-frame "$PRIOR_FRAME" --prior-state-metadata "$PRIOR_METADATA" --resolution 720P --max-api-calls 1 --max-cost-cny 6 --cost-reserve-cny 6 --report "$STATE_DIR/preflight.json" --print-report
      - name: Verify exact request and export fingerprint
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['STATE_DIR']) / 'preflight.json').read_text(encoding='utf-8'))
          prompt = report['request']['prompt']
          refs = report['references']
          assert report['valid'] is True
          assert report['status'] == 'ready_for_single_paid_submission'
          assert report['segment_id'] == 'E01-G04'
          assert report['model'] == 'happyhorse-1.1-r2v'
          assert report['continuity_mode'] == 'hard_cut_state'
          assert report['provider_submissions_this_run'] == 0
          assert report['external_api_calls'] == 0
          assert report['request']['duration'] == 10
          assert report['request']['ratio'] == '9:16'
          assert len(refs) == 9
          assert [r['subject_id'] for r in refs[:7]] == ['C01','C02','C90','C91','S02','P01','P02']
          assert refs[7]['role'] == 'composition_frame'
          assert refs[8]['role'] == 'prior_state_frame'
          assert report['composition_frame']['sha256'] == 'sha256:5354b074ae257eede70c417ede45a74140d613a376d6d6aba89a1d8994d8a6e9'
          for text in ['clean hard cut','藍と洋紅がない','休みに教室にいたのは、君だけだ','僕じゃない','closed teacher-room door','P02 stays hidden','does not fall']:
              assert text in prompt, text
          print('PREFLIGHT_FINGERPRINT=' + report['request']['request_fingerprint'])
          PY
      - name: Reserve fingerprint before provider submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREFIX="E01_G04_HOSTED_RENDER_RESERVATION:"
          COMMENTS="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100" | jq -s 'add')"
          EXISTING="$(jq -r --arg p "$PREFIX" '[.[] | select(.body | startswith($p))] | length' <<< "$COMMENTS")"
          test "$EXISTING" = "0"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" -f "body=$PREFIX run_id=$GITHUB_RUN_ID fingerprint=$PREFLIGHT_FINGERPRINT attempt=1"
      - name: Render exactly one approved G4 task
        id: render
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: https://ws-fflq327rfjpr3ob2.cn-beijing.maas.aliyuncs.com
          DASHSCOPE_UPLOAD_BASE_URL: https://dashscope.aliyuncs.com
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_segment_hard_cut_canary --prepared-input "$PREPARED" --generation-plan "$PLAN" --segment-id "$SEGMENT_ID" --asset-bundle "$BUNDLE" --providers "$PROVIDER_CONFIG" --output "$STATE_DIR/E01-G04-r2v.mp4" --input-mode references --stage render --composition-frame "$COMPOSITION_FRAME" --composition-frame-approval "$COMPOSITION_APPROVAL" --prior-state-frame "$PRIOR_FRAME" --prior-state-metadata "$PRIOR_METADATA" --resolution 720P --max-api-calls 1 --max-cost-cny 6 --cost-reserve-cny 6 --ledger-file "$STATE_DIR/ledger.json" --report "$STATE_DIR/render.json" --print-report
      - name: Persist provider task identity
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VALUES="$(python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['STATE_DIR']) / 'ledger.json'
          if not path.is_file():
              print('none\tnone\tno_ledger')
              raise SystemExit
          operations = json.loads(path.read_text(encoding='utf-8')).get('operations') or {}
          if not operations:
              print('none\tnone\tno_operation')
              raise SystemExit
          op = next(iter(operations.values()))
          print('\t'.join([op.get('provider_task_id') or 'none', op.get('provider_request_id') or 'none', op.get('status') or 'unknown']))
          PY
          )"
          IFS=$'\t' read -r TASK_ID REQUEST_ID TASK_STATUS <<< "$VALUES"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" -f "body=E01_G04_HOSTED_TASK_STATE: run_id=$GITHUB_RUN_ID task_id=$TASK_ID request_id=$REQUEST_ID status=$TASK_STATUS attempt=1"
      - name: Verify video and G5 handoff
        id: verify
        if: steps.render.outcome == 'success'
        run: |
          test -s "$STATE_DIR/E01-G04-r2v.mp4"
          test -s "$STATE_DIR/render.json"
          test -s "$STATE_DIR/ledger.json"
          test -s "$STATE_DIR/continuity/E01-G04/E01-G04_end.png"
          test -s "$STATE_DIR/continuity/E01-G04/E01-G04_end.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = Path(os.environ['STATE_DIR'])
          report = json.loads((state / 'render.json').read_text(encoding='utf-8'))
          end = json.loads((state / 'continuity/E01-G04/E01-G04_end.json').read_text(encoding='utf-8'))
          assert report['valid'] is True and report['segment_id'] == 'E01-G04'
          assert report['provider_submissions_this_run'] == 1
          assert report['audio_stream_present'] is True
          assert report['duration_seconds'] + 0.08 >= 10
          assert end['source_segment_id'] == 'E01-G04'
          assert end['derived_for_next_segment_id'] == 'E01-G05'
          assert end['source_video_sha256'] == report['output_sha256']
          PY
      - name: Upload result and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: ${{ env.STATE_DIR }}
          if-no-files-found: error
          retention-days: 30
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" -f "body=E01-G04 HappyHorse hosted render result

          - run_id: $GITHUB_RUN_ID
          - render: ${{ steps.render.outcome }}
          - verify: ${{ steps.verify.outcome }}
          - artifact: $RESULT_ARTIFACT
          - URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Fail if rendering or verification failed
        if: steps.render.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
