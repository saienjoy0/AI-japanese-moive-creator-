name: Japanese Drama E01-G02 Directed HappyHorse Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e01-g02-happyhorse-directed-preflight.yml"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_directed_continuity_canary.py"
      - "tests/test_jp_drama_directed_continuity_prompt.py"
      - "tests/test_jp_drama_happyhorse_official_canary.py"
      - "tests/test_jp_drama_continuity_frame.py"
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
    paths:
      - ".github/workflows/jp-drama-e01-g02-happyhorse-directed-preflight.yml"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_directed_continuity_canary.py"
      - "tests/test_jp_drama_directed_continuity_prompt.py"
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jp-drama-e01-g02-happyhorse-directed-preflight
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CONTROL_ISSUE: "37"
  SEALED_RUN_ID: "31077418519"
  CONTINUITY_RUN_ID: "31091499445"
  SEALED_ARTIFACT: happyhorse-e01-g01-r2v-paid-approval
  CONTINUITY_ARTIFACT: jp-drama-E01-G01-continuity-frame
  SEGMENT_ID: E01-G02

jobs:
  contract-test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10"

      - name: Compile the directed continuity wrapper
        run: |
          python -m compileall -q \
            src/apps/jp_drama/workflows/render_happyhorse_segment_directed_continuity_canary.py

      - name: Test dialogue and continuity prompt policy
        run: |
          python -m pytest -q \
            tests/test_jp_drama_directed_continuity_prompt.py \
            tests/test_jp_drama_happyhorse_official_canary.py \
            tests/test_jp_drama_continuity_frame.py

      - name: Prove the correction is minimal and provider-call free
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${MINIMAX_API_KEY:-}"
          grep -q 'Inner voice-over' \
            src/apps/jp_drama/workflows/render_happyhorse_segment_directed_continuity_canary.py
          grep -q 'opening frame and continuity anchor only' \
            src/apps/jp_drama/workflows/render_happyhorse_segment_directed_continuity_canary.py
          grep -q 'never touches, removes, or steals' \
            src/apps/jp_drama/workflows/render_happyhorse_segment_directed_continuity_canary.py

  materialize-preflight:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'PREFLIGHT_ONE_BUNCH_E01_G02_HAPPYHORSE'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require first workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt

      - name: Download the sealed episode inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEALED_ARTIFACT }}
          path: input/sealed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEALED_RUN_ID }}

      - name: Download the verified G1 continuity frame
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CONTINUITY_ARTIFACT }}
          path: input/continuity
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CONTINUITY_RUN_ID }}

      - name: Locate immutable inputs
        run: |
          set -euo pipefail
          PREPARED="$(find input/sealed -type f -path '*/input/prepared_episode.json' -print -quit)"
          PLAN="$(find input/sealed -type f -path '*/input/generation_plan_episode.json' -print -quit)"
          BUNDLE="$(find input/sealed -type f -path '*/input/asset_bundle_masters_approved.json' -print -quit)"
          FRAME="$(find input/continuity -type f -name 'E01-G01_end.png' -print -quit)"
          METADATA="$(find input/continuity -type f -name 'E01-G01_end.json' -print -quit)"
          test -n "$PREPARED" && test -s "$PREPARED"
          test -n "$PLAN" && test -s "$PLAN"
          test -n "$BUNDLE" && test -s "$BUNDLE"
          test -n "$FRAME" && test -s "$FRAME"
          test -n "$METADATA" && test -s "$METADATA"
          {
            echo "PREPARED=$PREPARED"
            echo "PLAN=$PLAN"
            echo "BUNDLE=$BUNDLE"
            echo "FRAME=$FRAME"
            echo "METADATA=$METADATA"
          } >> "$GITHUB_ENV"

      - name: Run corrected zero-call E01-G02 preflight
        run: |
          mkdir -p output
          python -m src.apps.jp_drama.workflows.render_happyhorse_segment_directed_continuity_canary \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --segment-id "$SEGMENT_ID" \
            --asset-bundle "$BUNDLE" \
            --providers examples/jp_drama/dashscope_live_providers.json \
            --output output/E01-G02-happyhorse-r2v.mp4 \
            --input-mode references \
            --stage preflight \
            --continuity-frame "$FRAME" \
            --continuity-frame-metadata "$METADATA" \
            --report output/E01-G02.happyhorse-directed.preflight.json \
            --print-report | tee output/E01-G02.happyhorse-directed.stdout.json

      - name: Verify exact G2 request before any paid call
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${MINIMAX_API_KEY:-}"
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("output/E01-G02.happyhorse-directed.preflight.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          prompt = report["request"]["prompt"]
          references = report["references"]

          assert report["valid"] is True
          assert report["status"] == "ready_for_single_paid_submission"
          assert report["segment_id"] == "E01-G02"
          assert report["input_mode"] == "references"
          assert report["model"] == "happyhorse-1.1-r2v"
          assert report["request"]["duration"] == 10
          assert report["request"]["ratio"] == "9:16"
          assert report["provider_submissions_this_run"] == 0
          assert report["external_api_calls"] == 0

          assert "Inner voice-over" in prompt
          assert "does not speak aloud" in prompt
          assert "Keep the mouth closed" in prompt
          assert "synchronize the visible speaker's mouth" not in prompt
          assert "Directed shot progression for E01-G02" in prompt
          assert "exactly two P02 solid paint cakes" in prompt
          assert "P02 remains inside P01" in prompt
          assert "never touches, removes, or steals" in prompt
          assert "opening frame and continuity anchor only" in prompt
          assert "Do not freeze, loop, or repeat" in prompt

          assert len(references) == 6
          assert [item["subject_id"] for item in references[:5]] == [
              "C01", "C02", "S01", "P01", "P02"
          ]
          assert references[5]["role"] == "continuity_frame"
          assert references[5]["subject_id"] == "E01-G01"
          assert report["continuity_frame"]["source_segment_id"] == "E01-G01"
          PY

      - name: Upload corrected G2 preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: one-bunch-E01-G02-happyhorse-directed-preflight
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Report the zero-call result to issue 37
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION="${{ job.status }}"
          BODY="E01-G02 corrected HappyHorse preflight

          - G1 end frame reused: yes
          - inner monologue lip sync: disabled
          - G2 theft before G3: prohibited
          - reference count: 6
          - provider calls: 0
          - status: $CONCLUSION
          - run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"
