name: Japanese Drama Wan 2.7 Canary

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/apps/jp_drama/**"
      - "tests/test_jp_drama_*.py"
      - "examples/jp_drama/**"
      - "docs/jp-drama-wan27-canary.md"
      - ".github/workflows/jp-drama-wan27-canary.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/**"
      - "tests/test_jp_drama_*.py"
      - "examples/jp_drama/**"
      - "docs/jp-drama-wan27-canary.md"
      - ".github/workflows/jp-drama-wan27-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-drama-wan27-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wan27-contract:
    name: Validate official Wan 2.7 contracts without paid calls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install FFmpeg, Japanese fonts, backend dependencies, and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile provider and canary code
        run: python -m compileall -q src/apps/jp_drama

      - name: Run PR3 through PR8 focused tests
        run: |
          python -m pytest -q \
            tests/test_jp_drama_domain.py \
            tests/test_jp_drama_example.py \
            tests/test_jp_drama_preparation.py \
            tests/test_jp_drama_persistence.py \
            tests/test_jp_drama_mock_render.py \
            tests/test_jp_drama_live_providers.py \
            tests/test_jp_drama_wan27_canary.py

      - name: Prepare strict sample
        run: |
          rm -rf output/jp_drama
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input examples/jp_drama/minimal_episode_package.json \
            --output output/jp_drama/prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --dry-run \
            --strict

      - name: Run one-shot canary preflight without credentials
        run: |
          unset DASHSCOPE_API_KEY DASHSCOPE_WORKSPACE_ID DASHSCOPE_BASE_URL
          python -m src.apps.jp_drama.workflows.render_canary_episode \
            --input output/jp_drama/prepared/prepared_episode.json \
            --output output/jp_drama/canary_shot_01.mp4 \
            --providers examples/jp_drama/dashscope_live_providers.json \
            --shot-id shot_01 \
            --stage preflight \
            --max-api-calls 3 \
            --print-report \
            --report output/jp_drama/wan27_canary_preflight.json
          test ! -e output/jp_drama/canary_shot_01.mp4
          test ! -e output/jp_drama/.canary_shot_01_shot_01_canary_work

      - name: Verify canary cost and approval contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("output/jp_drama/wan27_canary_preflight.json").read_text(encoding="utf-8")
          )
          assert report["valid"] is True
          assert report["shot_id"] == "shot_01"
          assert report["keyframe_calls"] == 1
          assert report["render_calls_without_approved_keyframe"] == 3
          assert report["render_calls_with_approved_keyframe"] == 2
          assert report["max_api_calls"] == 3
          assert report["external_api_calls"] == 0
          assert set(report["missing_environment"]) == {
              "DASHSCOPE_API_KEY",
              "DASHSCOPE_WORKSPACE_ID",
          }
          manifest = report["provider_manifest"]
          assert manifest["region"] == "singapore"
          assert manifest["image_size"] == "960*1696"
          assert manifest["video_resolution"] == "720P"
          PY

      - name: Verify no paid credential or generated media is committed
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${DASHSCOPE_WORKSPACE_ID:-}"
          python - <<'PY'
          import re
          from pathlib import Path

          guarded = [
              Path("examples/jp_drama/dashscope_live_providers.json"),
              *Path("src/apps/jp_drama").rglob("*.py"),
          ]
          findings = []
          pattern = re.compile(r"sk-[A-Za-z0-9_-]{12,}")
          for path in guarded:
              for number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  if pattern.search(line):
                      findings.append(f"{path}:{number}")
          assert not findings, "credential-like values found: " + ", ".join(findings)
          PY
          ! git ls-files | grep -E '\.(mp4|mov|wav|mp3)$'

      - name: Upload zero-cost canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-wan27-canary-contract
          path: |
            output/jp_drama/wan27_canary_preflight.json
            examples/jp_drama/dashscope_live_providers.json
          if-no-files-found: error
          retention-days: 7
