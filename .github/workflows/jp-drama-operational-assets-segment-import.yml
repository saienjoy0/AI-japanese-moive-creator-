name: Japanese Drama Operational Assets and Segment Import

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/assets/publication.py"
      - "src/apps/jp_drama/assets/__init__.py"
      - "src/apps/jp_drama/production/importer.py"
      - "src/apps/jp_drama/production/__init__.py"
      - "src/apps/jp_drama/workflows/publish_h3_reference_assets.py"
      - "src/apps/jp_drama/workflows/import_provider_segment.py"
      - "src/apps/jp_drama/workflows/assemble_segment_artifacts.py"
      - "tests/test_jp_drama_operational_assets_and_segment_import.py"
      - "docs/pr25-operational-assets-segment-import.md"
      - ".github/workflows/jp-drama-operational-assets-segment-import.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/assets/publication.py"
      - "src/apps/jp_drama/assets/__init__.py"
      - "src/apps/jp_drama/production/importer.py"
      - "src/apps/jp_drama/production/__init__.py"
      - "src/apps/jp_drama/workflows/publish_h3_reference_assets.py"
      - "src/apps/jp_drama/workflows/import_provider_segment.py"
      - "src/apps/jp_drama/workflows/assemble_segment_artifacts.py"
      - "tests/test_jp_drama_operational_assets_and_segment_import.py"
      - "docs/pr25-operational-assets-segment-import.md"
      - ".github/workflows/jp-drama-operational-assets-segment-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Fake OSS and zero-call provider artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10"

      - name: Compile operational contracts
        run: |
          python -m compileall -q \
            src/apps/jp_drama/assets/publication.py \
            src/apps/jp_drama/production/importer.py \
            src/apps/jp_drama/workflows/publish_h3_reference_assets.py \
            src/apps/jp_drama/workflows/import_provider_segment.py \
            src/apps/jp_drama/workflows/assemble_segment_artifacts.py

      - name: Run operational asset and segment import tests
        run: |
          python -m pytest -q \
            tests/test_jp_drama_operational_assets_and_segment_import.py \
            tests/test_jp_drama_approved_assets.py \
            tests/test_jp_drama_minimax_h3_safety.py \
            tests/test_jp_drama_asset_gated_canary.py \
            tests/test_jp_drama_production_entry.py

      - name: Verify no live credentials or publish calls are available
        run: |
          test -z "${ALIBABA_CLOUD_ACCESS_KEY_ID:-}"
          test -z "${ALIBABA_CLOUD_ACCESS_KEY_SECRET:-}"
          test -z "${OSS_ENDPOINT:-}"
          test -z "${OSS_BUCKET_NAME:-}"
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${MINIMAX_API_KEY:-}"
          grep -q "publishing requires execute_upload=True" \
            src/apps/jp_drama/assets/publication.py
          grep -q "publication approval digest does not match preflight" \
            src/apps/jp_drama/assets/publication.py
          grep -q "segment MP4, evidence, or plan changed after preflight" \
            src/apps/jp_drama/production/importer.py
