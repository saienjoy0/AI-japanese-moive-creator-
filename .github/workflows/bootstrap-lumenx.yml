name: Bootstrap LumenX foundation

on:
  push:
    branches:
      - bootstrap/lumenx-import
    paths:
      - .github/workflows/bootstrap-lumenx.yml

permissions:
  contents: write

jobs:
  import-lumenx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge LumenX with upstream history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp README.md /tmp/project-initial-readme.md
          git remote add upstream https://github.com/alibaba/lumenx.git
          git fetch upstream main

          set +e
          git merge upstream/main --allow-unrelated-histories --no-commit
          merge_status=$?
          set -e

          if git ls-files -u README.md | grep -q .; then
            git checkout --theirs -- README.md
            git add README.md
          fi

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts:"
            echo "$unresolved"
            exit 1
          fi

          mkdir -p docs
          cp /tmp/project-initial-readme.md docs/PROJECT_ORIGIN.md

          cat > UPSTREAM.md <<'EOF'
          # Upstream tracking

          This repository uses [Alibaba LumenX](https://github.com/alibaba/lumenx) as its initial production foundation.

          - Upstream repository: `alibaba/lumenx`
          - Imported branch: `main`
          - Imported commit: `7a1213a0db73ab90ca976f5c4b4ca680e1ae1d2d`
          - Import date: 2026-08-04
          - Integration branch: `bootstrap/lumenx-import`

          The Japanese short-drama adaptation, trend analysis, cost routing, and quality-control modules will be developed separately from upstream code where practical, so future upstream updates remain reviewable.
          EOF

          cat > THIRD_PARTY_NOTICES.md <<'EOF'
          # Third-party notices

          ## LumenX

          Portions of this repository originate from Alibaba LumenX.

          Copyright (c) 2026 Alibaba

          LumenX is distributed under the MIT License. The original `LICENSE` file and copyright notice are retained in this repository.

          Upstream: `https://github.com/alibaba/lumenx`
          EOF

          git add README.md docs/PROJECT_ORIGIN.md UPSTREAM.md THIRD_PARTY_NOTICES.md
          git commit -m "chore: import LumenX as the production foundation"
          git push origin HEAD:bootstrap/lumenx-import
