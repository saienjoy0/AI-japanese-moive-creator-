name: Japanese Drama Script Ingestion

on:
  pull_request:
    branches:
      - main
      - feature/jp-drama-multi-provider-core
    paths:
      - "src/apps/jp_drama/ingestion/**"
      - "src/apps/jp_drama/workflows/ingest_script.py"
      - "tests/test_jp_drama_script_ingestion.py"
      - "examples/jp_drama/script_ingestion/**"
      - "docs/jp-drama-script-ingestion.md"
      - ".github/workflows/jp-drama-script-ingestion.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/ingestion/**"
      - "src/apps/jp_drama/workflows/ingest_script.py"
      - "tests/test_jp_drama_script_ingestion.py"
      - "examples/jp_drama/script_ingestion/**"
      - "docs/jp-drama-script-ingestion.md"
      - ".github/workflows/jp-drama-script-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-drama-script-ingestion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  script-ingestion:
    name: Convert a normal Japanese script without paid calls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile ingestion package
        run: python -m compileall -q src/apps/jp_drama

      - name: Run script ingestion tests
        run: python -m pytest -q tests/test_jp_drama_script_ingestion.py

      - name: Run zero-cost fixture CLI
        run: |
          rm -rf output/jp_drama/ingestion-ci
          python -m src.apps.jp_drama.workflows.ingest_script \
            --input examples/jp_drama/script_ingestion/sample_script.md \
            --output-dir output/jp_drama/ingestion-ci \
            --llm-provider fixture \
            --rights-status unknown
          test -s output/jp_drama/ingestion-ci/normalized_script.txt
          test -s output/jp_drama/ingestion-ci/structured_script.json
          test -s output/jp_drama/ingestion-ci/episode_package.json
          test -s output/jp_drama/ingestion-ci/ingestion_report.json
          test -s output/jp_drama/ingestion-ci/unresolved_items.json

      - name: Verify zero paid calls and no credentials
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("output/jp_drama/ingestion-ci/ingestion_report.json").read_text())
          assert report["valid"] is True
          assert report["external_api_calls"] == 0
          package = json.loads(Path("output/jp_drama/ingestion-ci/episode_package.json").read_text())
          assert len(package["shot_plan"]["shots"]) == 3
          assert sum(item["duration_seconds"] for item in package["shot_plan"]["shots"]) == 45
          PY

      - name: Upload ingestion evidence
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-script-ingestion
          path: output/jp_drama/ingestion-ci
          if-no-files-found: error
          retention-days: 7
