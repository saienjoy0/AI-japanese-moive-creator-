name: Japanese Drama E02 Gemini Algieba Comment Relay

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_E02_ALGIEBA_NARRATION_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch E02 Gemini Algieba narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/jp-drama-e02-gemini-algieba-narration.yml/dispatches" \
            -f ref=main

  report:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'CHECK_E02_ALGIEBA_NARRATION_STATUS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report latest E02 narration workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/jp-drama-e02-gemini-algieba-narration.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0]')"
          test -n "$RUN_JSON"
          test "$RUN_JSON" != "null"
          RUN_ID="$(jq -r '.id' <<<"$RUN_JSON")"
          STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion // "pending"' <<<"$RUN_JSON")"
          URL="$(jq -r '.html_url' <<<"$RUN_JSON")"
          BODY=$(printf 'E02 Algieba narration status\n\n- run_id: `%s`\n- status: `%s`\n- conclusion: `%s`\n- URL: %s' "$RUN_ID" "$STATUS" "$CONCLUSION" "$URL")
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/37/comments" \
            -f "body=$BODY"
