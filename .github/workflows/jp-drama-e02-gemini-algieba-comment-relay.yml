name: Japanese Drama E02 Gemini Algieba Comment Relay

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_E02_ALGIEBA_NARRATION_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch E02 Gemini Algieba narration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/jp-drama-e02-gemini-algieba-narration.yml/dispatches" \
            -f ref=main
