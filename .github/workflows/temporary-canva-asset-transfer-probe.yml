name: Temporary Canva asset transfer probe

on:
  push:
    branches:
      - assets/one-bunch-master-references

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe signed Canva rendition URLs
        shell: bash
        env:
          THUMB_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F1b6e8ca0-4c33-4e50-a3bd-768f62b01fe8/watermark:F/width:112?csig=AAAAAAAAAAAAAAAAAAAAAOfVvgEbbA6lt5TqIC2wnvZScWCjSsnRwSTDu5lTrLJl&exp=1785954148&osig=AAAAAAAAAAAAAAAAAAAAAL5zfVc3Q0i4Ekov2j9ZcHbhROdCuI9JEikCc7XQR7QE&signer=media-rpc&x-canva-quality=thumbnail"
          FULL_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:1672/quality:100/uri:ifs%3A%2F%2FM%2F1b6e8ca0-4c33-4e50-a3bd-768f62b01fe8/watermark:F/width:941?csig=AAAAAAAAAAAAAAAAAAAAAOfVvgEbbA6lt5TqIC2wnvZScWCjSsnRwSTDu5lTrLJl&exp=1785954148&osig=AAAAAAAAAAAAAAAAAAAAAL5zfVc3Q0i4Ekov2j9ZcHbhROdCuI9JEikCc7XQR7QE&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          for kind in thumb full; do
            var="${kind^^}_URL"
            url="${!var}"
            status=$(curl --location --silent --show-error --output "$kind.bin" --write-out '%{http_code}' "$url")
            echo "$kind HTTP=$status bytes=$(wc -c < "$kind.bin")"
            file "$kind.bin" || true
            python - "$kind.bin" <<'PY'
          import struct, sys
          path = sys.argv[1]
          data = open(path, 'rb').read(32)
          if data[:8] == b'\x89PNG\r\n\x1a\n':
              width, height = struct.unpack('>II', data[16:24])
              print(f'PNG dimensions={width}x{height}')
          else:
              print('Not a PNG:', data[:24])
          PY
          done
