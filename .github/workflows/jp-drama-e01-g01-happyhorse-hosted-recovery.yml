name: Japanese Drama E01-G01 HappyHorse Hosted Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e01-g01-happyhorse-hosted-recovery.yml"
      - "src/apps/jp_drama/rendering/happyhorse11.py"
      - "src/apps/jp_drama/rendering/provider_ledger.py"
      - "src/apps/jp_drama/workflows/render_happyhorse_segment_canary.py"
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: jp-drama-e01-g01-happyhorse-hosted-recovery
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  SOURCE_RUN_ID: "31077418519"
  CONTROL_ISSUE: "37"
  EXPECTED_APPROVAL_DIGEST: sha256:3ec02df5cebad83874ac04ac3b1711037af70231fa8861e3df939e744b70eb3e
  REQUEST_FINGERPRINT: sha256:4cc0dbce337978c8918e4ec8e93ad6d8922519cb5d81e2a92a49b93c1d311131
  PROVIDER_CONFIG: examples/jp_drama/dashscope_happyhorse_live_providers.json
  APPROVAL_ROOT: output/jp_drama/happyhorse-e01-g01-paid-approval
  RESULT_ROOT: output/jp_drama/happyhorse-e01-g01-hosted-result

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify hosted-recovery safety contract
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              ".github/workflows/jp-drama-e01-g01-happyhorse-hosted-recovery.yml"
          ).read_text(encoding="utf-8")
          required = [
              "RUN_E01_G01_HAPPYHORSE_HOSTED_RECOVERY_ONCE",
              'SOURCE_RUN_ID: "31077418519"',
              'CONTROL_ISSUE: "37"',
              "github.event.comment.user.login == github.repository_owner",
              "github.event.issue.pull_request == null",
              "runs-on: ubuntu-latest",
              "environment: happyhorse-paid",
              "GITHUB_RUN_ATTEMPT",
              "--max-api-calls 1",
              "--max-cost-cny 6",
              "cancel-in-progress: false",
              "E01_G01_HOSTED_RENDER_RESERVATION:",
              "E01_G01_HOSTED_TASK_STATE:",
              "STEP_COUNT",
              "actions/download-artifact@v4",
              "run-id:",
              "sha256:3ec02df5cebad83874ac04ac3b1711037af70231fa8861e3df939e744b70eb3e",
              "sha256:4cc0dbce337978c8918e4ec8e93ad6d8922519cb5d81e2a92a49b93c1d311131",
          ]
          for item in required:
              assert item in text, item
          PY

  hosted-recovery:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_E01_G01_HAPPYHORSE_HOSTED_RECOVERY_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: happyhorse-paid
    steps:
      - name: Require the first and only workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout main production code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify provider secrets before changing the old run
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_WORKSPACE_ID: ${{ secrets.DASHSCOPE_WORKSPACE_ID }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: |
          test -n "$DASHSCOPE_API_KEY"
          if test -z "$DASHSCOPE_BASE_URL"; then
            test -n "$DASHSCOPE_WORKSPACE_ID"
          fi

      - name: Prove the old render executed zero steps and cancel its pending run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JOBS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          RENDER="$(jq -c '[.jobs[] | select(.name == "render")][0]' <<<"$JOBS")"
          test -n "$RENDER"
          test "$RENDER" != "null"
          STEP_COUNT="$(jq -r '(.steps // []) | length' <<<"$RENDER")"
          test "$STEP_COUNT" = "0"
          RENDER_STATUS="$(jq -r '.status' <<<"$RENDER")"
          case "$RENDER_STATUS" in
            queued|waiting|pending|in_progress|completed) ;;
            *) exit 1 ;;
          esac

          STATUS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.status')"
          if test "$STATUS" != "completed"; then
            gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/cancel"
          fi

          for _ in $(seq 1 60); do
            STATUS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.status')"
            test "$STATUS" = "completed" && break
            sleep 2
          done
          test "$STATUS" = "completed"

          JOBS="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          RENDER="$(jq -c '[.jobs[] | select(.name == "render")][0]' <<<"$JOBS")"
          STEP_COUNT="$(jq -r '(.steps // []) | length' <<<"$RENDER")"
          test "$STEP_COUNT" = "0"
          CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RENDER")"
          test "$CONCLUSION" = "cancelled" -o "$CONCLUSION" = "skipped"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt

      - name: Download the sealed zero-call render inputs
        uses: actions/download-artifact@v4
        with:
          name: happyhorse-e01-g01-r2v-paid-approval
          path: ${{ env.APPROVAL_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Verify the sealed request and all three input contracts
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["APPROVAL_ROOT"])
          approval = json.loads((root / "approval.json").read_text(encoding="utf-8"))
          assert approval["approval_digest"] == os.environ["EXPECTED_APPROVAL_DIGEST"]
          assert approval["request_fingerprint"] == os.environ["REQUEST_FINGERPRINT"]
          material = approval["approval_material"]
          assert material["model"] == "happyhorse-1.1-r2v"
          assert material["segment_id"] == "E01-G01"
          assert material["request"]["duration"] == 10
          assert material["request"]["resolution"] == "720P"
          assert material["request"]["ratio"] == "9:16"
          assert material["provider_submission_limit"] == 1
          assert [item["subject_id"] for item in material["references"]] == [
              "C01", "S01", "S05", "P03", "P04"
          ]
          for name in [
              "prepared_episode.json",
              "generation_plan_episode.json",
              "asset_bundle_masters_approved.json",
          ]:
              path = root / "input" / name
              assert path.is_file() and path.stat().st_size > 0, path
          PY

      - name: Reserve this fingerprint before any provider submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STATE_DIR="$RUNNER_TEMP/e01-g01-happyhorse-hosted-state"
          mkdir -p "$STATE_DIR"
          printf 'STATE_DIR=%s\n' "$STATE_DIR" >> "$GITHUB_ENV"
          cp "$APPROVAL_ROOT/approval.json" "$STATE_DIR/approval.json"

          PREFIX="E01_G01_HOSTED_RENDER_RESERVATION:"
          COMMENTS="$(gh api "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100")"
          EXISTING="$(jq -r --arg p "$PREFIX" '[.[] | select(.body | startswith($p))] | last | .body // ""' <<<"$COMMENTS")"
          EXPECTED="$PREFIX run_id=$GITHUB_RUN_ID fingerprint=$REQUEST_FINGERPRINT attempt=1"
          if test -z "$EXISTING"; then
            gh api --method POST \
              "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
              -f "body=$EXPECTED"
          else
            test "$EXISTING" = "$EXPECTED"
          fi

      - name: Render exactly one approved 10-second R2V task
        id: render
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_WORKSPACE_ID: ${{ secrets.DASHSCOPE_WORKSPACE_ID }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          DASHSCOPE_UPLOAD_BASE_URL: ${{ secrets.DASHSCOPE_UPLOAD_BASE_URL }}
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_segment_canary \
            --prepared-input "$APPROVAL_ROOT/input/prepared_episode.json" \
            --generation-plan "$APPROVAL_ROOT/input/generation_plan_episode.json" \
            --segment-id E01-G01 \
            --asset-bundle "$APPROVAL_ROOT/input/asset_bundle_masters_approved.json" \
            --providers "$PROVIDER_CONFIG" \
            --output "$STATE_DIR/E01-G01-r2v.mp4" \
            --input-mode references \
            --stage render \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --ledger-file "$STATE_DIR/ledger.json" \
            --report "$STATE_DIR/render.json" \
            --print-report

      - name: Persist any provider task identity to issue 37
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${STATE_DIR:-}" || exit 0
          test -f "$STATE_DIR/ledger.json" || exit 0
          VALUES="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          ledger = json.loads(
              (Path(os.environ["STATE_DIR"]) / "ledger.json").read_text(encoding="utf-8")
          )
          if not ledger.get("operations"):
              raise SystemExit(0)
          operation = next(iter(ledger["operations"].values()))
          print("\t".join([
              operation.get("provider_task_id") or "",
              operation.get("provider_request_id") or "none",
              operation.get("status") or "unknown",
          ]))
          PY
          )"
          test -n "$VALUES" || exit 0
          IFS=$'\t' read -r TASK_ID REQUEST_ID TASK_STATUS <<<"$VALUES"
          test -n "$TASK_ID" || exit 0
          BODY="E01_G01_HOSTED_TASK_STATE: run_id=$GITHUB_RUN_ID task_id=$TASK_ID request_id=$REQUEST_ID status=$TASK_STATUS attempt=1"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Verify the generated MP4 and its ledger SHA
        id: verify
        if: steps.render.outcome == 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          state = Path(os.environ["STATE_DIR"])
          ledger = json.loads((state / "ledger.json").read_text(encoding="utf-8"))
          report = json.loads((state / "render.json").read_text(encoding="utf-8"))
          video = state / "E01-G01-r2v.mp4"
          assert ledger["source_digest"] == os.environ["REQUEST_FINGERPRINT"]
          assert ledger["max_api_calls"] == 1
          assert len(ledger["operations"]) == 1
          operation = next(iter(ledger["operations"].values()))
          assert operation["provider_task_id"]
          assert operation["status"] == "succeeded"
          assert report["valid"] is True
          assert report["status"] == "succeeded_awaiting_human_review"
          assert report["request"]["duration"] == 10
          assert report["request"]["resolution"] == "720P"
          assert report["request"]["ratio"] == "9:16"
          assert report["request"]["request_fingerprint"] == os.environ["REQUEST_FINGERPRINT"]
          assert video.is_file() and video.stat().st_size > 0
          digest = "sha256:" + hashlib.sha256(video.read_bytes()).hexdigest()
          assert operation["output_sha256"] == digest == report["output_sha256"]
          PY

      - name: Copy result evidence
        if: always()
        run: |
          rm -rf "$RESULT_ROOT"
          mkdir -p "$RESULT_ROOT"
          if test -n "${STATE_DIR:-}" && test -d "$STATE_DIR"; then
            cp -a "$STATE_DIR/." "$RESULT_ROOT/"
          fi

      - name: Upload the MP4, ledger, and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happyhorse-e01-g01-r2v-10s-hosted-result
          path: ${{ env.RESULT_ROOT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Report the hosted result to issue 37
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          BODY=$(printf 'E01-G01 hosted recovery result\n\n- run_id: `%s`\n- render: `%s`\n- verify: `%s`\n- URL: https://github.com/%s/actions/runs/%s' "$GITHUB_RUN_ID" "$RENDER_OUTCOME" "$VERIFY_OUTCOME" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Fail only after preserving all available evidence
        if: steps.render.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1
