name: Japanese Drama MiniMax H3 Core

on:
  pull_request:
    branches: [main]
    paths:
      - "src/apps/jp_drama/rendering/minimax_h3_*.py"
      - "src/apps/jp_drama/rendering/media_probe.py"
      - "src/apps/jp_drama/rendering/provider_execution_ledger.py"
      - "src/apps/jp_drama/rendering/provider_core.py"
      - "src/apps/jp_drama/workflows/prepare_generation.py"
      - "src/apps/jp_drama/workflows/render_minimax_h3_segment_canary.py"
      - "examples/jp_drama/minimax_h3_*.json"
      - "examples/jp_drama/generation/minimax_h3_profile.json"
      - "tests/test_jp_drama_minimax_h3_core.py"
      - "tests/test_jp_drama_minimax_h3_safety.py"
      - "docs/pr14-minimax-h3-provider-core.md"
      - ".github/workflows/jp-drama-minimax-h3-*.yml"
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "src/apps/jp_drama/rendering/minimax_h3_*.py"
      - "src/apps/jp_drama/rendering/media_probe.py"
      - "src/apps/jp_drama/rendering/provider_execution_ledger.py"
      - "src/apps/jp_drama/rendering/provider_core.py"
      - "src/apps/jp_drama/workflows/prepare_generation.py"
      - "src/apps/jp_drama/workflows/render_minimax_h3_segment_canary.py"
      - "examples/jp_drama/minimax_h3_*.json"
      - "examples/jp_drama/generation/minimax_h3_profile.json"
      - "tests/test_jp_drama_minimax_h3_core.py"
      - "tests/test_jp_drama_minimax_h3_safety.py"
      - "docs/pr14-minimax-h3-provider-core.md"
      - ".github/workflows/jp-drama-minimax-h3-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-drama-minimax-h3-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h3-core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"
      - name: Compile
        run: python -m compileall -q src/apps/jp_drama
      - name: Run zero-call H3 tests and regressions
        env:
          MINIMAX_API_KEY: ""
        run: |
          python -m pytest -q \
            tests/test_jp_drama_minimax_h3_core.py \
            tests/test_jp_drama_minimax_h3_safety.py \
            tests/test_jp_drama_multi_provider_core.py \
            tests/test_jp_drama_generation_segments.py
      - name: Build H3 plan from normal Japanese MD without credentials
        env:
          MINIMAX_API_KEY: ""
          DASHSCOPE_API_KEY: ""
          DASHSCOPE_BASE_URL: ""
          DASHSCOPE_WORKSPACE_ID: ""
        run: |
          rm -rf output/jp_drama/pr14
          python -m src.apps.jp_drama.workflows.ingest_script \
            --input examples/jp_drama/script_ingestion/sample_script.md \
            --output-dir output/jp_drama/pr14/ingestion \
            --llm-provider fixture
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input output/jp_drama/pr14/ingestion/episode_package.json \
            --output output/jp_drama/pr14/prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --strict
          set +e
          python -m src.apps.jp_drama.workflows.prepare_generation \
            --input output/jp_drama/pr14/prepared/prepared_episode.json \
            --output-dir output/jp_drama/pr14/generation \
            --profile examples/jp_drama/generation/minimax_h3_profile.json \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --minimax-h3-config examples/jp_drama/minimax_h3_live_provider.json
          EXIT_CODE=$?
          set -e
          test "$EXIT_CODE" -eq 0 -o "$EXIT_CODE" -eq 2
          printf '%s\n' "$EXIT_CODE" > output/jp_drama/pr14/generation-exit.txt
      - name: Build deterministic public-URL Canary asset manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          plan = json.loads(Path("output/jp_drama/pr14/generation/generation_plan_episode.json").read_text())
          segment = next(
              item for item in plan["segments"]
              if item["provider_route_id"].startswith("minimax/h3-")
          )
          Path("output/jp_drama/pr14/segment-id.txt").write_text(segment["segment_id"] + "\n")
          assets = []
          for asset_id in segment["reference_asset_ids"]:
              if not asset_id.startswith(("ref_char_", "ref_loc_", "ref_prop_", "ref_first_")):
                  continue
              assets.append({
                  "asset_id": asset_id,
                  "url": f"https://assets.example/{asset_id}.png",
                  "sha256": "sha256:" + hashlib.sha256(asset_id.encode()).hexdigest(),
                  "size_bytes": 1024,
                  "aspect_ratio": 0.5625,
                  "width_px": 720,
                  "height_px": 1280,
                  "media_format": "png"
              })
          Path("output/jp_drama/pr14/h3-assets.json").write_text(
              json.dumps({"segment_id": segment["segment_id"], "assets": assets}, indent=2) + "\n"
          )
          PY
      - name: Run H3 Canary preflight and approval with zero calls
        env:
          MINIMAX_API_KEY: ""
        run: |
          SEGMENT_ID="$(cat output/jp_drama/pr14/segment-id.txt)"
          COMMON_ARGS=(
            --prepared-input output/jp_drama/pr14/prepared/prepared_episode.json
            --generation-plan output/jp_drama/pr14/generation/generation_plan_episode.json
            --segment-id "$SEGMENT_ID"
            --assets output/jp_drama/pr14/h3-assets.json
            --config examples/jp_drama/minimax_h3_live_provider.json
            --output output/jp_drama/pr14/h3-canary.mp4
            --max-cost-usd 2.00
            --approval-manifest output/jp_drama/pr14/h3-approval.json
            --ledger-file output/jp_drama/pr14/h3-ledger.json
          )
          python -m src.apps.jp_drama.workflows.render_minimax_h3_segment_canary \
            "${COMMON_ARGS[@]}" --stage preflight \
            --report output/jp_drama/pr14/h3-preflight.json
          python -m src.apps.jp_drama.workflows.render_minimax_h3_segment_canary \
            "${COMMON_ARGS[@]}" --stage approve \
            --report output/jp_drama/pr14/h3-approve.json
      - name: Verify H3-first zero-call evidence and hard gates
        env:
          MINIMAX_API_KEY: ""
        run: |
          test -z "${MINIMAX_API_KEY:-}"
          test ! -e output/jp_drama/pr14/h3-canary.mp4
          test ! -e output/jp_drama/pr14/h3-ledger.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("output/jp_drama/pr14/generation/generation_plan_episode.json").read_text())
          preflight = json.loads(Path("output/jp_drama/pr14/h3-preflight.json").read_text())
          approved = json.loads(Path("output/jp_drama/pr14/h3-approve.json").read_text())
          h3_segments = [item for item in plan["segments"] if item["provider_route_id"].startswith("minimax/h3-")]
          assert h3_segments
          assert not [item for item in plan["readiness_report"]["errors"] if item["scope"] == "route"]
          for item in plan["cost_plan"]["items"]:
              if item["component"] == "video" and item["segment_id"] in {s["segment_id"] for s in h3_segments}:
                  assert item["currency"] == "USD"
                  assert item["confidence"] == "exact"
                  assert item["amount"] is not None
          assert preflight["valid"] is True
          assert preflight["external_api_calls"] == 0
          assert preflight["credentials_present"] is False
          assert preflight["within_requested_cost_limit"] is True
          assert approved["external_api_calls"] == 0
          assert approved["approved"] is True
          assert Path(approved["approval_manifest"]).is_file()
          PY
      - name: Ensure no credential or generated media is committed
        run: |
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' | grep -E 'jp_drama|minimax_h3' || true)"
          python - <<'PY'
          import re
          from pathlib import Path

          roots = [Path("src/apps/jp_drama"), Path("tests"), Path("examples/jp_drama"), Path(".github/workflows")]
          patterns = [
              re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              re.compile(r"MINIMAX_API_KEY\s*=\s*[^\"'$\s]"),
          ]
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file():
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for pattern in patterns:
                      assert not pattern.search(text), f"possible credential in {path}"
          PY
      - name: Upload H3 zero-call contract
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-minimax-h3-zero-call-contract
          path: |
            output/jp_drama/pr14/ingestion
            output/jp_drama/pr14/prepared
            output/jp_drama/pr14/generation
            output/jp_drama/pr14/generation-exit.txt
            output/jp_drama/pr14/h3-assets.json
            output/jp_drama/pr14/h3-preflight.json
            output/jp_drama/pr14/h3-approve.json
            output/jp_drama/pr14/h3-approval.json
          if-no-files-found: error
          retention-days: 7
