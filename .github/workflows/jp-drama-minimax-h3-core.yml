name: Japanese Drama MiniMax H3 Core

on:
  pull_request:
    branches: [main]
    paths:
      - "src/apps/jp_drama/rendering/minimax_h3_*.py"
      - "src/apps/jp_drama/rendering/provider_execution_ledger.py"
      - "src/apps/jp_drama/rendering/provider_core.py"
      - "src/apps/jp_drama/workflows/prepare_generation.py"
      - "examples/jp_drama/minimax_h3_live_provider.json"
      - "examples/jp_drama/generation/minimax_h3_profile.json"
      - "tests/test_jp_drama_minimax_h3_core.py"
      - "docs/pr14-minimax-h3-provider-core.md"
      - ".github/workflows/jp-drama-minimax-h3-core.yml"
  push:
    branches: [main, "feature/**", "fix/**"]
    paths:
      - "src/apps/jp_drama/rendering/minimax_h3_*.py"
      - "src/apps/jp_drama/rendering/provider_execution_ledger.py"
      - "src/apps/jp_drama/rendering/provider_core.py"
      - "src/apps/jp_drama/workflows/prepare_generation.py"
      - "examples/jp_drama/minimax_h3_live_provider.json"
      - "examples/jp_drama/generation/minimax_h3_profile.json"
      - "tests/test_jp_drama_minimax_h3_core.py"
      - "docs/pr14-minimax-h3-provider-core.md"
      - ".github/workflows/jp-drama-minimax-h3-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-drama-minimax-h3-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  h3-core-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"
      - name: Compile
        run: python -m compileall -q src/apps/jp_drama
      - name: Run zero-call H3 tests and regressions
        env:
          MINIMAX_API_KEY: ""
        run: |
          python -m pytest -q \
            tests/test_jp_drama_minimax_h3_core.py \
            tests/test_jp_drama_multi_provider_core.py \
            tests/test_jp_drama_generation_segments.py
      - name: Build H3 plan from normal Japanese MD without credentials
        env:
          MINIMAX_API_KEY: ""
          DASHSCOPE_API_KEY: ""
          DASHSCOPE_BASE_URL: ""
          DASHSCOPE_WORKSPACE_ID: ""
        run: |
          rm -rf output/jp_drama/pr14
          python -m src.apps.jp_drama.workflows.ingest_script \
            --input examples/jp_drama/script_ingestion/sample_script.md \
            --output-dir output/jp_drama/pr14/ingestion \
            --llm-provider fixture
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input output/jp_drama/pr14/ingestion/episode_package.json \
            --output output/jp_drama/pr14/prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --strict
          set +e
          python -m src.apps.jp_drama.workflows.prepare_generation \
            --input output/jp_drama/pr14/prepared/prepared_episode.json \
            --output-dir output/jp_drama/pr14/generation \
            --profile examples/jp_drama/generation/minimax_h3_profile.json \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --minimax-h3-config examples/jp_drama/minimax_h3_live_provider.json
          EXIT_CODE=$?
          set -e
          test "$EXIT_CODE" -eq 0 -o "$EXIT_CODE" -eq 2
          printf '%s\n' "$EXIT_CODE" > output/jp_drama/pr14/generation-exit.txt
      - name: Verify H3-first zero-call plan
        run: |
          test -z "${MINIMAX_API_KEY:-}"
          test -z "$(find output/jp_drama/pr14 -name '*.mp4' -print -quit)"
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(
              Path("output/jp_drama/pr14/generation/generation_plan_episode.json").read_text()
          )
          report = plan["readiness_report"]
          route_errors = [item for item in report["errors"] if item["scope"] == "route"]
          assert plan["provider_route_id"] == "minimax/h3-reference-av"
          assert report["external_api_calls"] == 0
          assert route_errors == []
          assert report["execution_route_ready"] == report["planning_ready"]
          assert plan["cost_plan"]["unknown_cost_components"] == []
          assert all(
              item["provider_route_id"] == "minimax/h3-reference-av"
              for item in plan["segments"]
          )
          assert all(
              4 <= item["requested_duration_seconds"] <= 15
              for item in plan["segments"]
          )
          PY
      - name: Verify no credentials or generated media were committed
        run: |
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' | grep -E 'jp_drama|minimax_h3' || true)"
          python - <<'PY'
          import re
          from pathlib import Path

          secret = re.compile(r"MINIMAX_API_KEY\s*=\s*[^\"'$\s]")
          for path in Path("src/apps/jp_drama/rendering").glob("minimax_h3_*.py"):
              assert not secret.search(path.read_text(encoding="utf-8")), path
          PY
