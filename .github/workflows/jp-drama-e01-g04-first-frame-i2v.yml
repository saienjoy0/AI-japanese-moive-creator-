name: Japanese Drama E01-G04 First Frame And I2V

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e01-g04-first-frame-i2v.yml"
      - "src/apps/jp_drama/workflows/render_happyhorse_e01_g04_first_frame_canary.py"
      - "tests/test_jp_drama_e01_g04_first_frame.py"
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: jp-drama-e01-g04-first-frame-i2v
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CONTROL_ISSUE: "37"
  SEALED_RUN_ID: "31077418519"
  SEALED_ARTIFACT: happyhorse-e01-g01-r2v-paid-approval
  PROVIDER_CONFIG: examples/jp_drama/dashscope_happyhorse_live_providers.json
  SEGMENT_ID: E01-G04
  CANDIDATE_ARTIFACT: happyhorse-e01-g04-first-frame-candidate
  RESULT_ARTIFACT: happyhorse-e01-g04-i2v-10s-result

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10"

      - name: Test the G4 first-frame boundary
        env:
          DASHSCOPE_API_KEY: ""
          MINIMAX_API_KEY: ""
        run: |
          python -m compileall -q \
            src/apps/jp_drama/workflows/render_happyhorse_e01_g04_first_frame_canary.py
          python -m pytest -q tests/test_jp_drama_e01_g04_first_frame.py

      - name: Verify zero-call workflow contract
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/jp-drama-e01-g04-first-frame-i2v.yml')
          text = path.read_text(encoding='utf-8')
          required = [
              'RUN_ONE_BUNCH_E01_G04_FIRST_FRAME_ONCE',
              'APPROVE_AND_RUN_ONE_BUNCH_E01_G04_HAPPYHORSE_ONCE',
              "github.event.comment.user.login == github.repository_owner",
              '--stage preflight',
              '--stage keyframe',
              '--stage approve',
              '--input-mode first_frame',
              'happyhorse-1.1-i2v',
              '--max-api-calls 1',
              'E01_G04_FIRST_FRAME_RESERVATION:',
              'E01_G04_VIDEO_RESERVATION:',
          ]
          for item in required:
              assert item in text, item
          assert '--continuity-frame ' not in text
          assert '--continuity-frame-metadata ' not in text
          assert 'cancel-in-progress: false' in text
          PY

  first-frame-candidate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_ONE_BUNCH_E01_G04_FIRST_FRAME_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require first workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require Beijing API key
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: test -n "$DASHSCOPE_API_KEY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt

      - name: Download sealed episode inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEALED_ARTIFACT }}
          path: input/sealed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEALED_RUN_ID }}

      - name: Locate immutable inputs
        run: |
          set -euo pipefail
          PREPARED="$(find input/sealed -type f -path '*/input/prepared_episode.json' -print -quit)"
          PLAN="$(find input/sealed -type f -path '*/input/generation_plan_episode.json' -print -quit)"
          BUNDLE="$(find input/sealed -type f -path '*/input/asset_bundle_masters_approved.json' -print -quit)"
          for value in "$PREPARED" "$PLAN" "$BUNDLE"; do
            test -n "$value" && test -s "$value"
          done
          STATE_DIR="$RUNNER_TEMP/e01-g04-first-frame-state"
          mkdir -p "$STATE_DIR/input"
          cp "$PREPARED" "$STATE_DIR/input/prepared_episode.json"
          cp "$PLAN" "$STATE_DIR/input/generation_plan_episode.json"
          cp "$BUNDLE" "$STATE_DIR/input/asset_bundle_masters_approved.json"
          {
            echo "PREPARED=$STATE_DIR/input/prepared_episode.json"
            echo "PLAN=$STATE_DIR/input/generation_plan_episode.json"
            echo "BUNDLE=$STATE_DIR/input/asset_bundle_masters_approved.json"
            echo "STATE_DIR=$STATE_DIR"
          } >> "$GITHUB_ENV"

      - name: Prepare exact G4 master-reference manifest
        run: |
          python -m src.apps.jp_drama.workflows.prepare_wan_master_keyframe \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --asset-bundle "$BUNDLE" \
            --segment-id "$SEGMENT_ID" \
            --manifest-output "$STATE_DIR/E01-G04.wan-master-references.json" \
            --report "$STATE_DIR/master-preflight.json" \
            --print-report

      - name: Run zero-call first-frame preflight
        run: |
          python -m src.apps.jp_drama.workflows.render_wan_master_keyframe \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --asset-bundle "$BUNDLE" \
            --master-reference-manifest "$STATE_DIR/E01-G04.wan-master-references.json" \
            --providers "$PROVIDER_CONFIG" \
            --segment-id "$SEGMENT_ID" \
            --stage preflight \
            --keyframe-output "$STATE_DIR/E01-G04-first-frame.png" \
            --ledger-file "$STATE_DIR/keyframe-ledger.json" \
            --max-api-calls 1 \
            --max-cost-cny 1 \
            --report "$STATE_DIR/keyframe-preflight.json" \
            --print-report

      - name: Verify and export first-frame approval digest
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path

          state = Path(os.environ['STATE_DIR'])
          report = json.loads((state / 'keyframe-preflight.json').read_text(encoding='utf-8'))
          master = json.loads((state / 'master-preflight.json').read_text(encoding='utf-8'))
          assert report['valid'] is True
          assert report['stage'] == 'preflight'
          assert report['segment_id'] == 'E01-G04'
          assert report['model'] == 'wan2.7-image-pro'
          assert report['external_api_calls'] == 0
          assert report['max_api_calls'] == 1
          assert master['valid'] is True
          assert master['segment_id'] == 'E01-G04'
          assert master['reference_count'] <= 9
          print('KEYFRAME_APPROVAL_DIGEST=' + report['approval_digest'])
          PY

      - name: Reserve this exact first-frame request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREFIX="E01_G04_FIRST_FRAME_RESERVATION:"
          COMMENTS="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100" | jq -s 'add')"
          EXISTING="$(jq -r --arg p "$PREFIX" --arg d "$KEYFRAME_APPROVAL_DIGEST" '[.[] | select((.body | startswith($p)) and (.body | contains($d)))] | length' <<<"$COMMENTS")"
          test "$EXISTING" = "0"
          BODY="$PREFIX run_id=$GITHUB_RUN_ID approval_digest=$KEYFRAME_APPROVAL_DIGEST attempt=1"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Generate one G4 first-frame candidate
        id: keyframe
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: https://ws-fflq327rfjpr3ob2.cn-beijing.maas.aliyuncs.com
          DASHSCOPE_UPLOAD_BASE_URL: https://dashscope.aliyuncs.com
        run: |
          python -m src.apps.jp_drama.workflows.render_wan_master_keyframe \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --asset-bundle "$BUNDLE" \
            --master-reference-manifest "$STATE_DIR/E01-G04.wan-master-references.json" \
            --providers "$PROVIDER_CONFIG" \
            --segment-id "$SEGMENT_ID" \
            --stage keyframe \
            --keyframe-output "$STATE_DIR/E01-G04-first-frame.png" \
            --ledger-file "$STATE_DIR/keyframe-ledger.json" \
            --execute-paid \
            --approval-digest "$KEYFRAME_APPROVAL_DIGEST" \
            --max-api-calls 1 \
            --max-cost-cny 1 \
            --report "$STATE_DIR/keyframe-render.json" \
            --print-report

      - name: Verify candidate evidence
        if: steps.keyframe.outcome == 'success'
        run: |
          set -euo pipefail
          test -s "$STATE_DIR/E01-G04-first-frame.png"
          test -s "$STATE_DIR/keyframe-ledger.json"
          test -s "$STATE_DIR/keyframe-render.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = Path(os.environ['STATE_DIR'])
          ledger = json.loads((state / 'keyframe-ledger.json').read_text(encoding='utf-8'))
          operations = list((ledger.get('operations') or {}).values())
          assert len(operations) == 1
          assert operations[0]['status'] == 'succeeded'
          assert (state / 'E01-G04-first-frame.png').stat().st_size > 0
          PY

      - name: Upload first-frame candidate
        if: steps.keyframe.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: ${{ env.STATE_DIR }}
          retention-days: 30
          if-no-files-found: error

      - name: Report candidate for human review
        if: steps.keyframe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="$(sha256sum "$STATE_DIR/E01-G04-first-frame.png" | awk '{print $1}')"
          BODY="E01_G04_FIRST_FRAME_READY: run_id=$GITHUB_RUN_ID artifact=$CANDIDATE_ARTIFACT sha256=$SHA review_required=true"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Fail when candidate generation failed
        if: steps.keyframe.outcome != 'success'
        run: exit 1

  approve-and-render:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'APPROVE_AND_RUN_ONE_BUNCH_E01_G04_HAPPYHORSE_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Require first workflow attempt
        run: test "$GITHUB_RUN_ATTEMPT" = "1"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt

      - name: Resolve the latest reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREFIX="E01_G04_FIRST_FRAME_READY:"
          COMMENTS="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100" | jq -s 'add')"
          MARKER="$(jq -r --arg p "$PREFIX" '[.[] | select(.body | startswith($p))] | last | .body // ""' <<<"$COMMENTS")"
          test -n "$MARKER"
          RUN_ID="$(sed -n 's/.*run_id=\([0-9][0-9]*\).*/\1/p' <<<"$MARKER")"
          ARTIFACT="$(sed -n 's/.*artifact=\([^ ]*\).*/\1/p' <<<"$MARKER")"
          test -n "$RUN_ID" && test -n "$ARTIFACT"
          {
            echo "CANDIDATE_RUN_ID=$RUN_ID"
            echo "CANDIDATE_ARTIFACT_NAME=$ARTIFACT"
          } >> "$GITHUB_ENV"

      - name: Download the exact candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/candidate
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$CANDIDATE_ARTIFACT_NAME" \
            --dir input/candidate

      - name: Locate candidate evidence
        run: |
          set -euo pipefail
          PREPARED="$(find input/candidate -type f -name prepared_episode.json -print -quit)"
          PLAN="$(find input/candidate -type f -name generation_plan_episode.json -print -quit)"
          BUNDLE="$(find input/candidate -type f -name asset_bundle_masters_approved.json -print -quit)"
          MANIFEST="$(find input/candidate -type f -name 'E01-G04.wan-master-references.json' -print -quit)"
          KEYFRAME="$(find input/candidate -type f -name 'E01-G04-first-frame.png' -print -quit)"
          KEYFRAME_LEDGER="$(find input/candidate -type f -name keyframe-ledger.json -print -quit)"
          for value in "$PREPARED" "$PLAN" "$BUNDLE" "$MANIFEST" "$KEYFRAME" "$KEYFRAME_LEDGER"; do
            test -n "$value" && test -s "$value"
          done
          STATE_DIR="$RUNNER_TEMP/e01-g04-i2v-state"
          mkdir -p "$STATE_DIR"
          {
            echo "PREPARED=$PREPARED"
            echo "PLAN=$PLAN"
            echo "BUNDLE=$BUNDLE"
            echo "MANIFEST=$MANIFEST"
            echo "KEYFRAME=$KEYFRAME"
            echo "KEYFRAME_LEDGER=$KEYFRAME_LEDGER"
            echo "STATE_DIR=$STATE_DIR"
          } >> "$GITHUB_ENV"

      - name: Approve the human-reviewed first frame
        run: |
          python -m src.apps.jp_drama.workflows.render_wan_master_keyframe \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --asset-bundle "$BUNDLE" \
            --master-reference-manifest "$MANIFEST" \
            --providers "$PROVIDER_CONFIG" \
            --segment-id "$SEGMENT_ID" \
            --stage approve \
            --keyframe-output "$KEYFRAME" \
            --approval-manifest "$STATE_DIR/E01-G04-first-frame.approval.json" \
            --ledger-file "$KEYFRAME_LEDGER" \
            --max-api-calls 1 \
            --max-cost-cny 1 \
            --report "$STATE_DIR/keyframe-approval-report.json" \
            --print-report

      - name: Register the approved first frame in a temporary bundle
        run: |
          python -m src.apps.jp_drama.workflows.register_wan_master_keyframe \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --asset-bundle "$BUNDLE" \
            --master-reference-manifest "$MANIFEST" \
            --approval-manifest "$STATE_DIR/E01-G04-first-frame.approval.json" \
            --segment-id "$SEGMENT_ID" \
            --approved-by "$GITHUB_REPOSITORY_OWNER" \
            --output-bundle "$STATE_DIR/asset_bundle_with_E01-G04_first_frame.json" \
            --report "$STATE_DIR/first-frame-registration.json" \
            --print-report

      - name: Run zero-call G4 I2V preflight
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_e01_g04_first_frame_canary \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --segment-id "$SEGMENT_ID" \
            --asset-bundle "$STATE_DIR/asset_bundle_with_E01-G04_first_frame.json" \
            --providers "$PROVIDER_CONFIG" \
            --output "$STATE_DIR/E01-G04-i2v.mp4" \
            --input-mode first_frame \
            --stage preflight \
            --continuity-dir "$STATE_DIR/continuity" \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --report "$STATE_DIR/video-preflight.json" \
            --print-report

      - name: Verify exact I2V request and export fingerprint
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          from pathlib import Path

          state = Path(os.environ['STATE_DIR'])
          report = json.loads((state / 'video-preflight.json').read_text(encoding='utf-8'))
          prompt = report['request']['prompt']
          assert report['valid'] is True
          assert report['status'] == 'ready_for_single_paid_submission'
          assert report['segment_id'] == 'E01-G04'
          assert report['input_mode'] == 'first_frame'
          assert report['model'] == 'happyhorse-1.1-i2v'
          assert report['request']['duration'] == 10
          assert report['request']['ratio'] is None
          assert report['provider_submissions_this_run'] == 0
          assert report['external_api_calls'] == 0
          assert report['first_frame']['asset_id'] == 'ref_first_E01-G04'
          assert 'continuity_frame' not in report
          assert 'hard scene cut' in prompt
          assert 'approved E01-G04 first frame' in prompt
          assert 'Only C02 moves the mouth' in prompt
          assert 'Only C01 moves the mouth' in prompt
          assert 'Do not begin from' in prompt
          print('VIDEO_FINGERPRINT=' + report['request']['request_fingerprint'])
          PY

      - name: Reserve this exact G4 video request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREFIX="E01_G04_VIDEO_RESERVATION:"
          COMMENTS="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments?per_page=100" | jq -s 'add')"
          EXISTING="$(jq -r --arg p "$PREFIX" --arg d "$VIDEO_FINGERPRINT" '[.[] | select((.body | startswith($p)) and (.body | contains($d)))] | length' <<<"$COMMENTS")"
          test "$EXISTING" = "0"
          BODY="$PREFIX run_id=$GITHUB_RUN_ID fingerprint=$VIDEO_FINGERPRINT candidate_run_id=$CANDIDATE_RUN_ID attempt=1"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Render one approved G4 I2V task
        id: render
        continue-on-error: true
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: https://ws-fflq327rfjpr3ob2.cn-beijing.maas.aliyuncs.com
          DASHSCOPE_UPLOAD_BASE_URL: https://dashscope.aliyuncs.com
        run: |
          python -m src.apps.jp_drama.workflows.render_happyhorse_e01_g04_first_frame_canary \
            --prepared-input "$PREPARED" \
            --generation-plan "$PLAN" \
            --segment-id "$SEGMENT_ID" \
            --asset-bundle "$STATE_DIR/asset_bundle_with_E01-G04_first_frame.json" \
            --providers "$PROVIDER_CONFIG" \
            --output "$STATE_DIR/E01-G04-i2v.mp4" \
            --input-mode first_frame \
            --stage render \
            --continuity-dir "$STATE_DIR/continuity" \
            --resolution 720P \
            --max-api-calls 1 \
            --max-cost-cny 6 \
            --cost-reserve-cny 6 \
            --ledger-file "$STATE_DIR/video-ledger.json" \
            --report "$STATE_DIR/video-render.json" \
            --print-report

      - name: Verify G4 video and G5 handoff
        if: steps.render.outcome == 'success'
        run: |
          set -euo pipefail
          test -s "$STATE_DIR/E01-G04-i2v.mp4"
          test -s "$STATE_DIR/video-render.json"
          test -s "$STATE_DIR/video-ledger.json"
          test -s "$STATE_DIR/continuity/E01-G04/E01-G04_end.png"
          test -s "$STATE_DIR/continuity/E01-G04/E01-G04_end.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = Path(os.environ['STATE_DIR'])
          report = json.loads((state / 'video-render.json').read_text(encoding='utf-8'))
          end = json.loads((state / 'continuity/E01-G04/E01-G04_end.json').read_text(encoding='utf-8'))
          assert report['valid'] is True
          assert report['status'] == 'succeeded_awaiting_human_review'
          assert report['model'] == 'happyhorse-1.1-i2v'
          assert report['input_mode'] == 'first_frame'
          assert report['first_frame']['asset_id'] == 'ref_first_E01-G04'
          assert 'continuity_frame' not in report
          assert end['source_segment_id'] == 'E01-G04'
          assert end['derived_for_next_segment_id'] == 'E01-G05'
          PY

      - name: Upload G4 result
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: ${{ env.STATE_DIR }}
          retention-days: 30
          if-no-files-found: error

      - name: Report G4 result
        if: steps.render.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="E01_G04_I2V_READY: run_id=$GITHUB_RUN_ID artifact=$RESULT_ARTIFACT candidate_run_id=$CANDIDATE_RUN_ID review_required=true"
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/$CONTROL_ISSUE/comments" \
            -f "body=$BODY"

      - name: Fail when G4 render failed
        if: steps.render.outcome != 'success'
        run: exit 1
