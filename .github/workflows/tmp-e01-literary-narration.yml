name: Temporary E01 Literary Narration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-e01-literary-narration.yml"

permissions:
  contents: read

jobs:
  synthesize-once:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check dashscope requests

      - name: Generate literary narration exactly once
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          import dashscope

          api_key = os.environ.get("DASHSCOPE_API_KEY")
          if not api_key:
              raise SystemExit("DASHSCOPE_API_KEY is missing; stopping before paid call")

          text = "それから、僕の心は落ち着きませんでした。"
          instructions = (
              "日本文学のオーディオブックの地の文として読む。"
              "成人男性が少年時代を静かに回想する声。"
              "低めで温かく、落ち着いた声質。感情は抑制し、少しだけ罪悪感と不安の余韻を含める。"
              "話速は標準より少しゆっくり。自然な間を置き、語尾を煽らない。"
              "ニュース読み、広告ナレーション、アニメ調、ASMR調にはしない。"
          )

          # Exactly one paid synthesis call. Do not retry on failure.
          response = dashscope.MultiModalConversation.call(
              api_key=api_key,
              model="qwen3-tts-instruct-flash",
              text=text,
              voice="Ethan",
              language_type="Japanese",
              instructions=instructions,
              optimize_instructions=True,
              stream=False,
          )
          if not response or not getattr(response, "output", None):
              raise RuntimeError(f"Qwen3 TTS empty response: {response}")
          audio = response.output.audio
          if audio is None or not getattr(audio, "url", None):
              raise RuntimeError(f"Qwen3 TTS no audio URL: {response}")

          r = requests.get(audio.url, timeout=30)
          r.raise_for_status()
          with open("E01_literary_narration_audio", "wb") as f:
              f.write(r.content)

          meta = {
              "text": text,
              "model": "qwen3-tts-instruct-flash",
              "voice": "Ethan",
              "language_type": "Japanese",
              "instructions": instructions,
              "request_id": getattr(response, "request_id", "") or "",
              "content_type": r.headers.get("content-type", ""),
              "bytes": len(r.content),
          }
          with open("E01_literary_narration_meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
          PY
          test -s E01_literary_narration_audio

      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: e01-literary-narration
          path: |
            E01_literary_narration_audio
            E01_literary_narration_meta.json
          retention-days: 1
