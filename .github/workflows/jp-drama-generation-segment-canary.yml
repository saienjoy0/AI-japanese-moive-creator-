name: Japanese Drama Generation Segment Canary

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/apps/jp_drama/rendering/segment_canary.py"
      - "src/apps/jp_drama/workflows/render_generation_segment_canary.py"
      - "tests/test_jp_drama_generation_segment_canary.py"
      - "docs/pr12-generation-segment-canary.md"
      - ".github/workflows/jp-drama-generation-segment-canary.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/rendering/segment_canary.py"
      - "src/apps/jp_drama/workflows/render_generation_segment_canary.py"
      - "tests/test_jp_drama_generation_segment_canary.py"
      - "docs/pr12-generation-segment-canary.md"
      - ".github/workflows/jp-drama-generation-segment-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jp-drama-generation-segment-canary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  segment-canary-contract:
    name: Validate segment-to-canary bridge with zero paid calls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"

      - name: Compile Japanese drama packages
        run: python -m compileall -q src/apps/jp_drama

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_jp_drama_generation_segment_canary.py \
            tests/test_jp_drama_generation_segments.py \
            tests/test_jp_drama_wan27_canary.py

      - name: Build a real-script generation plan
        run: |
          rm -rf output/jp_drama/pr12
          mkdir -p output/jp_drama/pr12
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input examples/jp_drama/minimal_episode_package.json \
            --output output/jp_drama/pr12/prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --strict
          python -m src.apps.jp_drama.workflows.prepare_generation \
            --input output/jp_drama/pr12/prepared/prepared_episode.json \
            --output-dir output/jp_drama/pr12/generation \
            --profile examples/jp_drama/generation/wan27_profile.json \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json

      - name: Create zero-call Canary provider config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("examples/jp_drama/dashscope_live_providers.json")
          payload = json.loads(source.read_text(encoding="utf-8"))
          payload["dashscope"]["provider_clip_seconds"] = 15
          Path("output/jp_drama/pr12/providers-preflight.json").write_text(
              json.dumps(payload, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run segment Canary preflight without credentials
        env:
          DASHSCOPE_API_KEY: ""
          DASHSCOPE_BASE_URL: ""
          DASHSCOPE_WORKSPACE_ID: ""
        run: |
          SEGMENT_ID="$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("output/jp_drama/pr12/generation/generation_plan_episode.json").read_text())
          print(payload["segments"][0]["segment_id"])
          PY
          )"
          python -m src.apps.jp_drama.workflows.render_generation_segment_canary \
            --prepared-input output/jp_drama/pr12/prepared/prepared_episode.json \
            --generation-plan output/jp_drama/pr12/generation/generation_plan_episode.json \
            --segment-id "$SEGMENT_ID" \
            --output output/jp_drama/pr12/segment-canary.mp4 \
            --providers output/jp_drama/pr12/providers-preflight.json \
            --stage preflight \
            --allow-experimental-multi-shot \
            --report output/jp_drama/pr12/segment-canary-report.json \
            --print-report

      - name: Verify zero-call evidence and hard gates
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test ! -e output/jp_drama/pr12/segment-canary.mp4
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("output/jp_drama/pr12/segment-canary-report.json").read_text())
          assert report["canary_protocol"] == "generation-segment-canary-v1"
          assert report["stage"] == "preflight"
          assert report["provider_route_id"] == "wan/i2v"
          assert report["external_api_calls"] == 0
          assert report["credentials_present"] is False
          assert Path(report["materialized_prepared_episode"]).is_file()
          PY

      - name: Ensure no credential or generated media is committed
        run: |
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' '*.png' '*.jpg' | grep -E 'jp_drama|generation_segment' || true)"
          ! git grep -nE '(sk-[A-Za-z0-9_-]{12,}|DASHSCOPE_API_KEY[[:space:]]*=[[:space:]]*[^"$[:space:]])' -- . ':!*.md'

      - name: Upload segment Canary contract
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-generation-segment-canary-contract
          path: |
            output/jp_drama/pr12/generation
            output/jp_drama/pr12/segment-canary-report.json
            output/jp_drama/pr12/.*_prepared.json
          if-no-files-found: error
          retention-days: 7
