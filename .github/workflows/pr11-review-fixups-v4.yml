name: PR11 Review Fixups V4

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr11-review-fixups-v4.yml"

permissions:
  contents: write

jobs:
  apply-fixups:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Apply direct reviewed corrections
        run: |
          echo '' | base64 -d > /tmp/pr11_fix.py
          python /tmp/pr11_fix.py

      - name: Validate corrected implementation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"
          python -m compileall -q src/apps/jp_drama
          python -m pytest -q tests/test_jp_drama_generation_segments.py

      - name: Publish fixups and remove temporary workflows
        run: |
          rm -f .github/workflows/pr11-review-fixups.yml
          rm -f .github/workflows/pr11-review-fixups-push.yml
          rm -f .github/workflows/pr11-review-fixups-v2.yml
          rm -f .github/workflows/pr11-review-fixups-v3.yml
          rm -f .github/workflows/pr11-review-fixups-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden PR11 costs and atomic outputs"
          git push origin HEAD:feature/jp-drama-adaptive-generation-segments
