name: PR12 First Frame Requirement Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr12-first-frame-fix.yml"

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Make first-frame assets capability-aware
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/apps/jp_drama/generation/compiler.py")
          text = path.read_text(encoding="utf-8")

          call_needle = "        frame.prop_seed_ids,\n    )\n    source_intent"
          call_replacement = (
              "        frame.prop_seed_ids,\n"
              "        requires_first_frame=(\n"
              "            capabilities.image_to_video and not capabilities.text_to_video\n"
              "        )\n"
              "        or profile.route_id == \"wan/i2v\",\n"
              "    )\n"
              "    source_intent"
          )
          assert call_needle in text
          text = text.replace(call_needle, call_replacement, 1)

          signature_needle = "    props: list[str],\n) -> list[str]:\n    values = ["
          signature_replacement = (
              "    props: list[str],\n"
              "    *,\n"
              "    requires_first_frame: bool,\n"
              ") -> list[str]:\n"
              "    values = ["
          )
          assert signature_needle in text
          text = text.replace(signature_needle, signature_replacement, 1)

          append_needle = (
              "    values.append(f\"ref_first_{_short_hash(segment_id, 'first_frame')}\")\n"
              "    return values\n"
          )
          append_replacement = (
              "    if requires_first_frame:\n"
              "        values.append(f\"ref_first_{_short_hash(segment_id, 'first_frame')}\")\n"
              "    return values\n"
          )
          assert append_needle in text
          text = text.replace(append_needle, append_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"
          python -m compileall -q src/apps/jp_drama
          python -m pytest -q tests/test_jp_drama_generation_segments.py

      - name: Publish correction and remove workflow
        run: |
          rm .github/workflows/pr12-first-frame-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make first-frame requirements capability-aware"
          git push origin HEAD:feature/jp-drama-adaptive-generation-segments
