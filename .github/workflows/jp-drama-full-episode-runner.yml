name: Japanese Drama Full Episode Runner

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/full_episode/**"
      - "src/apps/jp_drama/workflows/run_full_episode.py"
      - "tests/test_jp_drama_full_episode_runner.py"
      - "docs/pr19-full-episode-runner.md"
      - ".github/workflows/jp-drama-full-episode-runner.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/full_episode/**"
      - "src/apps/jp_drama/workflows/run_full_episode.py"
      - "tests/test_jp_drama_full_episode_runner.py"
      - "docs/pr19-full-episode-runner.md"
      - ".github/workflows/jp-drama-full-episode-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-episode-runner:
    name: Validate 15-segment resume trim concat and final MP4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install FFmpeg and focused dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<9"
          ffmpeg -version
          ffprobe -version

      - name: Compile Japanese drama packages
        run: python -m compileall -q src/apps/jp_drama

      - name: Run full episode regressions
        run: python -m pytest -q tests/test_jp_drama_full_episode_runner.py

      - name: Build route-ready 15-segment plan
        run: |
          rm -rf output/jp_drama/pr19
          mkdir -p output/jp_drama/pr19
          python -m src.apps.jp_drama.workflows.ingest_script \
            --input examples/jp_drama/script_ingestion/sample_script.md \
            --output-dir output/jp_drama/pr19/ingestion \
            --llm-provider fixture
          python -m src.apps.jp_drama.workflows.prepare_episode \
            --input output/jp_drama/pr19/ingestion/episode_package.json \
            --output output/jp_drama/pr19/prepared \
            --catalog examples/jp_drama/model_capabilities.json \
            --strict
          python -m src.apps.jp_drama.workflows.prepare_generation \
            --input output/jp_drama/pr19/prepared/prepared_episode.json \
            --output-dir output/jp_drama/pr19/generation \
            --profile examples/jp_drama/generation/wan27_profile.json \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --require-route-ready

      - name: Create deterministic provider-output fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from src.apps.jp_drama.generation.models import GenerationPlanEpisode
          from src.apps.jp_drama.rendering.ffmpeg import ffmpeg

          root = Path("output/jp_drama/pr19")
          plan = GenerationPlanEpisode.model_validate_json(
              (root / "generation/generation_plan_episode.json").read_text()
          )
          outputs = {}
          for index, segment in enumerate(plan.segments, start=1):
              destination = root / "provider_outputs" / (
                  f"{segment.order:03d}_{segment.segment_id}.mp4"
              )
              destination.parent.mkdir(parents=True, exist_ok=True)
              duration = segment.requested_duration_seconds
              fps = segment.timeline_fps
              if index % 2 == 0:
                  ffmpeg(
                      "-f", "lavfi", "-i",
                      f"testsrc2=size=90x160:rate={fps}:duration={duration}",
                      "-f", "lavfi", "-i",
                      f"sine=frequency={300 + index * 17}:sample_rate=48000:duration={duration}",
                      "-map", "0:v:0", "-map", "1:a:0",
                      "-frames:v", str(duration * fps),
                      "-c:v", "libx264", "-preset", "ultrafast", "-crf", "24",
                      "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "96k", "-ar", "48000", "-ac", "2",
                      "-shortest", str(destination),
                  )
              else:
                  ffmpeg(
                      "-f", "lavfi", "-i",
                      f"testsrc2=size=90x160:rate={fps}:duration={duration}",
                      "-frames:v", str(duration * fps),
                      "-c:v", "libx264", "-preset", "ultrafast", "-crf", "24",
                      "-pix_fmt", "yuv420p", "-an", str(destination),
                  )
              outputs[segment.segment_id] = str(destination)
          (root / "segment_outputs.json").write_text(
              json.dumps({"segments": outputs}, sort_keys=True, indent=2) + "\n"
          )
          PY

      - name: Compose exact full episode with zero provider calls
        run: |
          python -m src.apps.jp_drama.workflows.run_full_episode \
            --prepared-input output/jp_drama/pr19/prepared/prepared_episode.json \
            --generation-plan output/jp_drama/pr19/generation/generation_plan_episode.json \
            --stage compose \
            --segment-outputs output/jp_drama/pr19/segment_outputs.json \
            --output output/jp_drama/pr19/full_episode.mp4 \
            --work-dir output/jp_drama/pr19/full_episode_work \
            --target-width 90 \
            --target-height 160 \
            --report output/jp_drama/pr19/full_episode_workflow_report.json \
            --print-report

      - name: Verify exact final evidence and resume state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("output/jp_drama/pr19")
          plan = json.loads((root / "generation/generation_plan_episode.json").read_text())
          workflow = json.loads((root / "full_episode_workflow_report.json").read_text())
          state = json.loads(
              (root / "full_episode_work/full_episode_state.json").read_text()
          )
          report = workflow["validation_report"]
          assert workflow["valid"] is True
          assert workflow["external_api_calls"] == 0
          assert len(report["segment_validations"]) == 15
          assert report["segment_order"] == [
              item["segment_id"] for item in plan["segments"]
          ]
          assert report["expected_frame_count"] == plan["target_frame_count"]
          assert report["actual_frame_count"] == plan["target_frame_count"]
          assert report["width"] == 90
          assert report["height"] == 160
          assert report["video_streams"] == 1
          assert report["audio_streams"] == 1
          assert abs(report["duration_seconds"] - float(plan["target_duration_seconds"])) < 0.1
          assert state["status"] == "succeeded"
          assert all(item["status"] == "validated" for item in state["segments"].values())
          assert (root / "full_episode.mp4").is_file()
          PY

      - name: Ensure no provider calls secrets or generated media are committed
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${DASHSCOPE_BASE_URL:-}"
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' '*.png' '*.jpg' | grep -E 'jp_drama|full_episode' || true)"

      - name: Upload full episode runner contract
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-full-episode-runner-contract
          path: |
            output/jp_drama/pr19/full_episode.mp4
            output/jp_drama/pr19/full_episode_workflow_report.json
            output/jp_drama/pr19/full_episode_work/full_episode_state.json
            output/jp_drama/pr19/full_episode_work/full_episode_validation.json
            output/jp_drama/pr19/generation/generation_plan_episode.json
          if-no-files-found: error
          retention-days: 7
