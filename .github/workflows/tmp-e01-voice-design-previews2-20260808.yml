name: Temporary E01 Voice Design Previews2 20260808

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/tmp-e01-voice-design-previews2-20260808.yml"

permissions:
  contents: read

jobs:
  design-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    steps:
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Create four Japanese voice-design previews
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, requests
          api_key = os.environ.get("DASHSCOPE_API_KEY")
          if not api_key:
              raise SystemExit("DASHSCOPE_API_KEY missing; stopping before paid calls")
          url = "https://dashscope.aliyuncs.com/api/v1/services/audio/tts/customization"
          target_model = "qwen3-tts-vd-2026-01-26"
          voices = [
              {"id":"narrator","preferred_name":"e01narrator","voice_prompt":"A native-sounding Japanese male voice in his late 30s to early 40s. Warm, calm, literary, intimate, and natural. He is recalling his own childhood with restrained emotion. Medium-low pitch, clear articulation, gentle pacing, no announcer tone, no advertisement tone, no anime acting, no ASMR breathiness.","preview_text":"僕は小さい時、絵を描くことが好きでした。"},
              {"id":"c01_boy","preferred_name":"e01boy","voice_prompt":"A native-sounding Japanese boy around ten years old. Shy, sensitive, quiet, sincere, and emotionally subtle. Natural child speech, not cute or exaggerated, not anime-style. Slightly hesitant delivery with clear Japanese pronunciation.","preview_text":"海は、こんな色じゃない。"},
              {"id":"c02_older_boy","preferred_name":"e01olderboy","voice_prompt":"A native-sounding Japanese boy around twelve years old, slightly older and more confident than another child. Calm, direct, serious, and believable. He can confront someone firmly without shouting. Natural school-age speech, no anime acting, clear Japanese pronunciation.","preview_text":"藍と洋紅がない。休み時間に教室にいたのは、君だけだ。"},
              {"id":"c03_teacher","preferred_name":"e01teacher","voice_prompt":"A native-sounding Japanese young adult female teacher. Gentle, composed, intelligent, kind, and reassuring. Soft but not whispery, refined but not formal customer-service speech. Natural Japanese pronunciation, no anime acting, no exaggerated sweetness.","preview_text":"お入り。"},
          ]
          out = pathlib.Path("e01_voice_design_previews")
          out.mkdir(exist_ok=True)
          manifest = []
          headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
          for v in voices:
              payload = {"model":"qwen-voice-design","input":{"action":"create","target_model":target_model,"preferred_name":v["preferred_name"],"voice_prompt":v["voice_prompt"],"preview_text":v["preview_text"],"language":"ja"},"parameters":{"sample_rate":24000,"response_format":"wav"}}
              r = requests.post(url, json=payload, headers=headers, timeout=90)
              if r.status_code != 200:
                  raise RuntimeError(f"voice design failed for {v['id']}: {r.status_code} {r.text}")
              data = r.json(); output = data.get("output") or {}
              voice_id = output.get("voice"); preview = (output.get("preview_audio") or {}).get("data")
              if not voice_id or not preview:
                  raise RuntimeError(f"missing voice/preview for {v['id']}: {data}")
              wav = base64.b64decode(preview)
              path = out / f"{v['id']}.wav"; path.write_bytes(wav)
              manifest.append({"id":v["id"],"voice":voice_id,"target_model":target_model,"preview_text":v["preview_text"],"voice_prompt":v["voice_prompt"],"file":str(path),"bytes":len(wav),"request_id":data.get("request_id","")})
          (out / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          test -s e01_voice_design_previews/manifest.json

      - name: Upload previews
        uses: actions/upload-artifact@v4
        with:
          name: e01-voice-design-previews2-20260808
          path: e01_voice_design_previews
          retention-days: 1
