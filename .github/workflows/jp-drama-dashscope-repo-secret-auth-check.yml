name: Japanese Drama DashScope Repo Secret Auth Check

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-dashscope-repo-secret-auth-check.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: jp-drama-dashscope-repo-secret-auth-check
  cancel-in-progress: false

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify zero-task authentication-check contract
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              ".github/workflows/jp-drama-dashscope-repo-secret-auth-check.yml"
          ).read_text(encoding="utf-8")
          required = [
              "CHECK_DASHSCOPE_REPO_SECRET_SINGAPORE",
              "github.event.issue.number == 37",
              "github.event.comment.user.login == github.repository_owner",
              "https://dashscope-intl.aliyuncs.com/api/v1/uploads",
              "action=getPolicy",
              "model=happyhorse-1.1-r2v",
              "secrets.DASHSCOPE_API_KEY",
              "issues: write",
          ]
          for item in required:
              assert item in text, item
          assert "video-" + "synthesis" not in text
          assert "workflow_" + "dispatch" not in text
          PY

  check-repository-secret:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'CHECK_DASHSCOPE_REPO_SECRET_SINGAPORE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check repository-level DashScope key without creating a video task
        id: auth
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DASHSCOPE_API_KEY"
          RESPONSE_FILE="$RUNNER_TEMP/dashscope-auth-response.json"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out '%{http_code}' \
            --get 'https://dashscope-intl.aliyuncs.com/api/v1/uploads' \
            --data-urlencode 'action=getPolicy' \
            --data-urlencode 'model=happyhorse-1.1-r2v' \
            --header "Authorization: Bearer $DASHSCOPE_API_KEY")"
          CODE="$(jq -r '.code // "none"' "$RESPONSE_FILE" 2>/dev/null || printf 'unparseable')"
          MESSAGE="$(jq -r '.message // "none"' "$RESPONSE_FILE" 2>/dev/null || printf 'unparseable')"
          printf 'http_code=%s\n' "$HTTP_CODE" >> "$GITHUB_OUTPUT"
          printf 'provider_code=%s\n' "$CODE" >> "$GITHUB_OUTPUT"
          printf 'provider_message=%s\n' "$MESSAGE" >> "$GITHUB_OUTPUT"
          if test "$HTTP_CODE" = "200"; then
            printf 'valid=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'valid=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Report authentication result without exposing the key
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALID: ${{ steps.auth.outputs.valid }}
          HTTP_CODE: ${{ steps.auth.outputs.http_code }}
          PROVIDER_CODE: ${{ steps.auth.outputs.provider_code }}
          PROVIDER_MESSAGE: ${{ steps.auth.outputs.provider_message }}
        run: |
          BODY=$(printf 'DashScope repository-secret authentication check\n\n- region: `Singapore`\n- video task created: `no`\n- free quota consumed: `no`\n- valid: `%s`\n- HTTP: `%s`\n- provider code: `%s`\n- provider message: `%s`\n- run_id: `%s`' "$VALID" "$HTTP_CODE" "$PROVIDER_CODE" "$PROVIDER_MESSAGE" "$GITHUB_RUN_ID")
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/37/comments" \
            -f "body=$BODY"

      - name: Fail when repository-level key is not accepted
        if: steps.auth.outputs.valid != 'true'
        run: exit 1
