name: Remove broken output symlink

on:
  push:
    branches:
      - feature/ci-foundation-smoke-tests
    paths:
      - .github/workflows/remove-output-symlink.yml

permissions:
  contents: write

jobs:
  remove-symlink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ci-foundation-smoke-tests
      - name: Remove tracked output symlink
        run: |
          set -euo pipefail
          if [ ! -L output ]; then
            echo "output is not a symlink"
            exit 1
          fi
          echo "Removing output symlink -> $(readlink output)"
          git rm -- output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: remove broken tracked output symlink"
          git push origin HEAD:feature/ci-foundation-smoke-tests
