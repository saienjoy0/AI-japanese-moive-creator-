name: Japanese Drama Seedance Storyboard Generation Bridge

on:
  pull_request:
    paths:
      - "src/apps/jp_drama/seedance_storyboard/**"
      - "src/apps/jp_drama/workflows/prepare_seedance_storyboard_generation.py"
      - "src/apps/jp_drama/assets/**"
      - "src/apps/jp_drama/generation/**"
      - "src/apps/jp_drama/rendering/minimax_h3_*"
      - "src/apps/jp_drama/rendering/provider_*"
      - "examples/jp_drama/seedance_storyboard/**"
      - "examples/jp_drama/dashscope_live_providers.json"
      - "examples/jp_drama/minimax_h3_live_provider.json"
      - "tests/test_jp_drama_seedance_storyboard_generation_bridge.py"
      - "docs/pr21-seedance-storyboard-generation-bridge.md"
      - ".github/workflows/jp-drama-seedance-storyboard-generation-bridge.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/apps/jp_drama/seedance_storyboard/**"
      - "src/apps/jp_drama/workflows/prepare_seedance_storyboard_generation.py"
      - "src/apps/jp_drama/assets/**"
      - "src/apps/jp_drama/generation/**"
      - "src/apps/jp_drama/rendering/minimax_h3_*"
      - "src/apps/jp_drama/rendering/provider_*"
      - "examples/jp_drama/seedance_storyboard/**"
      - "examples/jp_drama/dashscope_live_providers.json"
      - "examples/jp_drama/minimax_h3_live_provider.json"
      - "tests/test_jp_drama_seedance_storyboard_generation_bridge.py"
      - "docs/pr21-seedance-storyboard-generation-bridge.md"
      - ".github/workflows/jp-drama-seedance-storyboard-generation-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-bridge:
    name: Build H3, Wan, Seedance plans and Asset Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docker.txt
          python -m pip install "pytest>=8,<10"

      - name: Compile bridge and production contracts
        run: |
          python -m compileall -q \
            src/apps/jp_drama/seedance_storyboard \
            src/apps/jp_drama/workflows/prepare_seedance_storyboard_generation.py

      - name: Run bridge regressions
        run: |
          python -m pytest -q \
            tests/test_jp_drama_seedance_storyboard_import.py \
            tests/test_jp_drama_seedance_storyboard_generation_bridge.py

      - name: Import native upstream fixture
        run: |
          rm -rf output/jp_drama/seedance-storyboard
          python -m src.apps.jp_drama.workflows.import_seedance_storyboard \
            --project-dir examples/jp_drama/seedance_storyboard/upstream_fixture \
            --output-dir output/jp_drama/seedance-storyboard

      - name: Build production bridge artifacts
        run: |
          rm -rf output/jp_drama/seedance-storyboard-production
          python -m src.apps.jp_drama.workflows.prepare_seedance_storyboard_generation \
            --input output/jp_drama/seedance-storyboard/seedance_storyboard_package.json \
            --output-dir output/jp_drama/seedance-storyboard-production \
            --routes h3 wan seedance \
            --live-provider-config examples/jp_drama/dashscope_live_providers.json \
            --minimax-h3-config examples/jp_drama/minimax_h3_live_provider.json \
            --print-report

      - name: Verify route-specific contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("output/jp_drama/seedance-storyboard-production")
          report = json.loads((root / "bridge_report.json").read_text(encoding="utf-8"))
          assert report["external_api_calls"] == 0
          assert set(report["episodes"]) == {"E01", "E02"}
          for episode in ("E01", "E02"):
              routes = report["episodes"][episode]["routes"]
              assert set(routes) == {"h3", "wan", "seedance"}
              assert routes["h3"]["segments"] == 1
              assert routes["wan"]["segments"] == 5
              assert routes["seedance"]["segments"] == 1
              assert routes["h3"]["pending_assets"] == 4
              assert routes["wan"]["pending_assets"] == 9
              assert routes["seedance"]["pending_assets"] == 4
          e02_h3 = json.loads(
              (root / "E02" / "h3" / "generation_plan_episode.json")
              .read_text(encoding="utf-8")
          )
          assert e02_h3["segments"][0]["transition_in"] == "continuation"
          assert "将@视频1延长15s" in e02_h3["segments"][0]["prompt_bundle"]["timed_shot_prompt"]
          PY

      - name: Ensure zero credentials, provider calls, and committed media
        run: |
          test -z "${DASHSCOPE_API_KEY:-}"
          test -z "${MINIMAX_API_KEY:-}"
          test -z "${MULEROUTER_API_KEY:-}"
          test -z "$(git ls-files '*.mp4' '*.wav' '*.mp3' '*.png' '*.jpg' | grep 'seedance_storyboard' || true)"

      - name: Upload production bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jp-drama-seedance-storyboard-production-bridge
          path: output/jp_drama/seedance-storyboard-production/
          if-no-files-found: error
          retention-days: 7
