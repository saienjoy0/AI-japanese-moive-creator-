name: Japanese Drama E01-G01 HappyHorse Comment Relay

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e01-g01-happyhorse-comment-relay.yml"
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay safety contract
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              ".github/workflows/jp-drama-e01-g01-happyhorse-comment-relay.yml"
          ).read_text(encoding="utf-8")
          assert "github.event.issue.number == 34" in text
          assert "github.event.comment.user.login == github.repository_owner" in text
          assert "RUN_E01_G01_HAPPYHORSE_R2V_10S_ONCE" in text
          assert "jp-drama-e01-g01-happyhorse-paid-canary.yml/dispatches" in text
          assert "sha256:3ec02df5cebad83874ac04ac3b1711037af70231fa8861e3df939e744b70eb3e" in text
          assert "actions: write" in text
          PY

  dispatch-paid-canary:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 34 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_E01_G01_HAPPYHORSE_R2V_10S_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: jp-drama-e01-g01-happyhorse-comment-relay
      cancel-in-progress: false
    steps:
      - name: Verify PR 34 is merged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "/repos/$GITHUB_REPOSITORY/pulls/34" --jq '.merged')" = "true"

      - name: Dispatch the fixed 10-second paid-canary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_DIGEST: sha256:3ec02df5cebad83874ac04ac3b1711037af70231fa8861e3df939e744b70eb3e
          CONFIRM_PHRASE: RUN_E01_G01_HAPPYHORSE_R2V_10S_ONCE
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/jp-drama-e01-g01-happyhorse-paid-canary.yml/dispatches" \
            -f ref=main \
            -f "inputs[approval_digest]=$APPROVAL_DIGEST" \
            -f "inputs[confirm_paid_run]=$CONFIRM_PHRASE"
