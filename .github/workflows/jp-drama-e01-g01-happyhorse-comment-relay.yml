name: Japanese Drama E01-G01 HappyHorse Comment Relay

on:
  pull_request:
    paths:
      - ".github/workflows/jp-drama-e01-g01-happyhorse-comment-relay.yml"
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: read
  issues: write

jobs:
  contract-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay safety contract
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              ".github/workflows/jp-drama-e01-g01-happyhorse-comment-relay.yml"
          ).read_text(encoding="utf-8")
          assert "github.event.issue.number == 37" in text
          assert "github.event.issue.pull_request == null" in text
          assert "github.event.comment.user.login == github.repository_owner" in text
          assert "RUN_E01_G01_HAPPYHORSE_R2V_10S_ONCE" in text
          assert "CHECK_E01_G01_HAPPYHORSE_STATUS" in text
          assert "jp-drama-e01-g01-happyhorse-paid-canary.yml/dispatches" in text
          assert "RUN_E01_GEMINI_ALGIEBA_NARRATION_ONCE" in text
          assert "CHECK_E01_GEMINI_ALGIEBA_NARRATION_STATUS" in text
          assert "jp-drama-e01-gemini-algieba-narration.yml/dispatches" in text
          assert "event=workflow_dispatch" in text
          assert "sha256:3ec02df5cebad83874ac04ac3b1711037af70231fa8861e3df939e744b70eb3e" in text
          assert "actions: write" in text
          assert "issues: write" in text
          PY

  gemini-algieba-pr-run:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'tmp/gemini-algieba-relay-run-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout main for output branch base
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Gemini SDK
        run: python -m pip install --quiet --upgrade google-genai

      - name: Generate Algieba narration
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          cat > /tmp/synth.py <<'PY'
          import os, base64, wave, json, traceback
          from pathlib import Path
          from google import genai

          out = Path('out')
          lines = {
              'N01': '僕は小さい時、絵を描くことが好きでした。',
              'N02': 'ジムの絵具。なかでも藍と洋紅は、とても美しく見えました。',
              'N03': '取ったあとも、胸は少しも落ち着きませんでした。',
              'N04': 'もう、言い逃れはできませんでした。',
          }
          direction = '''# AUDIO PROFILE
A native Japanese adult male narrator in his late 30s to early 40s. He is the grown-up version of a sensitive, inward-looking boy remembering his childhood.

# SCENE
A quiet literary recollection of childhood in an old school in Yokohama. Beauty, temptation, shame, and the faint warmth of later forgiveness are present beneath the memory.

# DIRECTOR'S NOTES
Natural native Japanese. Warm, smooth, intimate, restrained.
Slightly slow pace, but not sleepy or theatrical.
Not a newsreader, commercial, anime character, or documentary announcer.
Keep sentence endings soft and human.
Do not over-act sadness; let nostalgia and regret stay very light.
Pronounce 藍 as あい and 洋紅 as ようこう clearly.
'''

          def write_wav(path, pcm):
              with wave.open(str(path), 'wb') as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(24000)
                  wf.writeframes(pcm)

          try:
              key = os.environ['GEMINI_API_KEY']
              if not key:
                  raise RuntimeError('GEMINI_API_KEY is empty')
              client = genai.Client(api_key=key)
              manifest = {}
              for name, text in lines.items():
                  prompt = f'{direction}\n# TRANSCRIPT\n[serious, gently reflective, slightly slow] {text}'
                  interaction = client.interactions.create(
                      model='gemini-3.1-flash-tts-preview',
                      input=prompt,
                      response_format={'type': 'audio'},
                      generation_config={'speech_config': [{'voice': 'Algieba'}]},
                  )
                  data = interaction.output_audio.data
                  pcm = base64.b64decode(data) if isinstance(data, str) else data
                  wav_path = out / f'{name}_algieba.wav'
                  write_wav(wav_path, pcm)
                  manifest[name] = {
                      'text': text,
                      'voice': 'Algieba',
                      'model': 'gemini-3.1-flash-tts-preview',
                      'file': wav_path.name,
                  }
              (out / 'manifest.json').write_text(
                  json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
              )
          except Exception:
              (out / 'error.txt').write_text(traceback.format_exc(), encoding='utf-8')
              raise
          PY
          python /tmp/synth.py

      - name: Validate outputs
        run: |
          set -euo pipefail
          for f in out/N01_algieba.wav out/N02_algieba.wav out/N03_algieba.wav out/N04_algieba.wav; do
            test -s "$f"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f"
          done

      - name: Persist narration or diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          printf 'source_sha=%s\n' "$GITHUB_SHA" > out/run_info.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C tmp/gemini-algieba-output-20260810-v3
          rm -rf .tmp/gemini_algieba_narration
          mkdir -p .tmp/gemini_algieba_narration
          cp -a out/. .tmp/gemini_algieba_narration/
          git add .tmp/gemini_algieba_narration
          git commit -m 'tmp: persist Gemini Algieba narration result'
          git push --force origin HEAD:tmp/gemini-algieba-output-20260810-v3

      - name: Upload narration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e01-gemini-algieba-narration-20260810-v3
          path: out/
          if-no-files-found: error
          retention-days: 7

  dispatch-paid-canary:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_E01_G01_HAPPYHORSE_R2V_10S_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: jp-drama-e01-g01-happyhorse-comment-relay
      cancel-in-progress: false
    steps:
      - name: Verify control issue is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "/repos/$GITHUB_REPOSITORY/issues/37" --jq '.state')" = "open"

      - name: Dispatch the fixed 10-second paid-canary workflow
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_DIGEST: sha256:3ec02df5cebad83874ac04ac3b1711037af70231fa8861e3df939e744b70eb3e
          CONFIRM_PHRASE: RUN_E01_G01_HAPPYHORSE_R2V_10S_ONCE
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/jp-drama-e01-g01-happyhorse-paid-canary.yml/dispatches" \
            -f ref=main \
            -f "inputs[approval_digest]=$APPROVAL_DIGEST" \
            -f "inputs[confirm_paid_run]=$CONFIRM_PHRASE"

  report-paid-canary-status:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'CHECK_E01_G01_HAPPYHORSE_STATUS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read latest paid-canary workflow_dispatch run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/jp-drama-e01-g01-happyhorse-paid-canary.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0]')"
          test -n "$RUN_JSON"
          test "$RUN_JSON" != "null"
          RUN_ID="$(jq -r '.id' <<<"$RUN_JSON")"
          RUN_NUMBER="$(jq -r '.run_number' <<<"$RUN_JSON")"
          STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion // "pending"' <<<"$RUN_JSON")"
          URL="$(jq -r '.html_url' <<<"$RUN_JSON")"
          CREATED_AT="$(jq -r '.created_at' <<<"$RUN_JSON")"
          BODY=$(printf 'E01-G01 HappyHorse R2V status\n\n- run: #%s\n- run_id: `%s`\n- status: `%s`\n- conclusion: `%s`\n- created_at: `%s`\n- URL: %s' "$RUN_NUMBER" "$RUN_ID" "$STATUS" "$CONCLUSION" "$CREATED_AT" "$URL")
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/37/comments" \
            -f "body=$BODY"

  dispatch-gemini-algieba-narration:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'RUN_E01_GEMINI_ALGIEBA_NARRATION_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: jp-drama-e01-gemini-algieba-narration-relay
      cancel-in-progress: false
    steps:
      - name: Verify control issue is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "/repos/$GITHUB_REPOSITORY/issues/37" --jq '.state')" = "open"

      - name: Dispatch fixed Gemini Algieba narration workflow
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_PHRASE: RUN_E01_GEMINI_ALGIEBA_NARRATION_ONCE
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/jp-drama-e01-gemini-algieba-narration.yml/dispatches" \
            -f ref=main \
            -f "inputs[confirm_run]=$CONFIRM_PHRASE"

  report-gemini-algieba-narration-status:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 37 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'CHECK_E01_GEMINI_ALGIEBA_NARRATION_STATUS'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read latest Gemini narration workflow_dispatch run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_JSON="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/jp-drama-e01-gemini-algieba-narration.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0]')"
          test -n "$RUN_JSON"
          test "$RUN_JSON" != "null"
          RUN_ID="$(jq -r '.id' <<<"$RUN_JSON")"
          RUN_NUMBER="$(jq -r '.run_number' <<<"$RUN_JSON")"
          STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion // "pending"' <<<"$RUN_JSON")"
          URL="$(jq -r '.html_url' <<<"$RUN_JSON")"
          CREATED_AT="$(jq -r '.created_at' <<<"$RUN_JSON")"
          BODY=$(printf 'E01 Gemini Algieba narration status\n\n- run: #%s\n- run_id: `%s`\n- status: `%s`\n- conclusion: `%s`\n- created_at: `%s`\n- URL: %s' "$RUN_NUMBER" "$RUN_ID" "$STATUS" "$CONCLUSION" "$CREATED_AT" "$URL")
          gh api --method POST \
            "/repos/$GITHUB_REPOSITORY/issues/37/comments" \
            -f "body=$BODY"
